<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Offline · Capital Q</title>
    <!--
      Served by the service worker when a page cannot be reached. It must
      stand alone: no build assets, no fonts, no data. System colours follow
      the device's light or dark scheme without a colour value of its own.
    -->
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 16px
          max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 22rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      h1 {
        font-size: 1.25rem;
        line-height: 1.3;
        margin: 0;
      }
      p {
        margin: 0;
        line-height: 1.5;
        opacity: 0.75;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid currentColor;
        border-radius: 999px;
        color: inherit;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        width="40"
        height="40"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="11.5" cy="11.5" r="7.5" />
        <path d="M15.5 15.5 20 20" />
      </svg>
      <h1>You're offline.</h1>
      <p>
        Capital Q needs a connection to show anything current. Try again when
        you're back online.
      </p>
      <a href="/discover">Try again</a>
    </main>
  </body>
</html>
