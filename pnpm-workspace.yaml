packages:
  - "apps/*"
  - "packages/*"
# Install/lifecycle scripts are denied by default and approved case by case
# (doc 15, 109: review install scripts for high-risk dependencies; TM-SC-01).
# unrs-resolver is a native resolver pulled in transitively by
# eslint-config-next; it ships prebuilt platform binaries as optional
# dependencies, so its build script is not required for lint to resolve imports.
allowBuilds:
  # @google/genai's "prepare" is a maintainer step and protobufjs's postinstall
  # only prints a notice; neither is needed at runtime (CQ-Q-005).
  "@google/genai": false
  protobufjs: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - "@testing-library/user-event@14.6.7"
  - "@supabase/auth-js@2.114.0"
  - "@supabase/functions-js@2.114.0"
  - "@supabase/postgrest-js@2.114.0"
  - "@supabase/realtime-js@2.114.0"
  - "@supabase/storage-js@2.114.0"
  - "@supabase/supabase-js@2.114.0"
  - "@langchain/langgraph-sdk@1.10.2"
  - "@langchain/langgraph@1.4.14"
