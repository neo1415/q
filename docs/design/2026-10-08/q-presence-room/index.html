<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Q presence room (design)</title>
    <!--
  Q presence room (founder, Zino, 2026-10-08). Query:
    ?screen=room|held|confirm|command|dock|location &device=phone|desktop &theme=light|dark

  1. Presence: no human face. Q morphs through cloud, lean, spiral, ring,
     wave (speaking), "?", the Q mark; never a face. (Code: FACE figure gone.)
  2. Arrival briefing cards sit AROUND the presence, not under a column:
       desktop (>= 1024 px): left column + right column flanking Q; cards
       alternate left, right, left... One card is in focus (full verbs,
       raised); the others are a short line each (who + what), tappable to
       bring into focus. Motion: focus moves with a 220 ms ease-out
       transform/opacity (no layout jump); prefers-reduced-motion: instant.
       narrow (< 1024 px): Q on top, the cards below it, focus card first.
  3. Summary of ALL items up front, said and shown:
       "Three things: Spheros reply is held, Tensorgate wants a call
        Thursday, and Clearwater sent their deck."
     Then one command line: "Tell Q what to do with these" (voice or text).
     Any words: "send the Tensorgate one but make it warmer", "ignore
     Spheros", "book Thursday at 3". The person's own transcript is read
     (never the voice model's paraphrase) into a typed action on one card.
     An edit (warmer, Thursday at 3) becomes a new message shown in full:
     "Send this exact message?" Nothing outward happens on the first word.
  4. Held cards: Send as is (-> "Send this exact message?") · Edit & send ·
     Ask Q to try again (re-runs writer + reviewer now; a pass comes back as
     an ordinary approval card) · Dismiss · Later. Same in the briefing, the
     dock and Work.
  5. "Where" reads "Location".
  Research, briefly: Superhuman one-at-a-time triage; Apple Vision Pro
  ornaments (controls flank the subject, never over it); Google Assistant
  rule of three for the spoken gist; Material 3 motion (220 ms standard
  decelerate for focus changes). Fictional people and companies.
-->
    <style>
      :root {
        --cq-font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue",
          Arial, sans-serif;
        --cq-radius-md: 12px;
        --cq-radius-lg: 16px;
      }
      [data-theme="light"] {
        --cq-canvas: #f6f4ef;
        --cq-surface: #fbfaf7;
        --cq-surface-raised: #fff;
        --cq-surface-sunken: #efebe2;
        --cq-text-primary: #16140f;
        --cq-text-secondary: #4f4a40;
        --cq-text-tertiary: #655e51;
        --cq-border-subtle: #e7e1d5;
        --cq-border: #d9d1c1;
        --cq-border-strong: #8f8673;
        --cq-accent: #8a6a12;
        --cq-q: #c9a227;
        --cq-warning: #8a5a00;
        --cq-chrome: #16140f;
        --cq-chrome-text: #f4efe2;
        --cq-chrome-muted: #bfb6a2;
        --cq-on-accent: #fff;
      }
      [data-theme="dark"] {
        --cq-canvas: #0f0e0b;
        --cq-surface: #17150f;
        --cq-surface-raised: #1d1a13;
        --cq-surface-sunken: #131109;
        --cq-text-primary: #f4efe2;
        --cq-text-secondary: #c9c0ab;
        --cq-text-tertiary: #a59c87;
        --cq-border-subtle: #2a261c;
        --cq-border: #3a3427;
        --cq-border-strong: #7a715c;
        --cq-accent: #c9a227;
        --cq-q: #e0bd4a;
        --cq-warning: #e0b04a;
        --cq-chrome: #0b0a08;
        --cq-chrome-text: #f4efe2;
        --cq-chrome-muted: #bfb6a2;
        --cq-on-accent: #16140f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--cq-font-sans);
        background: var(--cq-canvas);
        color: var(--cq-text-primary);
        font-size: 15px;
        line-height: 1.5;
      }
      .frame {
        display: flex;
        min-height: 100vh;
      }
      .side {
        width: 232px;
        flex: none;
        background: var(--cq-chrome);
        color: var(--cq-chrome-muted);
        padding: 20px 14px;
        font-size: 14px;
      }
      .side b {
        color: var(--cq-chrome-text);
        display: block;
        margin-bottom: 18px;
      }
      .side a {
        display: block;
        padding: 8px 10px;
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
      }
      .side a.on {
        background: #ffffff14;
        color: var(--cq-chrome-text);
      }
      main {
        flex: 1;
        padding: 32px 16px 120px;
        position: relative;
        min-width: 0;
      }
      .phone .side {
        display: none;
      }
      h1 {
        font-size: 28px;
        line-height: 1.2;
        margin: 0;
        text-align: center;
      }
      .lead {
        color: var(--cq-text-secondary);
        text-align: center;
        max-width: 60ch;
        margin: 8px auto 0;
      }
      /* The room: Q in the middle, cards flanking it. */
      .room {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px minmax(0, 1fr);
        gap: 24px;
        align-items: center;
        max-width: 1180px;
        margin: 24px auto 0;
      }
      .phone .room {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .presence {
        display: grid;
        place-items: center;
      }
      .phone .presence {
        order: -1;
      }
      .phone .col.right {
        order: 2;
      }
      .orb {
        width: 240px;
        height: 240px;
        position: relative;
      }
      .phone .orb {
        width: 140px;
        height: 140px;
      }
      .orb svg {
        width: 100%;
        height: 100%;
      }
      .state {
        margin-top: 6px;
        font-size: 13px;
        color: var(--cq-text-secondary);
        text-align: center;
      }
      .card {
        background: var(--cq-surface-raised);
        border: 1px solid var(--cq-border);
        border-radius: var(--cq-radius-lg);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition:
          transform 220ms cubic-bezier(0.2, 0, 0, 1),
          opacity 220ms;
      }
      .card.focus {
        border-color: var(--cq-border-strong);
        box-shadow: 0 8px 28px #0000001a;
      }
      .line {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 52px;
        padding: 8px 12px;
        background: var(--cq-surface);
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-md);
        color: var(--cq-text-secondary);
        font-size: 14px;
      }
      .line b {
        color: var(--cq-text-primary);
        font-weight: 600;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
      }
      .mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        flex: none;
        background: var(--cq-surface-sunken);
        color: var(--cq-text-secondary);
        font-size: 12px;
        font-weight: 600;
      }
      .name {
        font-weight: 600;
        font-size: 14px;
      }
      .meta {
        font-size: 12px;
        color: var(--cq-text-tertiary);
      }
      .cap {
        font-size: 12px;
        color: var(--cq-text-tertiary);
        margin: 0 0 2px;
      }
      blockquote {
        margin: 0;
        background: var(--cq-surface-sunken);
        border-radius: var(--cq-radius-md);
        padding: 10px 12px;
        font-size: 14px;
        white-space: pre-wrap;
      }
      .why {
        font-size: 13px;
        color: var(--cq-text-secondary);
        display: flex;
        gap: 6px;
      }
      .why span:first-child {
        color: var(--cq-warning);
        font-weight: 700;
      }
      .verbs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      button {
        font: inherit;
        font-size: 14px;
        min-height: 44px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--cq-text-secondary);
        cursor: pointer;
      }
      button.primary {
        background: var(--cq-accent);
        color: var(--cq-on-accent);
        font-weight: 600;
      }
      button.secondary {
        border-color: var(--cq-border);
        color: var(--cq-text-primary);
        background: var(--cq-surface);
      }
      .summary {
        max-width: 720px;
        margin: 20px auto 0;
        text-align: center;
        font-size: 17px;
        color: var(--cq-text-primary);
      }
      .bar {
        max-width: 640px;
        margin: 20px auto 0;
        display: flex;
        gap: 8px;
        align-items: center;
        border: 1px solid var(--cq-border);
        border-radius: 999px;
        background: var(--cq-surface-raised);
        padding: 4px 4px 4px 16px;
      }
      .bar input {
        flex: 1;
        border: 0;
        background: transparent;
        font: inherit;
        color: var(--cq-text-primary);
        min-height: 44px;
        outline: none;
      }
      .bar .mic {
        width: 44px;
        padding: 0;
        border-radius: 999px;
        border: 1px solid var(--cq-border);
      }
      .heard {
        max-width: 640px;
        margin: 10px auto 0;
        font-size: 13px;
        color: var(--cq-text-secondary);
        text-align: center;
      }
      .count {
        font-size: 12px;
        color: var(--cq-text-tertiary);
      }
      .dock {
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: min(380px, calc(100vw - 32px));
        background: var(--cq-surface-raised);
        border: 1px solid var(--cq-border);
        border-radius: var(--cq-radius-lg);
        padding: 14px;
        box-shadow: 0 12px 32px #00000026;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .facts {
        max-width: 720px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 8px 16px;
        background: var(--cq-surface-raised);
        border: 1px solid var(--cq-border);
        border-radius: var(--cq-radius-lg);
        padding: 20px;
      }
      .facts dt {
        color: var(--cq-text-tertiary);
        font-size: 13px;
      }
      .facts dd {
        margin: 0;
      }
      .note {
        max-width: 720px;
        margin: 12px auto 0;
        font-size: 13px;
        color: var(--cq-text-tertiary);
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <nav class="side" aria-label="App">
        <b>Capital Q</b>
        <a class="on" href="#">Q</a><a href="#">Work</a><a href="#">Capital</a
        ><a href="#">Investors</a><a href="#">Settings</a>
      </nav>
      <main id="main"></main>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const screen = params.get("screen") ?? "room";
      const device = params.get("device") ?? "desktop";
      document.documentElement.dataset.theme = params.get("theme") ?? "light";
      if (device === "phone") document.body.classList.add("phone");
      const main = document.getElementById("main");

      // Q's presence: points of light in a ring-and-tail Q mark (no face).
      function orb() {
        let dots = "";
        for (let i = 0; i < 220; i += 1) {
          const t = (i / 220) * Math.PI * 2;
          const r = 70 + Math.sin(i * 12.9898) * 6;
          let x = 120 + Math.cos(t) * r;
          let y = 120 + Math.sin(t) * r;
          if (i > 190) {
            const k = (i - 190) / 30;
            x = 160 + k * 45;
            y = 160 + k * 45;
          }
          const a = 0.35 + ((i * 7) % 10) / 16;
          dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" fill="var(--cq-q)" opacity="${a.toFixed(2)}"/>`;
        }
        return `<div class="orb" aria-hidden="true"><svg viewBox="0 0 240 240">${dots}</svg></div>`;
      }
      const verbsHeld = `<div class="verbs">
          <button class="primary">Send as is</button>
          <button class="secondary">Edit &amp; send</button>
          <button>Ask Q to try again</button>
          <button>Dismiss</button><button>Later</button></div>`;
      const heldCard = (focus = true) => `
        <article class="card ${focus ? "focus" : ""}">
          <div class="who"><span class="mark">SP</span><div><div class="name">Spheros</div><div class="meta">Q held a message · not sent · 1 of 3</div></div></div>
          <div><p class="cap">What Q drafted</p>
          <blockquote>Hi Ada, your grid-storage pilot numbers caught my eye, especially the 31% cost drop at Ikeja. Would 20 minutes next week work to hear how you plan the second site?</blockquote></div>
          <p class="why"><span aria-hidden="true">!</span><span>Q's reviewer couldn't check it, so it wasn't sent. Send it as it is, edit it, or ask Q to try again.</span></p>
          ${verbsHeld}
        </article>`;
      const line = (mark, who, what) =>
        `<button class="line" style="text-align:left;width:100%"><span class="mark">${mark}</span><span><b>${who}</b><br/>${what}</span></button>`;
      const summary = `<p class="summary" data-summary>Three things: the Spheros reply is held, Tensorgate wants a call Thursday, and Clearwater sent their deck.</p>`;
      const bar = (value = "") =>
        `<div class="bar"><input aria-label="Tell Q what to do" placeholder="Tell Q what to do with these" value="${value}"/><button class="mic" aria-label="Speak">●</button></div>`;

      function room(focus) {
        return `<h1>Good morning, Zino.</h1>
          <p class="lead">Q sent four replies and booked one call since yesterday.</p>
          ${summary}
          <section class="room" aria-label="Needs you">
            <div class="col left">${focus}</div>
            <div class="presence">${orb()}<p class="state">Q · listening</p></div>
            <div class="col right">
              ${line("TG", "Tensorgate", "Wants a call Thursday · reply ready")}
              ${line("CW", "Clearwater Assurance", "Sent their deck · reply ready")}
              <p class="count">Tap one to bring it forward. Anything left stays in Needs you on Work.</p>
            </div>
          </section>
          ${bar()}
          <p class="heard">Say or type anything: “send the Tensorgate one but make it warmer”, “ignore Spheros”, “book Thursday at 3”.</p>`;
      }

      if (screen === "room") main.innerHTML = room(heldCard());
      if (screen === "held")
        main.innerHTML = `<div style="max-width:640px;margin:0 auto">${heldCard()}</div>`;
      if (screen === "confirm") {
        main.innerHTML = room(`<article class="card focus">
            <div class="who"><span class="mark">SP</span><div><div class="name">Spheros</div><div class="meta">Q held a message · not sent</div></div></div>
            <p style="margin:0;font-weight:600">Send this exact message?</p>
            <blockquote>Hi Ada, your grid-storage pilot numbers caught my eye, especially the 31% cost drop at Ikeja. Would 20 minutes next week work to hear how you plan the second site?</blockquote>
            <div class="verbs"><button class="primary">Yes, send this</button><button class="secondary">Edit</button><button>Cancel</button></div>
            <p class="cap">Nothing is sent until you say yes. It goes exactly as shown.</p>
          </article>`);
      }
      if (screen === "command") {
        main.innerHTML = `<h1>Good morning, Zino.</h1>${summary}
          <section class="room" aria-label="Needs you">
            <div class="col left">${line("SP", "Spheros", "Held · not sent")}</div>
            <div class="presence">${orb()}<p class="state">Q · waiting on you</p></div>
            <div class="col right"><article class="card focus">
              <div class="who"><span class="mark">TG</span><div><div class="name">Tensorgate</div><div class="meta">Your words: “send the Tensorgate one but make it warmer”</div></div></div>
              <p style="margin:0;font-weight:600">Here's it warmer. Send this exact message?</p>
              <blockquote>Hi Kemi, thank you, I'd really enjoy that. Thursday works well for me; would 3pm suit you? Looking forward to hearing more about the inference work.</blockquote>
              <div class="verbs"><button class="primary">Yes, send this</button><button class="secondary">Edit</button><button>Cancel</button></div>
              <p class="cap">Nothing is sent until you say yes.</p>
            </article>
            ${line("CW", "Clearwater Assurance", "Sent their deck · reply ready")}</div>
          </section>${bar("send the Tensorgate one but make it warmer")}
          <p class="heard">Read from your own words, not Q's paraphrase.</p>`;
      }
      if (screen === "dock") {
        main.innerHTML = `<h1 style="text-align:left">Work</h1><p class="lead" style="text-align:left;margin:8px 0">Any page; Q's dock carries the briefing.</p>
          <div class="dock"><p style="margin:0;font-size:14px;color:var(--cq-text-secondary)"><b style="color:var(--cq-text-primary)">Three things:</b> Spheros held, Tensorgate wants Thursday, Clearwater sent their deck.</p>
          <article class="card focus" style="padding:12px">
            <div class="who"><span class="mark">SP</span><div><div class="name">Spheros</div><div class="meta">Held · not sent · 1 of 3</div></div></div>
            <blockquote style="max-height:96px;overflow:auto">Hi Ada, your grid-storage pilot numbers caught my eye…</blockquote>
            ${verbsHeld}</article>${bar()}</div>`;
      }
      if (screen === "location") {
        main.innerHTML = `<dl class="facts"><dt>Stage</dt><dd>Seed</dd><dt>Sector</dt><dd>Climate · grid storage</dd><dt>Location</dt><dd>Lagos, Nigeria</dd><dt>Raising</dt><dd>USD 1,500,000</dd></dl>
          <p class="note">“Where” reads “Location” on company, fit and card facts.</p>`;
      }
    </script>
  </body>
</html>
