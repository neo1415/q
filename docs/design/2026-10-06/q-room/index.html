<!doctype html>
<html lang="en" data-theme="bg-dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>The Q room (design prototype)</title>
    <!--
  Q room design prototype (brief: docs/handoff/q-room-2026-10-06-plan.md,
  research: docs/research/2026-10-06/q-room-*.md). Nine scripted scenes the
  founder can click through, or play end to end on the timeline.
  Fictional people, companies and documents only.

  Query: ?scene=1..9 &step=0.. &speed=0.5 (timeline pace) &theme=bg-dark|bg-light|dark|light
         &device=phone|desktop &motion=reduce &bare=1 (no prototype bar)
         &static=1 (speech fully revealed, for screenshots) &play=1
  Keys: left/right = step, space = play/pause.
-->
    <style>
      :root {
        --cq-font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue",
          Arial, sans-serif;
        --cq-font-editorial: Georgia, "Times New Roman", serif;
        --cq-radius-md: 10px;
        --cq-radius-lg: 16px;
        --cq-motion-fast: 140ms;
        --cq-motion-base: 220ms;
        --cq-motion-slow: 360ms;
        --cq-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --cq-z-presence: 30;
        --cq-z-modal: 40;
      }
      [data-theme="light"] {
        --cq-canvas: oklch(0.985 0.004 92);
        --cq-surface: oklch(0.995 0.002 92);
        --cq-surface-raised: #fff;
        --cq-surface-subtle: oklch(0.965 0.005 92);
        --cq-text-primary: oklch(0.19 0.012 258);
        --cq-text-secondary: oklch(0.43 0.012 258);
        --cq-text-tertiary: oklch(0.53 0.01 258);
        --cq-border-subtle: oklch(0.91 0.006 258);
        --cq-border: oklch(0.86 0.008 258);
        --cq-border-strong: oklch(0.71 0.012 258);
        --cq-accent: oklch(0.53 0.18 258);
        --cq-accent-soft: oklch(0.94 0.035 258);
        --cq-on-accent: #fff;
        --cq-positive: oklch(0.5 0.13 151);
        --cq-positive-soft: oklch(0.95 0.035 151);
        --cq-warning: oklch(0.53 0.12 70);
        --cq-warning-soft: oklch(0.96 0.045 78);
        --cq-chrome: var(--cq-surface);
        --cq-chrome-text: var(--cq-text-primary);
        --cq-chrome-muted: var(--cq-text-secondary);
        --cq-chrome-border: var(--cq-border-subtle);
        --cq-chrome-accent: var(--cq-accent);
        --cq-q-light: oklch(0.53 0.18 258);
        --cq-q-bloom: oklch(0.53 0.18 258 / 0.2);
        --cq-highlight: oklch(0.93 0.06 258);
        --cq-paper: #fff;
        --cq-paper-text: #1d1d1f;
        --cq-scrim: oklch(0.2 0.01 258 / 0.38);
        --cq-card-hue-1: #2a78d6;
        --cq-card-hue-2: #d95926;
        --cq-card-hue-3: #199e70;
        --cq-card-rank-text: #fff;
        --q-blend: source-over;
      }
      [data-theme="dark"] {
        --cq-canvas: oklch(0.16 0.01 258);
        --cq-surface: oklch(0.19 0.01 258);
        --cq-surface-raised: oklch(0.22 0.011 258);
        --cq-surface-subtle: oklch(0.25 0.01 258);
        --cq-text-primary: oklch(0.95 0.005 92);
        --cq-text-secondary: oklch(0.77 0.008 258);
        --cq-text-tertiary: oklch(0.66 0.008 258);
        --cq-border-subtle: oklch(0.28 0.01 258);
        --cq-border: oklch(0.34 0.011 258);
        --cq-border-strong: oklch(0.5 0.012 258);
        --cq-accent: oklch(0.72 0.15 258);
        --cq-accent-soft: oklch(0.28 0.06 258);
        --cq-on-accent: oklch(0.16 0.01 258);
        --cq-positive: oklch(0.74 0.12 151);
        --cq-positive-soft: oklch(0.27 0.05 151);
        --cq-warning: oklch(0.8 0.12 78);
        --cq-warning-soft: oklch(0.3 0.06 78);
        --cq-chrome: var(--cq-surface);
        --cq-chrome-text: var(--cq-text-primary);
        --cq-chrome-muted: var(--cq-text-secondary);
        --cq-chrome-border: var(--cq-border-subtle);
        --cq-chrome-accent: var(--cq-accent);
        --cq-q-light: oklch(0.76 0.14 258);
        --cq-q-bloom: oklch(0.72 0.15 258 / 0.28);
        --cq-highlight: oklch(0.9 0.08 258);
        --cq-paper: #fbfaf7;
        --cq-paper-text: #1d1d1f;
        --cq-scrim: oklch(0.08 0.01 258 / 0.6);
        --cq-card-hue-1: #3987e5;
        --cq-card-hue-2: #e0703f;
        --cq-card-hue-3: #27b583;
        --cq-card-rank-text: #0b0c10;
        --q-blend: lighter;
      }
      [data-theme="bg-light"] {
        --cq-canvas: #f6f4ef;
        --cq-surface: #fbfaf7;
        --cq-surface-raised: #fff;
        --cq-surface-subtle: #f1ede4;
        --cq-text-primary: #16140f;
        --cq-text-secondary: #4f4a40;
        --cq-text-tertiary: #655e51;
        --cq-border-subtle: #e7e1d5;
        --cq-border: #d9d1c1;
        --cq-border-strong: #8f8673;
        --cq-accent: #8a6a12;
        --cq-accent-soft: #f3ead2;
        --cq-on-accent: #fff;
        --cq-positive: oklch(0.5 0.13 151);
        --cq-positive-soft: oklch(0.95 0.035 151);
        --cq-warning: oklch(0.53 0.12 70);
        --cq-warning-soft: oklch(0.96 0.045 78);
        --cq-chrome: #16140f;
        --cq-chrome-text: #f4efe2;
        --cq-chrome-muted: #bfb6a2;
        --cq-chrome-border: #2f2b22;
        --cq-chrome-accent: #e2b858;
        --cq-q-light: #a8841c;
        --cq-q-bloom: #c9a22740;
        --cq-highlight: #f1dc9c;
        --cq-paper: #fff;
        --cq-paper-text: #16140f;
        --cq-scrim: #16140f61;
        --cq-card-hue-1: #2a78d6;
        --cq-card-hue-2: #d95926;
        --cq-card-hue-3: #199e70;
        --cq-card-rank-text: #fff;
        --q-blend: source-over;
      }
      [data-theme="bg-dark"] {
        --cq-canvas: #0f0e0b;
        --cq-surface: #17150f;
        --cq-surface-raised: #1d1a13;
        --cq-surface-subtle: #24211a;
        --cq-text-primary: #f4efe2;
        --cq-text-secondary: #c9c0ab;
        --cq-text-tertiary: #a59c87;
        --cq-border-subtle: #2a261c;
        --cq-border: #3a3427;
        --cq-border-strong: #7a715c;
        --cq-accent: #c9a227;
        --cq-accent-soft: #2e2714;
        --cq-on-accent: #16140f;
        --cq-positive: oklch(0.74 0.12 151);
        --cq-positive-soft: oklch(0.27 0.05 151);
        --cq-warning: oklch(0.8 0.12 78);
        --cq-warning-soft: oklch(0.3 0.06 78);
        --cq-chrome: #16140f;
        --cq-chrome-text: #f4efe2;
        --cq-chrome-muted: #bfb6a2;
        --cq-chrome-border: #2f2b22;
        --cq-chrome-accent: #e2b858;
        --cq-q-light: #e2b858;
        --cq-q-bloom: #e2b85866;
        --cq-highlight: #f1dc9c;
        --cq-paper: #fbf8f0;
        --cq-paper-text: #16140f;
        --cq-scrim: #000000a6;
        --cq-card-hue-1: #3987e5;
        --cq-card-hue-2: #e0703f;
        --cq-card-hue-3: #27b583;
        --cq-card-rank-text: #0b0c10;
        --q-blend: lighter;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--cq-canvas);
        color: var(--cq-text-primary);
        font: 15px/1.45 var(--cq-font-sans);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      :focus-visible {
        outline: 2px solid var(--cq-accent);
        outline-offset: 2px;
        border-radius: 6px;
      }
      svg.i {
        width: 20px;
        height: 20px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      /* ---------- prototype controls (not product UI) ---------- */
      .proto {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 8px 14px;
        background: #202022;
        color: #ececec;
        font-size: 13px;
        border-bottom: 1px solid #333;
      }
      .proto b {
        font-weight: 600;
      }
      .proto select,
      .proto button {
        background: #2d2d30;
        color: #ececec;
        border: 1px solid #47474b;
        border-radius: 8px;
        min-height: 34px;
        padding: 0 10px;
        font-size: 13px;
      }
      .proto button[aria-pressed="true"] {
        background: #ececec;
        color: #202022;
      }
      .proto .grp {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .tl {
        flex: 1 1 360px;
        display: flex;
        gap: 3px;
        min-width: 260px;
      }
      .tl button {
        flex: var(--w) 1 0;
        min-height: 28px;
        padding: 0;
        position: relative;
        overflow: hidden;
        font-size: 11px;
        color: #bbb;
        border-radius: 5px;
      }
      .tl button i {
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--p, 0%);
        background: #5c5c62;
      }
      .tl button span {
        position: relative;
      }
      .tl button.on {
        border-color: #ececec;
        color: #fff;
      }
      .bare .proto {
        display: none;
      }

      /* ---------- frame + shell ---------- */
      .stagewrap {
        display: grid;
        place-items: start center;
        min-height: calc(100vh - 52px);
      }
      .bare .stagewrap {
        min-height: 100vh;
      }
      .frame {
        container: app/inline-size;
        position: relative;
        width: 100%;
        height: calc(100vh - 52px);
        overflow: hidden;
        background: var(--cq-canvas);
      }
      .bare .frame {
        height: 100vh;
      }
      .device-phone .frame {
        width: 390px;
        height: min(844px, calc(100vh - 68px));
        margin-top: 8px;
        border-radius: 28px;
        border: 1px solid var(--cq-border);
        box-shadow: 0 20px 60px rgb(0 0 0 / 0.25);
      }
      .bare.device-phone .frame {
        width: 100%;
        height: 100vh;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .app {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        height: 100%;
      }
      .nav {
        background: var(--cq-chrome);
        color: var(--cq-chrome-text);
        border-right: 1px solid var(--cq-chrome-border);
        padding: 20px 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        padding: 4px 10px 18px;
      }
      .mark {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid var(--cq-chrome-accent);
        display: inline-block;
        position: relative;
        flex: none;
      }
      .mark:after {
        content: "";
        position: absolute;
        width: 7px;
        height: 2.5px;
        background: var(--cq-chrome-accent);
        right: -4px;
        bottom: 0;
        transform: rotate(45deg);
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 10px;
        border-radius: 8px;
        color: var(--cq-chrome-muted);
        text-decoration: none;
      }
      .nav a.on {
        background: color-mix(in oklab, var(--cq-chrome-text) 9%, transparent);
        color: var(--cq-chrome-text);
        font-weight: 500;
      }
      .nav a b {
        margin-left: auto;
        font-weight: 600;
        font-size: 12px;
        min-width: 20px;
        height: 20px;
        border-radius: 10px;
        display: inline-grid;
        place-items: center;
        background: var(--cq-chrome-accent);
        color: var(--cq-chrome);
      }
      .nav .me {
        margin-top: auto;
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px;
        color: var(--cq-chrome-muted);
        font-size: 13px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: color-mix(in oklab, var(--cq-chrome-text) 14%, transparent);
        color: var(--cq-chrome-text);
        font-weight: 600;
        font-size: 12px;
        flex: none;
      }
      .bottomnav {
        display: none;
      }

      .main {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        min-width: 0;
        min-height: 0;
        position: relative;
      }
      .seeing {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 32px 0;
        color: var(--cq-text-tertiary);
        font-size: 13px;
        min-height: 36px;
      }
      .seeing .eye {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1.5px solid currentColor;
        position: relative;
        flex: none;
      }
      .seeing .eye:after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: currentColor;
      }
      .seeing .lbl {
        color: var(--cq-text-secondary);
      }
      .seeing .dots {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .seeing .dots span + span:before {
        content: "·";
        margin-right: 6px;
      }
      .seeing .modalnote {
        color: var(--cq-text-secondary);
      }
      .seeing .right {
        margin-left: auto;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .soundbtn {
        min-height: 44px;
        min-width: 44px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--cq-text-secondary);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .soundbtn:hover {
        background: var(--cq-surface-subtle);
      }
      .hum {
        display: inline-flex;
        gap: 2px;
        align-items: center;
        height: 14px;
      }
      .hum i {
        width: 2px;
        height: 4px;
        background: var(--cq-text-secondary);
        border-radius: 1px;
      }
      .humming .hum i {
        animation: hum 1.6s var(--cq-ease) infinite;
      }
      .humming .hum i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .humming .hum i:nth-child(3) {
        animation-delay: 0.4s;
      }
      .humming .hum i:nth-child(4) {
        animation-delay: 0.6s;
      }
      @keyframes hum {
        0%,
        100% {
          height: 4px;
        }
        50% {
          height: 12px;
        }
      }

      /* Stage: presence + current exchange */
      .stage {
        display: grid;
        grid-template-columns: 132px minmax(0, 1fr);
        gap: 20px;
        align-items: center;
        padding: 8px 32px 16px;
        min-height: 150px;
      }
      .presence {
        position: relative;
        width: 132px;
        height: 132px;
      }
      .presence canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .qstate {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--cq-text-secondary);
        margin-bottom: 6px;
        min-height: 20px;
      }
      .qstate .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--cq-q-light);
      }
      .you {
        color: var(--cq-text-secondary);
        font-size: 15px;
        margin: 0 0 6px;
        min-height: 22px;
      }
      .you:not(:empty):before {
        content: "You: ";
        color: var(--cq-text-tertiary);
      }
      .qline {
        font-size: 24px;
        line-height: 1.3;
        font-weight: 500;
        letter-spacing: -0.01em;
        margin: 0;
        max-width: 52ch;
        text-wrap: pretty;
      }
      .qline .w {
        transition: color var(--cq-motion-base) var(--cq-ease);
      }
      .qline .w.later {
        color: var(--cq-text-tertiary);
      }
      .qline.quote-wrap {
        font-family: var(--cq-font-editorial);
        font-weight: 400;
      }
      .memo svg {
        width: 13px;
        height: 13px;
      }
      .memo {
        font-size: 12.5px;
        color: var(--cq-text-tertiary);
        margin-top: 6px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .lines {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 14px;
        color: var(--cq-text-secondary);
      }
      .lines li {
        display: flex;
        gap: 8px;
        align-items: baseline;
        animation: rise var(--cq-motion-slow) var(--cq-ease) both;
      }
      .lines li:before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--cq-border-strong);
        flex: none;
        transform: translateY(-2px);
      }
      .lines li.cur {
        color: var(--cq-text-primary);
      }
      .lines li.cur:before {
        background: var(--cq-q-light);
      }
      .lines li.mem {
        color: var(--cq-text-primary);
      }
      .lines li small {
        color: var(--cq-text-tertiary);
        font-size: 12px;
        margin-left: 4px;
      }

      /* Room: focus area + rail */
      .room {
        display: grid;
        align-content: start;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 20px;
        padding: 0 32px 16px;
        min-height: 0;
        overflow: auto;
      }
      .focus {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
      }
      .rail {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      .rail h3 {
        font-size: 13px;
        font-weight: 600;
        color: var(--cq-text-secondary);
        margin: 4px 0 0;
      }
      .empty {
        color: var(--cq-text-tertiary);
        font-size: 14px;
        padding: 4px 0;
      }
      .nowitem {
        display: flex;
        gap: 10px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--cq-border-subtle);
        background: var(--cq-surface);
      }
      .nowitem .k {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: none;
        margin-top: 1px;
      }
      .nowitem.run .k {
        border: 2px solid var(--cq-q-light);
        border-right-color: transparent;
      }
      .motion-full .nowitem.run .k {
        animation: spin 1.4s linear infinite;
      }
      .nowitem.need .k {
        background: var(--cq-accent);
        color: var(--cq-on-accent);
        font-size: 12px;
        font-weight: 600;
      }
      .nowitem.done .k {
        background: var(--cq-positive-soft);
        color: var(--cq-positive);
      }
      .nowitem.done .k svg {
        width: 14px;
        height: 14px;
      }
      .nowitem p {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
      }
      .nowitem small {
        display: block;
        color: var(--cq-text-secondary);
        font-size: 13px;
        font-weight: 400;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .cmd {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 12px 32px 20px;
      }
      .cmdbox {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface-raised);
        border-radius: 14px;
        min-height: 52px;
        padding: 4px 6px 4px 16px;
        color: var(--cq-text-tertiary);
      }
      .cmdbox span {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mic {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 0;
        background: var(--cq-accent);
        color: var(--cq-on-accent);
        display: grid;
        place-items: center;
        flex: none;
      }
      .mic.live {
        box-shadow: 0 0 0 6px
          color-mix(in oklab, var(--cq-q-light) 25%, transparent);
      }
      .ibtn {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        border: 0;
        background: transparent;
        color: var(--cq-text-secondary);
        display: grid;
        place-items: center;
        flex: none;
      }
      .ibtn:hover {
        background: var(--cq-surface-subtle);
      }

      /* Generic objects */
      .obj {
        background: var(--cq-surface-raised);
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-lg);
        min-width: 0;
      }
      .obj-h {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 12px 12px 18px;
        border-bottom: 1px solid var(--cq-border-subtle);
        min-height: 64px;
      }
      .obj-h .t {
        flex: 1;
        min-width: 0;
      }
      .obj-h h2 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .obj-h small {
        display: block;
        color: var(--cq-text-secondary);
        font-size: 13px;
      }
      .obj-b {
        padding: 16px 18px;
      }
      .obj-f {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 12px 18px 16px;
        align-items: center;
      }
      .btn {
        min-height: 44px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface-raised);
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--cq-surface-subtle);
      }
      .btn.primary {
        background: var(--cq-accent);
        color: var(--cq-on-accent);
        border-color: transparent;
      }
      .btn.quiet {
        border-color: transparent;
        background: transparent;
        color: var(--cq-text-secondary);
      }
      .sub {
        color: var(--cq-text-secondary);
        font-size: 13px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--cq-text-secondary);
        border: 1px solid var(--cq-border);
        border-radius: 999px;
        padding: 2px 9px;
        white-space: nowrap;
      }
      .tag.ok {
        color: var(--cq-positive);
        border-color: color-mix(in oklab, var(--cq-positive) 40%, transparent);
      }
      .tag.warn {
        color: var(--cq-warning);
        border-color: color-mix(in oklab, var(--cq-warning) 45%, transparent);
      }
      .tag.acc {
        color: var(--cq-accent);
        border-color: color-mix(in oklab, var(--cq-accent) 45%, transparent);
      }
      .sugg {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 12px;
        border: 1px solid var(--cq-accent);
        border-radius: 12px;
      }
      .sugg.alt {
        border-color: var(--cq-border-subtle);
      }
      .mini {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--cq-border-subtle);
        background: var(--cq-surface);
        min-height: 56px;
      }
      .mini .ic {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--cq-surface-subtle);
        display: grid;
        place-items: center;
        color: var(--cq-text-secondary);
        flex: none;
      }
      .mini .ic svg {
        width: 17px;
        height: 17px;
      }
      .mini p {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        flex: 1;
        min-width: 0;
      }
      .mini small {
        display: block;
        font-weight: 400;
        color: var(--cq-text-secondary);
        font-size: 12.5px;
      }

      /* enter / leave choreography */
      .k-enter {
        animation: rise var(--cq-motion-slow) var(--cq-ease) both;
        animation-delay: calc(var(--i, 0) * 90ms);
      }
      .k-leave {
        animation: sink var(--cq-motion-base) var(--cq-ease) both;
        pointer-events: none;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sink {
        to {
          opacity: 0;
          transform: translateY(8px) scale(0.985);
        }
      }
      .motion-reduce *,
      .motion-reduce *:before,
      .motion-reduce *:after {
        animation-duration: 1ms !important;
        animation-delay: 0ms !important;
        transition-duration: 1ms !important;
      }

      /* Chat panel */
      .thread {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 18px;
      }
      .msg {
        max-width: 78%;
        padding: 10px 14px;
        border-radius: 14px;
        background: var(--cq-surface-subtle);
        font-size: 14.5px;
        transition:
          background var(--cq-motion-base),
          box-shadow var(--cq-motion-base);
      }
      .msg.me {
        align-self: flex-end;
        background: var(--cq-accent-soft);
      }
      .msg small {
        display: block;
        color: var(--cq-text-tertiary);
        font-size: 12px;
        margin-top: 4px;
      }
      .msg.reading {
        box-shadow: 0 0 0 2px var(--cq-accent);
      }
      .readtag {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        color: var(--cq-accent);
        font-weight: 500;
        margin-bottom: 4px;
      }
      .draft {
        margin: 0 18px 0;
        border-top: 1px solid var(--cq-border-subtle);
        padding-top: 14px;
      }
      .draft .who {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        color: var(--cq-text-secondary);
        margin-bottom: 8px;
      }
      .draft blockquote {
        margin: 0;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px dashed var(--cq-border-strong);
        font-size: 14.5px;
      }
      .status {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
        color: var(--cq-positive);
        font-weight: 500;
      }
      .status svg {
        width: 16px;
        height: 16px;
      }

      /* Data room */
      .dr {
        display: grid;
        grid-template-columns: 180px minmax(0, 1fr);
        min-height: 0;
      }
      .dr .folders {
        border-right: 1px solid var(--cq-border-subtle);
        padding: 10px;
      }
      .dr .folders div {
        display: flex;
        gap: 8px;
        align-items: center;
        min-height: 40px;
        padding: 0 10px;
        border-radius: 8px;
        font-size: 14px;
        color: var(--cq-text-secondary);
      }
      .dr .folders div.on {
        background: var(--cq-surface-subtle);
        color: var(--cq-text-primary);
        font-weight: 500;
      }
      .dr .folders svg {
        width: 16px;
        height: 16px;
      }
      .files {
        list-style: none;
        margin: 0;
        padding: 6px 10px;
      }
      .files li {
        display: flex;
        gap: 12px;
        align-items: center;
        min-height: 52px;
        padding: 0 10px;
        border-radius: 10px;
        font-size: 14px;
      }
      .files li + li {
        border-top: 1px solid var(--cq-border-subtle);
      }
      .files li .n {
        flex: 1;
        min-width: 0;
      }
      .files li .n small {
        display: block;
        color: var(--cq-text-tertiary);
        font-size: 12.5px;
      }
      .files li.hl {
        background: var(--cq-accent-soft);
        border-color: transparent;
      }
      .files li.hl + li {
        border-color: transparent;
      }

      /* Document viewer */
      .docv {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0;
        min-height: 0;
      }
      .docv .pagebox {
        padding: 20px;
        background: var(--cq-surface-subtle);
        display: grid;
        place-items: start center;
        border-bottom-left-radius: var(--cq-radius-lg);
        min-height: 420px;
      }
      .paper {
        width: min(100%, 460px);
        aspect-ratio: 1/1.32;
        background: var(--cq-paper);
        color: var(--cq-paper-text);
        border-radius: 4px;
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.12),
          0 8px 24px rgb(0 0 0 / 0.1);
        padding: 36px 40px;
        font-family: var(--cq-font-editorial);
        font-size: 12.5px;
        line-height: 1.6;
        position: relative;
        overflow: hidden;
      }
      .paper h4 {
        font-weight: 400;
        font-size: 17px;
        text-align: center;
        margin: 8px 0 4px;
        letter-spacing: 0.01em;
      }
      .paper .c {
        text-align: center;
        color: #555;
        font-size: 11.5px;
        margin: 0 0 18px;
      }
      .paper p {
        margin: 0 0 10px;
      }
      .paper .ln {
        border-radius: 3px;
        transition: background var(--cq-motion-base);
      }
      .paper tr.ln.rd td {
        background: #f1dc9c;
      }
      .paper .ln.rd {
        background: #f1dc9c;
        box-shadow: 0 0 0 3px #f1dc9c;
      }
      .paper .seal {
        position: absolute;
        right: 36px;
        bottom: 34px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 1.5px solid #9a8f78;
        display: grid;
        place-items: center;
        font-size: 9px;
        color: #7d735e;
        text-align: center;
        line-height: 1.2;
      }
      .paper .sample {
        position: absolute;
        left: 40px;
        bottom: 30px;
        font: 11px var(--cq-font-sans);
        color: #6b6457;
      }
      .paper table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11.5px;
        margin: 6px 0 14px;
      }
      .paper td,
      .paper th {
        border-bottom: 1px solid #ddd;
        padding: 5px 2px;
        text-align: left;
        font-weight: 400;
      }
      .paper th {
        color: #555;
      }
      .pager {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 6px;
      }
      .pager .num {
        font-size: 13px;
        color: var(--cq-text-secondary);
        min-width: 72px;
        text-align: center;
      }
      .summary {
        width: 300px;
        border-left: 1px solid var(--cq-border-subtle);
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .summary h3 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      .summary ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 14px;
      }
      .summary li {
        display: flex;
        gap: 8px;
      }
      .cite {
        font-size: 12px;
        color: var(--cq-accent);
        border: 1px solid color-mix(in oklab, var(--cq-accent) 40%, transparent);
        border-radius: 6px;
        padding: 0 6px;
        height: 20px;
        display: inline-grid;
        place-items: center;
        flex: none;
        font-variant-numeric: tabular-nums;
      }
      .toast {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--cq-surface-raised);
        border: 1px solid var(--cq-border);
        font-size: 14px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.14);
        animation: rise var(--cq-motion-slow) var(--cq-ease) both;
      }
      .toast svg {
        color: var(--cq-positive);
      }
      .toast.neutral svg {
        color: var(--cq-text-tertiary);
      }
      .toasts {
        position: absolute;
        right: 32px;
        bottom: 92px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 20;
        max-width: calc(100% - 64px);
      }

      /* Answer cards */
      .answers {
        display: flex;
        gap: 14px;
        align-items: stretch;
      }
      .ans {
        --hue: var(--cq-card-hue-1);
        flex: 1 1 0;
        border: 1px solid var(--cq-border-subtle);
        border-top: 3px solid var(--hue);
        background: var(--cq-surface-raised);
        border-radius: var(--cq-radius-lg);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition:
          flex-grow var(--cq-motion-slow) var(--cq-ease),
          border-color var(--cq-motion-base),
          box-shadow var(--cq-motion-base);
        min-width: 0;
      }
      .ans[data-hue="2"] {
        --hue: var(--cq-card-hue-2);
      }
      .ans[data-hue="3"] {
        --hue: var(--cq-card-hue-3);
      }
      .ans.on {
        flex-grow: 1.35;
        border-color: color-mix(in oklab, var(--hue) 55%, var(--cq-border));
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.12);
      }
      .ans .top {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .rank {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--hue);
        color: var(--cq-card-rank-text);
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 14px;
        flex: none;
      }
      .ans h3 {
        font-size: 16px;
        margin: 0;
        font-weight: 600;
      }
      .ans .line {
        font-size: 13.5px;
        color: var(--cq-text-secondary);
        margin: 0;
      }
      .fit {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .fit b {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .fit span {
        font-size: 13px;
        color: var(--cq-text-secondary);
      }
      .measures {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        font-size: 13px;
        margin: 0;
      }
      .measures dt {
        color: var(--cq-text-tertiary);
      }
      .measures dd {
        margin: 0;
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 8px;
        align-items: baseline;
        min-width: 0;
      }
      .measures dd .lv {
        justify-self: start;
      }
      .lv {
        font-size: 11.5px;
        font-weight: 600;
        padding: 0 6px;
        border-radius: 5px;
        line-height: 18px;
        background: var(--cq-surface-subtle);
        color: var(--cq-text-secondary);
      }
      .lv.STRONG {
        background: var(--cq-positive-soft);
        color: var(--cq-positive);
      }
      .lv.UNKNOWN {
        background: transparent;
        border: 1px dashed var(--cq-border-strong);
        color: var(--cq-text-tertiary);
      }
      .ans .said {
        font-size: 13.5px;
        margin: 0;
        padding-top: 8px;
        border-top: 1px solid var(--cq-border-subtle);
      }
      .ans .foot {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: auto;
      }
      .ans .foot .sub {
        margin-left: auto;
      }

      /* Modal */
      .scrim {
        position: absolute;
        inset: 0;
        background: var(--cq-scrim);
        z-index: var(--cq-z-modal);
        display: grid;
        place-items: center;
        padding: 32px;
        animation: fade var(--cq-motion-base) var(--cq-ease) both;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      .modal {
        width: min(760px, 100%);
        max-height: 100%;
        overflow: auto;
        background: var(--cq-surface-raised);
        border-radius: 18px;
        border: 1px solid var(--cq-border);
        box-shadow: 0 30px 80px rgb(0 0 0 / 0.35);
        animation: rise var(--cq-motion-slow) var(--cq-ease) both;
      }
      .prof-h {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 20px 16px 12px 24px;
      }
      .logo {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        background: var(--cq-surface-subtle);
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 18px;
        color: var(--cq-text-secondary);
        flex: none;
      }
      .prof-h h2 {
        font-size: 22px;
        margin: 0;
        font-weight: 600;
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--cq-border-subtle);
        padding: 0 16px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tab {
        min-height: 46px;
        padding: 0 12px;
        border: 0;
        background: none;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        color: var(--cq-text-secondary);
        font-weight: 500;
        white-space: nowrap;
      }
      .tab[aria-selected="true"] {
        color: var(--cq-text-primary);
        border-color: var(--cq-text-primary);
      }
      .prof-b {
        padding: 20px 24px 24px;
        display: grid;
        gap: 18px;
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
      .facts div small {
        display: block;
        color: var(--cq-text-tertiary);
        font-size: 12.5px;
      }
      .facts div b {
        font-weight: 600;
        font-size: 17px;
      }
      .ev {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .ev li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 4px 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--cq-border-subtle);
        font-size: 14px;
      }
      .ev li .ax {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        grid-column: 1/-1;
      }
      .ev li .src {
        color: var(--cq-text-tertiary);
        font-size: 12.5px;
      }

      /* Plan / approvals */
      .steps {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
      }
      .steps li {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
        padding: 10px 0;
        font-size: 14.5px;
      }
      .steps li + li {
        border-top: 1px solid var(--cq-border-subtle);
      }
      .sn {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1.5px solid var(--cq-border-strong);
        display: grid;
        place-items: center;
        font-size: 12px;
        color: var(--cq-text-secondary);
      }
      .steps li.done .sn {
        background: var(--cq-positive-soft);
        border-color: transparent;
        color: var(--cq-positive);
      }
      .steps li.run .sn {
        border-color: var(--cq-q-light);
        border-right-color: transparent;
      }
      .motion-full .steps li.run .sn {
        animation: spin 1.4s linear infinite;
      }
      .steps li small {
        display: block;
        color: var(--cq-text-secondary);
        font-size: 13px;
      }
      .needs {
        background: var(--cq-accent-soft);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 14px;
      }
      .needs h4 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 600;
      }
      .needs ul {
        margin: 0;
        padding-left: 18px;
        display: grid;
        gap: 4px;
      }
      .rows {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .rows li {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
        border-top: 1px solid var(--cq-border-subtle);
        font-size: 14px;
        min-height: 56px;
      }
      .rows li .n {
        flex: 1;
        min-width: 0;
      }
      .rows li .n small {
        display: block;
        color: var(--cq-text-secondary);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chk {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 1.5px solid var(--cq-border-strong);
        display: grid;
        place-items: center;
        flex: none;
      }
      .chk.on {
        background: var(--cq-accent);
        border-color: transparent;
        color: var(--cq-on-accent);
      }
      .chk svg {
        width: 14px;
        height: 14px;
      }

      /* Calendar */
      .dates {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .date {
        border: 1px solid var(--cq-border);
        border-radius: 12px;
        padding: 12px 14px;
        min-height: 88px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        background: var(--cq-surface);
      }
      .date b {
        font-size: 15px;
        font-weight: 600;
      }
      .date .when {
        font-size: 20px;
        font-weight: 500;
      }
      .date.pick {
        border-color: var(--cq-accent);
        box-shadow: 0 0 0 1px var(--cq-accent);
      }
      .date .fr {
        font-size: 12.5px;
        margin-top: auto;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .date .fr.free {
        color: var(--cq-positive);
      }
      .date .fr.clash {
        color: var(--cq-warning);
      }
      .date .fr.unk {
        color: var(--cq-text-tertiary);
      }
      .oauth {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 14px;
      }
      .oauth div {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .gmark {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        border: 1px solid var(--cq-border);
        display: grid;
        place-items: center;
        flex: none;
        color: var(--cq-text-secondary);
      }

      /* News */
      .news {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .nc {
        border: 1px solid var(--cq-border-subtle);
        background: var(--cq-surface-raised);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .nc .src {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12.5px;
        color: var(--cq-text-secondary);
      }
      .nc .fav {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: var(--cq-surface-subtle);
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 600;
      }
      .nc h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
      }
      .nc q {
        font-size: 13.5px;
        color: var(--cq-text-secondary);
        font-family: var(--cq-font-editorial);
      }
      .nc.lead {
        grid-column: 1/-1;
      }

      /* Deck creation */
      .pipe {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 30px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid var(--cq-border-subtle);
        font-size: 13px;
        color: var(--cq-text-tertiary);
      }
      .chip.done {
        color: var(--cq-text-secondary);
      }
      .chip.done svg {
        color: var(--cq-positive);
        width: 14px;
        height: 14px;
      }
      .chip.run {
        color: var(--cq-text-primary);
        border-color: var(--cq-border-strong);
      }
      .chip.run i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1.5px solid var(--cq-q-light);
        border-right-color: transparent;
      }
      .motion-full .chip.run i {
        animation: spin 1.2s linear infinite;
      }
      .chip.wait i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--cq-border-strong);
      }
      .deck {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 172px;
        gap: 16px;
        padding: 16px 18px;
        position: relative;
      }
      .slide {
        aspect-ratio: 16/9;
        border-radius: 8px;
        background: #121110;
        color: #f4efe2;
        position: relative;
        overflow: hidden;
        padding: 5% 6%;
        display: flex;
        flex-direction: column;
        font-family: var(--cq-font-sans);
        container: slide/inline-size;
      }
      [data-theme="light"] .slide,
      [data-theme="dark"] .slide {
        background: #0e1a2b;
      }
      .slide .eb {
        font-size: 2.2cqw;
        color: #d8c38a;
        margin-bottom: 2cqw;
      }
      .slide h5 {
        font-size: 5.4cqw;
        line-height: 1.1;
        margin: 0 0 2cqw;
        font-weight: 600;
        letter-spacing: -0.01em;
        max-width: 80%;
      }
      .slide p {
        font-size: 2.4cqw;
        margin: 0;
        color: #cfc6b2;
        max-width: 70%;
      }
      .slide .big {
        font-size: 13cqw;
        font-weight: 600;
        letter-spacing: -0.03em;
        color: #e2b858;
        line-height: 1;
      }
      .slide .bars {
        display: flex;
        align-items: flex-end;
        gap: 2cqw;
        height: 30%;
        margin-top: auto;
      }
      .slide .bars i {
        flex: 1;
        background: #e2b858;
        opacity: 0.9;
        border-radius: 0.6cqw 0.6cqw 0 0;
      }
      .slide .ph {
        border: 1.5px dashed #b9a56c;
        border-radius: 1.2cqw;
        display: grid;
        place-items: center;
        color: #d8c38a;
        font-size: 2.1cqw;
        text-align: center;
        padding: 2cqw;
      }
      .slide .people {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3cqw;
        margin-top: auto;
        height: 52%;
      }
      .slide .person {
        display: flex;
        flex-direction: column;
        gap: 1cqw;
        font-size: 2.2cqw;
        color: #cfc6b2;
      }
      .slide .person .ph {
        flex: 1;
      }
      .slide .src {
        position: absolute;
        right: 4%;
        bottom: 4%;
        font-size: 1.6cqw;
        color: #a39a86;
      }
      .slide.skel {
        background: var(--cq-surface-subtle);
      }
      .thumbs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        align-content: start;
        max-height: 440px;
        overflow: auto;
      }
      .thumb {
        border-radius: 5px;
        padding: 0;
        border: 2px solid transparent;
        background: none;
        position: relative;
      }
      .thumb.on {
        border-color: var(--cq-accent);
      }
      .thumb .slide {
        border-radius: 3px;
      }
      .thumb em {
        position: absolute;
        left: 4px;
        top: 3px;
        font-style: normal;
        font-size: 10px;
        color: #cfc6b2;
      }
      .upload {
        position: absolute;
        right: 30px;
        bottom: 26px;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 999px;
        border: 0;
        background: var(--cq-accent);
        color: var(--cq-on-accent);
        font-weight: 600;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        box-shadow: 0 10px 26px rgb(0 0 0 / 0.28);
      }
      .rev {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 13px;
        color: var(--cq-text-secondary);
        padding: 0 18px 4px;
      }

      /* Discover (scene 9) */
      .disc {
        padding: 0 32px 16px;
        overflow: auto;
        min-height: 0;
      }
      .disc-h {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0 14px;
      }
      .disc-h h1 {
        font-size: 24px;
        margin: 0;
        font-weight: 600;
        margin-right: 8px;
      }
      .filter {
        min-height: 36px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--cq-accent);
        color: var(--cq-accent);
        background: var(--cq-accent-soft);
        display: inline-flex;
        align-items: center;
        font-size: 13.5px;
        font-weight: 500;
      }
      .grid12 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .co {
        border: 1px solid var(--cq-border-subtle);
        background: var(--cq-surface-raised);
        border-radius: 14px;
        overflow: hidden;
      }
      .co .poster {
        aspect-ratio: 16/10;
        background: linear-gradient(
          160deg,
          var(--cq-surface-subtle),
          var(--cq-border-subtle)
        );
        position: relative;
      }
      .co .poster:after {
        content: "";
        position: absolute;
        left: 12px;
        bottom: 10px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: rgb(0 0 0 / 0.35);
        clip-path: polygon(38% 28%, 38% 72%, 74% 50%);
      }
      .co div.m {
        padding: 10px 12px;
      }
      .co b {
        font-size: 14px;
        font-weight: 600;
        display: block;
      }
      .co small {
        font-size: 12.5px;
        color: var(--cq-text-secondary);
      }
      .co.hl {
        outline: 2px solid var(--cq-accent);
        outline-offset: -1px;
      }
      .dock {
        position: absolute;
        right: 24px;
        bottom: 24px;
        width: 380px;
        background: var(--cq-surface-raised);
        border: 1px solid var(--cq-border);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgb(0 0 0 / 0.3);
        z-index: 45;
        display: flex;
        flex-direction: column;
        animation: rise var(--cq-motion-slow) var(--cq-ease) both;
      }
      .dock-h {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 10px 10px 12px;
        border-bottom: 1px solid var(--cq-border-subtle);
      }
      .dock-h canvas {
        width: 44px;
        height: 44px;
      }
      .dsee {
        margin: 0;
        font-size: 12.5px;
        color: var(--cq-text-tertiary);
        line-height: 1.35;
      }
      .dock-b {
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 14.5px;
      }
      .dock .seeing {
        padding: 0;
        min-height: 0;
      }
      .dock .you {
        font-size: 14px;
        margin: 0;
      }
      .dock .qline {
        font-size: 16px;
      }

      /* Edge flow canvas (Q's particles around the page while it creates) */
      .flow {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: var(--cq-z-presence);
        opacity: 0;
        transition: opacity 600ms var(--cq-ease);
      }
      .flowing .flow {
        opacity: 1;
      }
      .motion-reduce.flowing .frame {
        box-shadow: inset 0 0 0 2px
          color-mix(in oklab, var(--cq-q-light) 60%, transparent);
      }

      /* ---------- phone ---------- */
      @container app (max-width: 767px) {
        .app {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) auto;
        }
        .nav {
          display: none;
        }
        .bottomnav {
          display: flex;
          justify-content: space-around;
          border-top: 1px solid var(--cq-chrome-border);
          background: var(--cq-chrome);
          color: var(--cq-chrome-muted);
          padding: 2px 4px 8px;
        }
        .bottomnav a {
          min-height: 52px;
          min-width: 56px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2px;
          font-size: 11px;
          color: inherit;
          text-decoration: none;
        }
        .bottomnav a.on {
          color: var(--cq-chrome-text);
        }
        .bottomnav a.on .mark {
          width: 20px;
          height: 20px;
        }
        .main {
          grid-template-rows: auto auto minmax(0, 1fr) auto;
        }
        .seeing {
          padding: 10px 16px 0;
          font-size: 12.5px;
        }
        .seeing .lbl {
          display: none;
        }
        .seeing .dots {
          flex-wrap: nowrap;
          overflow: hidden;
          white-space: nowrap;
          min-width: 0;
        }
        .seeing .soundbtn span.t {
          display: none;
        }
        .stage {
          grid-template-columns: 64px minmax(0, 1fr);
          gap: 12px;
          padding: 4px 16px 10px;
          min-height: 0;
          align-items: start;
        }
        .presence {
          width: 64px;
          height: 64px;
        }
        .qline {
          font-size: 17px;
        }
        .you {
          font-size: 13.5px;
          margin-bottom: 4px;
        }
        .qstate {
          margin-bottom: 2px;
        }
        .lines {
          font-size: 13px;
        }
        .room {
          grid-template-columns: minmax(0, 1fr);
          padding: 0 12px 12px;
          gap: 12px;
        }
        .rail {
          order: 2;
        }
        .rail h3.nowh {
          display: none;
        }
        .cmd {
          padding: 8px 12px 10px;
        }
        .cmdbox {
          min-height: 48px;
        }
        .cmd .attach {
          display: none;
        }
        .answers {
          flex-direction: column;
        }
        .ans {
          flex: none;
        }
        .ans:not(.on) .measures,
        .ans:not(.on) .said {
          display: none;
        }
        .dr {
          grid-template-columns: 1fr;
        }
        .dr .folders {
          display: flex;
          overflow-x: auto;
          border-right: 0;
          border-bottom: 1px solid var(--cq-border-subtle);
          gap: 4px;
          padding: 8px;
        }
        .dr .folders div {
          white-space: nowrap;
        }
        .docv {
          grid-template-columns: minmax(0, 1fr);
        }
        .docv .pagebox {
          padding: 12px;
          min-height: 0;
          border-radius: 0;
        }
        .paper {
          padding: 22px 22px;
          font-size: 11px;
        }
        .paper .seal {
          display: none;
        }
        .summary {
          width: auto;
          border-left: 0;
          border-bottom: 1px solid var(--cq-border-subtle);
          order: -1;
        }
        .pager .num {
          min-width: 52px;
        }
        .obj-h {
          padding: 8px 8px 8px 14px;
        }
        .obj-h .hide-s {
          display: none;
        }
        .obj-b {
          padding: 14px;
        }
        .thread {
          padding: 14px;
        }
        .msg {
          max-width: 88%;
        }
        .draft {
          margin: 0 14px;
        }
        .obj-f {
          padding: 12px 14px 14px;
        }
        .obj-f .btn {
          flex: 1 1 auto;
          justify-content: center;
        }
        .scrim {
          padding: 0;
          place-items: end stretch;
        }
        .modal {
          border-radius: 18px 18px 0 0;
          max-height: 92%;
          width: 100%;
        }
        .facts {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .prof-h {
          padding: 16px 8px 10px 16px;
        }
        .prof-b {
          padding: 16px;
        }
        .dates {
          grid-template-columns: 1fr;
        }
        .date {
          min-height: 0;
          flex-direction: row;
          align-items: center;
          gap: 10px;
          padding: 10px 12px;
        }
        .date .when {
          font-size: 16px;
        }
        .date .fr {
          margin: 0 0 0 auto;
        }
        .news {
          grid-template-columns: 1fr;
        }
        .deck {
          grid-template-columns: 1fr;
          padding: 12px;
        }
        .thumbs {
          grid-template-columns: repeat(5, 1fr);
          max-height: none;
        }
        .upload {
          position: static;
          width: 100%;
          justify-content: center;
        }
        .toasts {
          left: 12px;
          right: 12px;
          bottom: 80px;
          max-width: none;
        }
        .disc {
          padding: 0 12px 12px;
        }
        .disc-h h1 {
          font-size: 20px;
        }
        .grid12 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .dock {
          left: 8px;
          right: 8px;
          width: auto;
          bottom: 8px;
        }
        .phone-hide {
          display: none !important;
        }
      }
      @container app (min-width: 768px) {
        .desk-hide {
          display: none !important;
        }
      }
      @container app (max-width: 1180px) and (min-width:768px) {
        .room {
          grid-template-columns: minmax(0, 1fr) 260px;
        }
        .summary {
          width: 240px;
        }
        .ans:not(.on) .measures {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="proto" role="toolbar" aria-label="Prototype controls">
      <b>Q room prototype</b>
      <div class="grp">
        <select id="sceneSel" aria-label="Scene"></select>
        <button id="prev" aria-label="Previous step">&#9664;</button
        ><span
          id="stepLbl"
          class="num"
          style="min-width: 58px; text-align: center"
        ></span
        ><button id="next" aria-label="Next step">&#9654;</button>
        <button id="play" aria-pressed="false">Play timeline</button>
      </div>
      <div class="tl" id="tl"></div>
      <div class="grp" id="themeGrp">
        <button data-th="bg-dark">Black &amp; gold</button
        ><button data-th="bg-light">Gold light</button
        ><button data-th="dark">Dark</button
        ><button data-th="light">Light</button>
      </div>
      <div class="grp">
        <button data-dev="desktop">Desktop</button
        ><button data-dev="phone">Phone</button>
      </div>
      <div class="grp">
        <button id="motionBtn" aria-pressed="false">Reduced motion</button>
      </div>
    </div>
    <div class="stagewrap">
      <div class="frame" id="frame">
        <div class="app">
          <nav class="nav" id="nav" aria-label="Main"></nav>
          <div class="main" id="main"></div>
          <nav class="bottomnav" id="bnav" aria-label="Main"></nav>
        </div>
        <canvas class="flow" id="flow" aria-hidden="true"></canvas>
      </div>
    </div>

    <script>
      /* ---------------- icons ---------------- */
      const P = {
        mic: '<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
        x: '<path d="M6 6l12 12M18 6L6 18"/>',
        dl: '<path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/>',
        l: '<path d="M15 6l-6 6 6 6"/>',
        r: '<path d="M9 6l6 6-6 6"/>',
        up: '<path d="M12 20V9m0 0l-4 4m4-4l4 4M5 5h14"/>',
        cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
        doc: '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
        folder:
          '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
        chat: '<path d="M5 5h14v10H9l-4 4z"/>',
        ok: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
        snd: '<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9.5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10"/>',
        quiet:
          '<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9.5a4 4 0 0 1 0 5"/>',
        off: '<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 10l4 4M21 10l-4 4"/>',
        clip: '<path d="M20 11l-8 8a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7"/>',
        globe:
          '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
        grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
        users:
          '<circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0M16 4.5a3.5 3.5 0 0 1 0 7M21 20a6 6 0 0 0-4-5.7"/>',
        brief:
          '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/>',
        deck: '<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8"/>',
        lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
        pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
        play: '<path d="M8 5l11 7-11 7z"/>',
        stop: '<rect x="7" y="7" width="10" height="10" rx="1.5"/>',
      };
      const I = (n, c = "") =>
        `<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

      /* ---------------- fictional content ---------------- */
      const CO = {
        clearwater: {
          n: "Clearwater Pay",
          hue: 1,
          line: "Reconciles business payments across banks in real time",
          fit: "8.6",
          of: "5 of 6",
          said: "A seed round in your range, with revenue backed by bank statements.",
          m: [
            ["Stage", "STRONG", "Seed"],
            ["Sector", "STRONG", "Payments infrastructure"],
            ["Cheque", "STRONG", "£1.5m round, £400k open"],
            ["Traction", "GOOD", "£41k a month"],
            ["Team", "UNKNOWN", "Not shared yet"],
          ],
        },
        ledgerline: {
          n: "Ledgerline",
          hue: 2,
          line: "Double-entry ledger API for lenders and fintechs",
          fit: "8.1",
          of: "6 of 6",
          said: "Every measure is backed, but the round is larger than your usual cheque.",
          m: [
            ["Stage", "STRONG", "Seed+"],
            ["Sector", "STRONG", "Ledger infrastructure"],
            ["Cheque", "GOOD", "£3m round"],
            ["Traction", "STRONG", "£58k a month"],
            ["Team", "GOOD", "Two founders, ex-lender"],
