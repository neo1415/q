        return `<p class="qline ${s.quote ? "quote-wrap" : ""}" id="qline">${words.map((w, i) => `<span class="w" data-i="${i}">${esc(w)}</span>`).join(" ")}</p>`;
      }
      function linesHTML(s) {
        const ls = s.lines.filter((l) => l !== s.q && !s.q.endsWith(l));
        if (!ls.length) return "";
        s = { ...s, lines: ls };
        return `<ul class="lines" aria-live="polite">${s.lines
          .map((l, i) => {
            const mem = l.startsWith("mem:");
            const t = mem ? l.slice(4) : l;
            return `<li class="${mem ? "mem" : i === s.lines.length - 1 ? "cur" : ""}">${esc(t)}${mem ? "<small>Remembered from 2 Oct · only you see this</small>" : ""}</li>`;
          })
          .join("")}</ul>`;
      }
      function nowHTML(s) {
        const items = s.now.length ? s.now : [];
        return `<h3 class="nowh">Now and needs you</h3>${items.length ? items.map((n) => `<div class="nowitem ${n.c}"><span class="k">${n.c === "need" ? "!" : n.c === "done" ? I("ok") : ""}</span><p>${n.t}<small>${n.s}</small></p></div>`).join("") : '<p class="empty phone-hide">Nothing running. Nothing needs you.</p>'}
 <div id="board"></div>`;
      }
      function discoverHTML(s) {
        const names = [
          ["Clearwater Pay", "Payments · Seed"],
          ["Ledgerline", "Ledger infra · Seed+"],
          ["Tessellate Risk", "Model risk · Pre-seed"],
          ["Kente Health", "Health payments · Seed"],
          ["Fernhill", "SME lending · Series A"],
          ["Ruta Freight", "Trade finance · Seed"],
          ["Orbit Payroll", "Payroll · Seed"],
          ["Quay Treasury", "Treasury · Pre-seed"],
          ["Lumen Credit", "Consumer credit · Seed"],
          ["Harbor KYC", "Compliance · Seed"],
          ["Mosaic FX", "FX · Series A"],
          ["Stillwater", "Savings · Seed"],
        ];
        return `<div class="disc" id="disc"><div class="disc-h"><h1>Discover</h1><span class="filter">Fintech</span><span class="sub phone-hide">12 companies</span></div>
 <div class="grid12">${names.map((n, i) => `<div class="co ${s.hl.includes(i) ? "hl" : ""}"><div class="poster"></div><div class="m"><b>${n[0]}</b><small>${n[1]}</small>${s.hl.includes(i) ? `<br><small style="color:var(--cq-accent);font-weight:500">Audited accounts</small>` : ""}</div></div>`).join("")}</div></div>`;
      }
      function previewHTML() {
        return `<div class="modal" role="dialog" aria-modal="true" aria-label="Ledgerline preview" style="width:min(560px,100%)"><div class="prof-h"><div class="logo">LL</div><div style="flex:1"><h2>Ledgerline</h2><div class="sub">Double-entry ledger API for lenders · Seed+</div></div><button class="ibtn" aria-label="Close">${I("x")}</button></div>
 <div class="prof-b"><div class="facts num" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><small>Revenue</small><b>£58k / mo</b></div><div><small>Burn</small><b>£82k / mo</b></div><div><small>Raising</small><b>£3m</b></div></div><p class="sub" style="margin:0">Revenue and burn from September bank statements · Verified</p></div></div>`;
      }

      let prevKeys = { main: new Map(), board: new Map() };
      function reconcile(container, list, store, staggerNew) {
        const seen = new Set();
        let i = 0;
        list.forEach((o) => {
          seen.add(o.k);
          const html = R[o.t](o);
          let el = store.get(o.k);
          if (!el || !el.isConnected) {
            el = document.createElement("div");
            el.className = "k-enter";
            el.style.setProperty("--i", staggerNew ? i++ : 0);
            el.innerHTML = html;
            el._h = html;
            store.set(o.k, el);
          } else if (el._h !== html) {
            el.innerHTML = html;
            el._h = html;
            el.classList.remove("k-enter", "k-leave");
          }
          container.appendChild(el);
        });
        for (const [k, el] of store) {
          if (!seen.has(k)) {
            store.delete(k);
            el.classList.remove("k-enter");
            el.classList.add("k-leave");
            container.appendChild(el);
            setTimeout(() => el.remove(), ST.reduce ? 0 : 230);
          }
        }
      }

      let lastScene = -1,
        speechTimer = null;
      function render() {
        const s = stateAt(ST.scene, ST.step);
        const root = document.documentElement;
        root.dataset.theme = ST.theme;
        document.body.className = [
          qs.get("bare") === "1" ? "bare" : "",
          "device-" + ST.device,
          ST.reduce ? "motion-reduce" : "motion-full",
          s.flow ? "flowing" : "",
        ].join(" ");
        const n = navHTML(s);
        $("nav").innerHTML = n.side;
        $("bnav").innerHTML = n.bottom;
        const main = $("main");
        if (lastScene !== ST.scene) {
          main.innerHTML = "";
          prevKeys = { main: new Map(), board: new Map() };
          lastScene = ST.scene;
        }
        if (s.page === "discover") {
          main.innerHTML =
            seeingHTML(s) +
            discoverHTML(s) +
            `<div></div><div></div>` +
            `<div class="dock" role="dialog" aria-label="Q"><div class="dock-h"><canvas id="pres" width="88" height="88"></canvas><div style="flex:1;min-width:0"><div class="qstate"><span class="dot"></span>${STATEWORD[s.presence]}</div><p class="dsee">Q can see: ${s.see.join(" · ")}${s.seeModal ? ` · window: ${esc(s.seeModal)}` : ""}</p></div><button class="ibtn" aria-label="Open in the Q room">${I("r")}</button></div>
   <div class="dock-b"><p class="you">${esc(s.you)}</p>${qlineHTML(s)}</div></div>` +
            (s.modal ? `<div class="scrim">${previewHTML()}</div>` : "");
          main.style.gridTemplateRows = "auto minmax(0,1fr) 0 0";
        } else {
          main.style.gridTemplateRows = "";
          if (!$("stage")) {
            main.innerHTML = `<div id="seeW"></div><div class="stage" id="stage"><div class="presence"><canvas id="pres" width="264" height="264" aria-hidden="true"></canvas></div><div id="ex"></div></div>
   <div class="room" id="room"><div class="focus" id="focus"></div><aside class="rail" id="rail" aria-label="Now and needs you"></aside></div>
   <div class="cmd"><div class="cmdbox"><button class="ibtn attach" aria-label="Attach a file">${I("clip")}</button><span>Ask Q or say anything…</span></div><button class="mic" aria-label="Talk to Q">${I("mic")}</button></div>
   <div id="toasts" class="toasts" aria-live="polite"></div><div id="modalW"></div>`;
          }
          $("seeW").innerHTML = seeingHTML(s);
          $("ex").innerHTML =
            `<div class="qstate"><span class="dot"></span>${STATEWORD[s.presence]}</div><p class="you">${esc(s.you)}</p>${qlineHTML(s)}${s.memo ? `<div class="memo">${I("lock")}${esc(s.memo)}</div>` : ""}${linesHTML(s)}`;
          $("rail").innerHTML = nowHTML(s);
          reconcile($("focus"), s.main, prevKeys.main, true);
          prevKeys.board = new Map();
          reconcile($("board"), s.board, prevKeys.board, false);
          $("toasts").innerHTML = s.toast
            ? `<div class="toast ${s.toastIcon ? "neutral" : ""}">${I(s.toastIcon || "ok")}<span>${esc(s.toast)}</span></div>`
            : "";
          $("modalW").innerHTML = s.modal
            ? `<div class="scrim" data-close>${R[s.modal.t](s.modal)}</div>`
            : "";
          if (s.modal) {
            const st = $("stage");
            $("modalW").firstChild.style.top =
              st.offsetTop + st.offsetHeight + "px";
          }
          const fresh = [...$("focus").children].filter((e) =>
            e.classList.contains("k-enter"),
          );
          if (fresh.length && $("focus").children.length > 1)
            fresh[fresh.length - 1].scrollIntoView({ block: "nearest" });
          else $("room").scrollTop = 0;
        }
        document.querySelectorAll("[data-go]").forEach((b) =>
          b.addEventListener("click", (e) => {
            e.stopPropagation();
            go(1);
          }),
        );
        $("soundBtn") &&
          $("soundBtn").addEventListener("click", () => {
            ST.sound = { quiet: "on", on: "off", off: "quiet" }[ST.sound];
            render();
            sound(s);
          });
        presence.set(s.presence, $("pres"));
        // speech choreography: spoken words in primary, upcoming words tertiary (not a typewriter: all words are present)
        clearInterval(speechTimer);
        const ws = [...document.querySelectorAll("#qline .w")];
        if (!ST.static && !ST.reduce && s.presence === "speaking") {
          ws.forEach((w) => w.classList.add("later"));
          let i = 0;
          const per = Math.min(
            300,
            ((SCENES[ST.scene].steps[ST.step].dur || 3000) * SPEED * 0.8) /
              ws.length,
          );
          speechTimer = setInterval(() => {
            if (i < ws.length) ws[i++].classList.remove("later");
            else clearInterval(speechTimer);
          }, per);
        }
        flow.on = !!s.flow;
        sound(s);
        syncProto();
      }

      /* ---------------- presence (Q's light; glow lives only here) ---------------- */
      const presence = (() => {
        const N = 170;
        let canvas = null,
          ctx = null,
          state = "idle",
          pts = [],
          t0 = performance.now(),
          raf = 0;
        function rnd(i) {
          const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
          return x - Math.floor(x);
        }
        function shape(st, i, t) {
          const a = rnd(i) * Math.PI * 2,
            r = Math.sqrt(rnd(i + 500));
          const u = i / N;
          switch (st) {
            case "listening":
              return [Math.cos(a) * r * 0.62, Math.sin(a) * r * 0.5 + 0.12];
            case "thinking": {
              const th = u * Math.PI * 5 + t * 0.0012,
                rr = 0.08 + u * 0.72;
              return [Math.cos(th) * rr, Math.sin(th) * rr];
            }
            case "working": {
              const th = u * Math.PI * 2 + t * 0.0009,
                rr = 0.66 + (rnd(i + 9) - 0.5) * 0.1;
              return [Math.cos(th) * rr, Math.sin(th) * rr];
            }
            case "speaking": {
              const x = u * 1.7 - 0.85,
                row = ((i % 3) - 1) * 0.07;
              return [
                x,
                Math.sin(x * 5 + t * 0.006 + (i % 3)) *
                  0.22 *
                  Math.cos(x * 1.6) +
                  row,
              ];
            }
            case "asking": {
              if (u < 0.62) {
                const th = Math.PI * 1.05 + (u / 0.62) * Math.PI * 1.45;
                return [Math.cos(th) * 0.36, Math.sin(th) * 0.36 - 0.24];
              }
              if (u < 0.85) {
                const v = (u - 0.62) / 0.23;
                return [(rnd(i) - 0.5) * 0.05, -0.12 + v * 0.42];
              }
              return [Math.cos(a) * 0.06 * r, 0.62 + Math.sin(a) * 0.06 * r];
            }
            default: {
              const b = 1 + Math.sin(t * 0.0012) * 0.03;
              return [Math.cos(a) * r * 0.6 * b, Math.sin(a) * r * 0.6 * b];
            }
          }
        }
        function draw(t) {
          if (!canvas || !canvas.isConnected) {
            raf = 0;
            return;
          }
          const W = canvas.width,
            H = canvas.height,
            cs = getComputedStyle(document.documentElement);
          const col = cs.getPropertyValue("--cq-q-light").trim(),
            bloom = cs.getPropertyValue("--cq-q-bloom").trim(),
            blend = cs.getPropertyValue("--q-blend").trim() || "source-over";
          ctx.clearRect(0, 0, W, H);
          const g = ctx.createRadialGradient(
            W / 2,
            H / 2,
            0,
            W / 2,
            H / 2,
            W / 2,
          );
          g.addColorStop(0, bloom);
          g.addColorStop(1, "transparent");
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
          ctx.globalCompositeOperation = blend;
          ctx.fillStyle = col;
          const tt = ST.reduce ? 0 : t - t0,
            sc = W * 0.42,
            R = Math.max(1.1, W / 150);
          for (let i = 0; i < N; i++) {
            const [tx, ty] = shape(state, i, tt);
            const p = pts[i] || (pts[i] = { x: tx, y: ty });
            const k = ST.reduce ? 1 : 0.05 + rnd(i + 77) * 0.06;
            p.x += (tx - p.x) * k;
            p.y += (ty - p.y) * k;
            ctx.globalAlpha = 0.55 + rnd(i + 3) * 0.45;
            ctx.beginPath();
            ctx.arc(
              W / 2 + p.x * sc,
              H / 2 + p.y * sc,
              R * (0.7 + rnd(i + 4) * 0.8),
              0,
              7,
            );
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
          if (!ST.reduce) raf = requestAnimationFrame(draw);
          else raf = 0;
        }
        return {
          set(st, c) {
            if (!c) return;
            if (c !== canvas) {
              canvas = c;
              ctx = c.getContext("2d");
            }
            state = st;
            if (!raf) raf = requestAnimationFrame(draw);
          },
        };
      })();

      /* ---------------- edge flow: Q's particles travel the page edge while it creates ---------------- */
      const flow = (() => {
        const c = $("flow"),
          ctx = c.getContext("2d");
        const N = 150;
        const ps = Array.from({ length: N }, (_, i) => ({
          s: Math.random(),
          v: 0.00004 + Math.random() * 0.00007,
          o: Math.random() * 6.28,
          r: 0.8 + Math.random() * 1.6,
        }));
        let on = false,
          last = performance.now();
        function per(s, W, H, inset) {
          const w = W - 2 * inset,
            h = H - 2 * inset,
            L = 2 * (w + h);
          let d = s * L;
          if (d < w) return [inset + d, inset];
          d -= w;
          if (d < h) return [W - inset, inset + d];
          d -= h;
          if (d < w) return [W - inset - d, H - inset];
          d -= w;
          return [inset, H - inset - d];
        }
        function tick(t) {
          const dpr = Math.min(2, devicePixelRatio || 1),
            W = c.clientWidth,
            H = c.clientHeight;
          if (c.width !== W * dpr) {
            c.width = W * dpr;
            c.height = H * dpr;
          }
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, W, H);
          const dt = Math.min(50, t - last);
          last = t;
          if (on || document.body.classList.contains("flowing")) {
            const cs = getComputedStyle(document.documentElement);
            ctx.fillStyle = cs.getPropertyValue("--cq-q-light").trim();
            ctx.globalCompositeOperation =
              cs.getPropertyValue("--q-blend").trim() || "source-over";
            for (const p of ps) {
              if (!ST.reduce) p.s = (p.s + p.v * dt) % 1;
              const [x, y] = per(p.s, W, H, 7);
              const j = Math.sin(t * 0.002 + p.o) * 4;
              ctx.globalAlpha =
                0.35 + 0.45 * Math.abs(Math.sin(p.o + t * 0.001));
              ctx.beginPath();
              ctx.arc(
                x + j * (x < 20 || x > W - 20 ? 1 : 0),
                y + j * (y < 20 || y > H - 20 ? 1 : 0),
                p.r,
                0,
                7,
              );
              ctx.fill();
            }
            ctx.globalAlpha = 1;
          }
          requestAnimationFrame(tick);
        }
        if (!ST.reduce) requestAnimationFrame(tick);
        return {
          set on(v) {
            on = v;
            if (ST.reduce) {
              /* reduced motion: a still edge line (CSS) replaces moving particles */
            }
          },
        };
      })();

      /* ---------------- sound (WebAudio, no files; hum only on 'On', never under reduced motion) ---------------- */
      let AC = null,
        humNode = null;
      function sound(s) {
        try {
          const want = ST.sound === "on" && s.hum && !ST.reduce;
          if (want && !humNode) {
            AC = AC || new AudioContext();
            const o1 = AC.createOscillator(),
              o2 = AC.createOscillator(),
              g = AC.createGain(),
              f = AC.createBiquadFilter();
            o1.frequency.value = 110;
            o2.frequency.value = 164.8;
            f.type = "lowpass";
            f.frequency.value = 400;
            g.gain.value = 0;
            o1.connect(f);
            o2.connect(f);
            f.connect(g);
            g.connect(AC.destination);
            o1.start();
            o2.start();
            g.gain.linearRampToValueAtTime(0.02, AC.currentTime + 0.6);
            humNode = { o1, o2, g };
          }
          if (!want && humNode) {
            const h = humNode;
            humNode = null;
            h.g.gain.linearRampToValueAtTime(0, AC.currentTime + 0.4);
            setTimeout(() => {
              h.o1.stop();
              h.o2.stop();
            }, 500);
          }
        } catch (e) {}
      }

      /* ---------------- prototype controls + timeline ---------------- */
      const total = SCENES.reduce(
        (a, s) => a + s.steps.reduce((b, x) => b + (x.dur || 3000), 0),
        0,
      );
      $("sceneSel").innerHTML = SCENES.map(
        (s, i) => `<option value="${i}">${i + 1}. ${s.t}</option>`,
      ).join("");
      $("tl").innerHTML = SCENES.map(
        (s, i) =>
          `<button data-sc="${i}" style="--w:${s.steps.reduce((b, x) => b + (x.dur || 3000), 0)}" title="${i + 1}. ${s.t}"><i></i><span>${i + 1}</span></button>`,
      ).join("");
      function syncProto() {
        $("sceneSel").value = ST.scene;
        $("stepLbl").textContent =
          `${ST.step + 1} / ${SCENES[ST.scene].steps.length}`;
        document
          .querySelectorAll("[data-th]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", b.dataset.th === ST.theme),
          );
        document
          .querySelectorAll("[data-dev]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", b.dataset.dev === ST.device),
          );
        $("motionBtn").setAttribute("aria-pressed", ST.reduce);
        $("play").textContent = ST.playing ? "Pause" : "Play timeline";
        $("play").setAttribute("aria-pressed", ST.playing);
        document.querySelectorAll("#tl button").forEach((b, i) => {
          b.classList.toggle("on", i === ST.scene);
          const st = SCENES[i].steps;
          b.style.setProperty(
            "--p",
            i < ST.scene
              ? "100%"
              : i > ST.scene
                ? "0%"
                : ((ST.step + 1) / st.length) * 100 + "%",
          );
        });
      }
      function go(d) {
        let sc = ST.scene,
          st = ST.step + d;
        if (st >= SCENES[sc].steps.length) {
          if (sc < SCENES.length - 1) {
            sc++;
            st = 0;
          } else {
            st = SCENES[sc].steps.length - 1;
            stop();
          }
        }
        if (st < 0) {
          if (sc > 0) {
            sc--;
            st = SCENES[sc].steps.length - 1;
          } else st = 0;
        }
        ST.scene = sc;
        ST.step = st;
        render();
      }
      let playT = null;
      function schedule() {
        clearTimeout(playT);
        if (!ST.playing) return;
        playT = setTimeout(
          () => {
            const last =
              ST.scene === SCENES.length - 1 &&
              ST.step === SCENES[ST.scene].steps.length - 1;
            if (last) {
              stop();
              return;
            }
            go(1);
            schedule();
          },
          (SCENES[ST.scene].steps[ST.step].dur || 3000) * SPEED,
        );
      }
      function stop() {
        ST.playing = false;
        clearTimeout(playT);
        syncProto();
      }
      $("play").onclick = () => {
        ST.playing = !ST.playing;
        if (ST.playing) {
          if (
            ST.scene === SCENES.length - 1 &&
            ST.step === SCENES[ST.scene].steps.length - 1
          ) {
            ST.scene = 0;
            ST.step = 0;
            render();
          }
          schedule();
        }
        syncProto();
      };
      $("prev").onclick = () => {
        stop();
        go(-1);
      };
      $("next").onclick = () => {
        stop();
        go(1);
      };
      $("sceneSel").onchange = (e) => {
        stop();
        ST.scene = +e.target.value;
        ST.step = 0;
        render();
      };
      $("tl").onclick = (e) => {
        const b = e.target.closest("[data-sc]");
        if (b) {
          stop();
          ST.scene = +b.dataset.sc;
          ST.step = 0;
          render();
        }
      };
      document.querySelectorAll("[data-th]").forEach(
        (b) =>
          (b.onclick = () => {
            ST.theme = b.dataset.th;
            render();
          }),
      );
      document.querySelectorAll("[data-dev]").forEach(
        (b) =>
          (b.onclick = () => {
            ST.device = b.dataset.dev;
            render();
          }),
      );
      $("motionBtn").onclick = () => {
        ST.reduce = !ST.reduce;
        render();
      };
      addEventListener("keydown", (e) => {
        if (e.target.closest("select")) return;
        if (e.key === "ArrowRight") {
          stop();
          go(1);
        } else if (e.key === "ArrowLeft") {
          stop();
          go(-1);
        } else if (e.key === " ") {
          e.preventDefault();
          $("play").click();
        }
      });
      window.__q = { SCENES, go, ST, render, total };
      ST.step = Math.min(ST.step, SCENES[ST.scene].steps.length - 1);
      render();
      if (qs.get("play") === "1") {
        ST.playing = true;
        schedule();
        syncProto();
      }
    </script>
  </body>
</html>
