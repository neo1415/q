<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q Board</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  [hidden] { display: none !important; }
  .bwrap { max-width: 1180px; margin: 0 auto; padding: 14px 24px 40px; }
  .bhead { display: flex; align-items: center; gap: 12px; min-height: 52px; }
  .bhead h1 { margin: 0; font: 500 22px/1.2 var(--cq-font-ui); letter-spacing: -0.01em; flex: 1; }
  .bhead p { margin: 0; color: var(--cq-text-secondary); font-size: 14px; }
  .tabs { display: none; }
  .bgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; margin-top: 12px; }
  .day { margin: 18px 0 8px; font-size: 13px; color: var(--cq-text-secondary); font-weight: 500; }
  .day:first-child { margin-top: 0; }
  .tl { list-style: none; margin: 0; padding: 0; position: relative; }
  .tl::before { content: ""; position: absolute; left: 47px; top: 6px; bottom: 6px; width: 1px; background: var(--cq-border-subtle); }
  .tl > li { display: grid; grid-template-columns: 40px 16px minmax(0, 1fr); gap: 0 8px; padding: 6px 0; }
  .time { font-size: 12.5px; color: var(--cq-text-tertiary); padding-top: 14px; font-variant-numeric: tabular-nums; text-align: right; }
  .node { width: 9px; height: 9px; border-radius: 50%; background: var(--cq-surface); border: 2px solid var(--cq-border-strong); margin: 17px 0 0 3px; position: relative; z-index: 1; }
  .item { border: 1px solid var(--cq-border-subtle); border-radius: 14px; background: var(--cq-surface-raised); padding: 10px 6px 10px 14px; }
  .item-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
  .item h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.005em; padding-top: 3px; }
  .item .kind { margin: 1px 0 0; font-size: 13px; color: var(--cq-text-secondary); }
  .acts { display: flex; }
  .acts .btn-icon[aria-pressed="true"] { color: var(--cq-accent); }
  .minis { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 8px 2px 0; }
  .mini { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px 0 8px; border-radius: 10px; background: color-mix(in oklab, var(--hue) 11%, var(--cq-surface-raised)); border: 1px solid color-mix(in oklab, var(--hue) 25%, transparent); font-size: 13.5px; }
  .mini b { font: 500 16px/1 var(--cq-font-editorial); }
  .mini i { width: 8px; height: 8px; border-radius: 50%; background: var(--hue); }
  .said { margin: 8px 8px 0 0; font: 400 16px/1.45 var(--cq-font-editorial); color: var(--cq-text-primary); }
  .src { margin-top: 8px; border-top: 1px solid var(--cq-border-subtle); padding-top: 4px; margin-right: 8px; }
  .src summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; cursor: pointer; color: var(--cq-text-secondary); font-size: 13.5px; border-radius: 8px; }
  .src summary::-webkit-details-marker { display: none; }
  .src summary .icon { width: 16px; height: 16px; transition: transform 200ms var(--ease-out); }
  .src[open] summary .icon { transform: rotate(90deg); }
  .src ul { list-style: none; margin: 2px 0 6px; padding: 0; display: grid; gap: 8px; }
  .src li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; font-size: 14px; line-height: 1.4; }
  .src li small { display: block; color: var(--cq-text-secondary); font-size: 12.5px; }
  .ev { width: 12px; height: 12px; margin-top: 4px; }
  .note { font-size: 13px; color: var(--cq-text-secondary); margin: 4px 0 2px; }
  .file-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 44px; gap: 10px; align-items: center; min-height: 56px; padding: 4px 0; border-bottom: 1px solid var(--cq-border-subtle); }
  .file-row:last-child { border-bottom: 0; }
  .ficon { width: 40px; height: 40px; border-radius: 10px; background: var(--cq-surface-subtle); display: grid; place-items: center; color: var(--cq-text-secondary); }
  .file-row strong { font-weight: 500; font-size: 14.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-row span { font-size: 12.5px; color: var(--cq-text-secondary); }
  .rail h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .rail h2 span { font-weight: 400; color: var(--cq-text-tertiary); font-size: 13px; }
  .rail section { margin-bottom: 28px; }
  .pin { border-radius: 14px; padding: 12px 6px 12px 14px; background: color-mix(in oklab, var(--hue) 9%, var(--cq-surface-raised)); border: 1px solid color-mix(in oklab, var(--hue) 22%, var(--cq-border-subtle)); margin-bottom: 8px; display: grid; grid-template-columns: minmax(0,1fr) 44px; align-items: center; }
  .pin strong { font-weight: 600; font-size: 14.5px; display: block; }
  .pin span { font-size: 13px; color: var(--cq-text-secondary); }
  .empty { text-align: center; padding: 72px 16px; display: grid; justify-items: center; gap: 10px; }
  .empty h2 { margin: 0; font: 400 22px/1.3 var(--cq-font-editorial); }
  .empty p { margin: 0; color: var(--cq-text-secondary); max-width: 40ch; }
  .chiprow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  .chip { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--cq-border); background: var(--cq-surface-raised); cursor: pointer; }
  .filter { display: flex; gap: 6px; }
  @media (max-width: 760px) {
    .bwrap { padding: 6px 16px 100px; }
    .bgrid { grid-template-columns: 1fr; margin-top: 4px; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--cq-border-subtle); margin: 0 -16px; padding: 0 12px; position: sticky; top: 0; background: var(--cq-canvas); z-index: 5; }
    .tabs button { min-height: 44px; border: 0; background: none; padding: 0 12px; cursor: pointer; color: var(--cq-text-secondary); border-bottom: 2px solid transparent; font-weight: 500; }
    .tabs button[aria-selected="true"] { color: var(--cq-text-primary); border-bottom-color: var(--cq-accent); }
    .bgrid[data-tab="timeline"] .rail { display: none; }
    .bgrid[data-tab="pinned"] .timeline, .bgrid[data-tab="files"] .timeline { display: none; }
    .bgrid[data-tab="pinned"] .rail .files, .bgrid[data-tab="files"] .rail .pins { display: none; }
    .bgrid { padding-top: 14px; }
    .tl::before { left: 39px; }
    .tl > li { grid-template-columns: 32px 16px minmax(0, 1fr); gap: 0 6px; }
    .filter { display: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { shell, icon, params } from "./assets/shell.js";

const EV = {
  verified: '<svg class="ev" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="var(--cq-positive)"/></svg>',
  document: '<svg class="ev" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="var(--cq-text-secondary)" stroke-width="1.3"/><path d="M6 1.5a4.5 4.5 0 0 1 0 9z" fill="var(--cq-text-secondary)"/></svg>',
  claim: '<svg class="ev" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="var(--cq-text-secondary)" stroke-width="1.3"/></svg>',
  web: '<svg class="ev" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke="var(--cq-text-tertiary)" stroke-width="1.3" stroke-dasharray="2 2"/></svg>',
};
const mini = (h, name, score) => `<span class="mini" style="--hue:var(--hue-${h})"><i></i>${name}${score ? ` <b>${score}</b>` : ""}</span>`;
const sources = (n, items, open) => `<details class="src" ${open ? "open" : ""}><summary>${icon("chev")}Where this came from: ${n} sources</summary><ul>${items.map(([ev, t, s]) => `<li>${EV[ev]}<span>${t}<small>${s}</small></span></li>`).join("")}</ul></details>`;
const item = ({ time, title, kind, body, src, pinned }) => `<li><span class="time">${time}</span><span class="node" aria-hidden="true"></span>
  <article class="item"><div class="item-top"><div><h2>${title}</h2><p class="kind">${kind}</p></div>
  <div class="acts"><button class="btn-icon" aria-pressed="${!!pinned}" aria-label="${pinned ? "Unpin" : "Pin"} ${title}">${icon("pin")}</button><button class="btn-icon" aria-label="Show ${title} on the Q page">${icon("chev")}</button><button class="btn-icon" aria-label="Remove ${title} from the Board">${icon("x")}</button></div></div>
  ${body}${src ?? ""}</article></li>`;

const openSrc = params.get("state") === "sources";
const TODAY = [
  { time: "21:06", title: "Side by side", kind: "Comparison of three companies", pinned: true,
    body: `<div class="minis">${mini(1, "Norrland Grid", "8.6")}${mini(2, "Kestrel Heat", "8.1")}${mini(3, "Atlas Ledger", "7.4")}</div><p class="said">“Norrland leads on traction, with documents to back it. Atlas’s revenue is a claim so far.”</p>`,
    src: sources(5, [["document", "Norrland’s bank statements", "Uploaded by the founder, 2 October. Supports the revenue figure."], ["claim", "Atlas Ledger’s revenue", "Stated by the founder. No documents yet."], ["verified", "Your mandate", "Set by you, 28 September."], ["document", "Kestrel Heat’s install log", "Uploaded by the founder, 30 September."], ["web", "Companies House filings", "Public record, checked today."]], openSrc) },
  { time: "21:04", title: "Top three for your mandate", kind: "Ranked answer, 3 companies",
    body: `<div class="minis">${mini(1, "Norrland Grid", "8.6")}${mini(2, "Kestrel Heat", "8.1")}${mini(3, "Atlas Ledger", "7.4")}</div>`,
    src: sources(4, [["verified", "Your mandate", "Set by you."], ["document", "Three founders’ uploads", "Decks and statements."], ["claim", "One revenue figure is a claim", "Atlas Ledger."], ["web", "Public filings", "Checked today."]]) },
  { time: "20:40", title: "Research: Y Combinator", kind: "Research, 3 parts",
    body: `<div class="minis">${mini(1, "What it is")}${mini(3, "What it means for you")}${mini(4, "Questions to ask")}</div>`,
    src: sources(9, [["web", "Y Combinator’s own pages", "Public, read today."], ["web", "Eight news articles", "Public, 2024 to 2026."]]) },
];
const YESTERDAY = [
  { time: "18:12", title: "Intro to Kestrel Heat", kind: "Draft email, waiting for you", body: `<p class="note">Reviewed and passed. Not sent: it needs your approval.</p>` },
  { time: "09:30", title: "What changed this week", kind: "Summary, 4 updates", body: `<div class="minis">${mini(5, "Morrow Pay raised")}${mini(6, "Lumen Carbon added a deck")}</div>` },
];

function main() {
  const empty = params.get("state") === "empty";
  const tab = params.get("tab") ?? "timeline";
  const timeline = empty
    ? `<div class="empty"><h2>Nothing on the Board yet</h2><p>What Q shows you lands here, so you can find it again. Pin what matters; files Q makes for you sit alongside.</p><div class="chiprow"><button class="chip">Top three for my mandate</button><button class="chip">What changed this week?</button></div></div>`
    : `<p class="day">Today</p><ol class="tl">${TODAY.map(item).join("")}</ol><p class="day">Yesterday</p><ol class="tl">${YESTERDAY.map(item).join("")}</ol>`;
  const rail = empty ? "" : `<aside class="rail">
      <section class="pins"><h2>Pinned <span>2</span></h2>
        <div class="pin" style="--hue:var(--hue-1)"><div><strong>Side by side</strong><span>Norrland, Kestrel, Atlas</span></div><button class="btn-icon" aria-label="Unpin Side by side">${icon("x")}</button></div>
        <div class="pin" style="--hue:var(--hue-4)"><div><strong>Partners’ memo: Norrland Grid</strong><span>File, you asked for it</span></div><button class="btn-icon" aria-label="Unpin the partners’ memo">${icon("x")}</button></div>
      </section>
      <section class="files"><h2>Files <span>3</span></h2>
        <div class="file-row"><span class="ficon">${icon("file")}</span><div style="min-width:0"><strong>Partners’ memo: Norrland Grid</strong><span>PDF, made by Q because you asked, today</span></div><button class="btn-icon" aria-label="More for this file">${icon("more")}</button></div>
        <div class="file-row"><span class="ficon">${icon("file")}</span><div style="min-width:0"><strong>Norrland Grid deck</strong><span>Shared by the founder, 2 Oct</span></div><button class="btn-icon" aria-label="More for this file">${icon("more")}</button></div>
        <div class="file-row"><span class="ficon">${icon("file")}</span><div style="min-width:0"><strong>Harbour Lane mandate</strong><span>Yours, 28 Sep</span></div><button class="btn-icon" aria-label="More for this file">${icon("more")}</button></div>
      </section>
    </aside>`;
  return `<div class="bwrap">
    <div class="bhead"><h1>Board</h1><div class="filter"><button class="btn" style="min-height:40px">${icon("search")}Find</button></div><button class="btn-icon" aria-label="Close the Board">${icon("x")}</button></div>
    ${empty ? "" : `<div class="tabs" role="tablist"><button role="tab" aria-selected="${tab === "timeline"}">Timeline</button><button role="tab" aria-selected="${tab === "pinned"}">Pinned 2</button><button role="tab" aria-selected="${tab === "files"}">Files 3</button></div>`}
    <div class="bgrid" data-tab="${tab}"><div class="timeline">${timeline}</div>${rail}</div>
  </div>`;
}
document.getElementById("app").innerHTML = shell("q", main());
document.querySelector(".tabs")?.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const t = ["timeline", "pinned", "files"][[...b.parentElement.children].indexOf(b)];
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  document.querySelector(".bgrid").dataset.tab = t;
});
</script>
</body>
</html>
