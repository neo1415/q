  --cq-overlay: oklch(0.19 0.012 258 / 0.42);
  --cq-shadow-xs: 0 1px 2px oklch(0.19 0.012 258 / 0.06);
  --cq-shadow-sm: 0 1px 2px oklch(0.19 0.012 258 / 0.06), 0 4px 12px -4px oklch(0.19 0.012 258 / 0.1);
  --cq-shadow-overlay: 0 12px 32px -8px oklch(0.19 0.012 258 / 0.28);

  --cq-z-sticky: 10; --cq-z-navigation: 20; --cq-z-presence: 25; --cq-z-popover: 30; --cq-z-sheet: 40; --cq-z-modal: 50; --cq-z-toast: 60;
  --cq-layout-reading: 760px; --cq-layout-narrow: 600px;

  --cq-motion-instant: 90ms; --cq-motion-fast: 140ms; --cq-motion-base: 200ms; --cq-motion-emphasis: 280ms; --cq-motion-slow: 360ms;
  --cq-ease: cubic-bezier(0.22, 1, 0.36, 1);

/* ===== Type scale (tokens.css @layer components) ===== */
.cq-display { font-size: 34px; line-height: 1.08; font-weight: 600; letter-spacing: -0.02em; }
.cq-title-xl { font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -0.015em; }
.cq-title-lg { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
.cq-title-md { font-size: 20px; line-height: 1.3; font-weight: 600; }
.cq-title-sm { font-size: 17px; line-height: 1.35; font-weight: 600; }
.cq-body-lg { font-size: 17px; line-height: 1.55; }
.cq-body { font-size: 16px; line-height: 1.5; }
.cq-body-sm { font-size: 14px; line-height: 1.45; }
.cq-label { font-size: 13px; line-height: 1.35; font-weight: 500; }
.cq-caption { font-size: 12px; line-height: 1.35; }
.cq-numeric { font-variant-numeric: tabular-nums; }
@media (min-width: 768px) {
  .cq-display { font-size: 40px; } .cq-title-xl { font-size: 32px; } .cq-title-lg { font-size: 26px; }
  .cq-title-md { font-size: 21px; } .cq-title-sm { font-size: 18px; } .cq-body { font-size: 15px; }
}
.t1 { color: var(--cq-text-primary); } .t2 { color: var(--cq-text-secondary); } .t3 { color: var(--cq-text-tertiary); }

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--cq-canvas); color: var(--cq-text-primary); font-family: var(--cq-font-ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--cq-focus-ring); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
svg.i.lg { width: 24px; height: 24px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
img { display: block; max-width: 100%; }

/* ===== App shell ===== */
.app { min-height: 100dvh; }
.sidebar { display: none; }
.mhead { position: sticky; top: 0; z-index: var(--cq-z-navigation); height: var(--cq-header-height); display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; background: var(--cq-canvas); border-bottom: 1px solid var(--cq-border-subtle); }
.mhead .title { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--cq-z-navigation); height: var(--cq-bottom-nav-height); display: grid; grid-template-columns: repeat(5, 1fr); background: var(--cq-surface); border-top: 1px solid var(--cq-border-subtle); }
.mnav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--cq-text-tertiary); min-height: 44px; }
.mnav a[aria-current="page"] { color: var(--cq-text-primary); font-weight: 500; }
main.page { padding: 16px var(--cq-page-gutter) calc(var(--cq-bottom-nav-height) + 88px); }
@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: var(--cq-sidebar-width) 1fr; background: linear-gradient(to right, var(--cq-surface) calc(var(--cq-sidebar-width) - 1px), var(--cq-border-subtle) calc(var(--cq-sidebar-width) - 1px), var(--cq-border-subtle) var(--cq-sidebar-width), var(--cq-canvas) var(--cq-sidebar-width)); }
  .sidebar { display: flex; flex-direction: column; position: sticky; top: 0; height: 100dvh; padding: 12px 12px 12px; border-right: 1px solid var(--cq-border-subtle); background: var(--cq-surface); overflow-y: auto; }
  .mhead, .mnav { display: none; }
  main.page { padding: 28px var(--cq-page-gutter) 64px; min-width: 0; }
}
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 14px; font-weight: 600; font-size: 15px; }
.orgswitch { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 10px; border-radius: var(--cq-radius-md); text-align: left; }
.orgswitch:hover { background: var(--cq-surface-subtle); }
.navgroup { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; }
.navgroup .gl { font-size: 12px; color: var(--cq-text-tertiary); padding: 8px 10px 4px; }
.navlink { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 10px; border-radius: var(--cq-radius-md); font-size: 14px; color: var(--cq-text-secondary); }
.navlink:hover { background: var(--cq-surface-subtle); color: var(--cq-text-primary); }
.navlink[aria-current="page"] { background: var(--cq-surface-strong); color: var(--cq-text-primary); font-weight: 500; }
.navlink .count { margin-left: auto; font-size: 12px; color: var(--cq-text-tertiary); font-variant-numeric: tabular-nums; }
.themesw { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; border-radius: var(--cq-radius-md); background: var(--cq-surface-subtle); font-size: 12px; }
.themesw span { text-align: center; padding: 6px 0; border-radius: 7px; color: var(--cq-text-secondary); }
.themesw span.on { background: var(--cq-surface-raised); color: var(--cq-text-primary); box-shadow: var(--cq-shadow-xs); }

/* Q mark: ring-and-tail aperture. The only element allowed to glow (ADR 0017 F2). */
.qmark { position: relative; display: inline-grid; place-items: center; flex: none; }
.qmark svg { position: relative; }
.qmark.glow::before { content: ""; position: absolute; inset: -30%; border-radius: 50%; background: radial-gradient(circle, var(--cq-q-bloom), transparent 68%); }
.qdock { position: fixed; right: 16px; bottom: calc(var(--cq-bottom-nav-height) + 16px); z-index: var(--cq-z-presence); width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--cq-surface-raised); border: 1px solid var(--cq-border-subtle); box-shadow: var(--cq-shadow-sm); }
@media (min-width: 1024px) { .qdock { bottom: 24px; right: 24px; } }

/* ===== Controls ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--cq-radius-md); font-size: 15px; font-weight: 500; white-space: nowrap; transition: transform var(--cq-motion-fast) var(--cq-ease), background-color var(--cq-motion-fast) ease; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--cq-accent); color: var(--cq-text-inverse); }
.btn.primary:hover { background: var(--cq-accent-hover); }
.btn.ink { background: var(--cq-text-primary); color: var(--cq-canvas); }
.btn.secondary { border: 1px solid var(--cq-border); background: var(--cq-surface-raised); color: var(--cq-text-primary); }
.btn.secondary:hover { background: var(--cq-surface-subtle); }
.btn.ghost { color: var(--cq-text-secondary); padding: 0 12px; }
.btn.ghost:hover { color: var(--cq-text-primary); background: var(--cq-surface-subtle); }
.btn.sm { min-height: 36px; font-size: 14px; padding: 0 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.iconbtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: var(--cq-radius-md); color: var(--cq-text-secondary); flex: none; }
.iconbtn:hover { background: var(--cq-surface-subtle); color: var(--cq-text-primary); }
.iconbtn.round { border-radius: 50%; border: 1px solid var(--cq-border); background: var(--cq-surface-raised); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: var(--cq-radius-full); border: 1px solid var(--cq-border); font-size: 14px; color: var(--cq-text-secondary); white-space: nowrap; background: var(--cq-surface-raised); }
.chip[aria-pressed="true"], .chip.on { background: var(--cq-text-primary); color: var(--cq-canvas); border-color: var(--cq-text-primary); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .flabel { font-size: 14px; font-weight: 500; color: var(--cq-text-primary); }
.input { min-height: 44px; padding: 0 14px; border-radius: var(--cq-radius-md); border: 1px solid var(--cq-border); background: var(--cq-surface-raised); width: 100%; font-size: 16px; }
.input::placeholder { color: var(--cq-text-tertiary); }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--cq-text-tertiary); pointer-events: none; }
.search .input { padding-left: 44px; border-radius: var(--cq-radius-full); background: var(--cq-surface-subtle); border-color: transparent; }

/* Tabs: underline, existing profile style (company-profile-view.tsx tabClass). */
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--cq-border-subtle); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a, .tabs button { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; border-bottom: 2px solid transparent; font-size: 15px; color: var(--cq-text-secondary); white-space: nowrap; margin-bottom: -1px; padding: 0 1px; }
.tabs [aria-current="page"], .tabs [aria-selected="true"] { color: var(--cq-text-primary); border-bottom-color: var(--cq-text-primary); font-weight: 500; }
.tabs .n { font-size: 12px; color: var(--cq-text-tertiary); font-variant-numeric: tabular-nums; }

/* Surfaces */
.card { background: var(--cq-surface-raised); border: 1px solid var(--cq-border-subtle); border-radius: var(--cq-radius-lg); }
.hair > * + * { border-top: 1px solid var(--cq-border-subtle); }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 8px; border-radius: var(--cq-radius-full); font-size: 12.5px; font-weight: 500; border: 1px solid var(--cq-border); color: var(--cq-text-secondary); white-space: nowrap; background: var(--cq-surface-raised); }
.badge svg { width: 14px; height: 14px; }
.badge.pub { color: var(--cq-positive); border-color: color-mix(in oklch, var(--cq-positive) 40%, transparent); background: var(--cq-positive-soft); }
.badge.req { color: var(--cq-warning); border-color: color-mix(in oklch, var(--cq-warning) 45%, transparent); background: var(--cq-warning-soft); }
.badge.priv { color: var(--cq-text-secondary); border-style: dashed; }
.badge.acc { color: var(--cq-accent); border-color: color-mix(in oklch, var(--cq-accent) 40%, transparent); background: var(--cq-accent-soft); }
.avatar { border-radius: 50%; object-fit: cover; flex: none; background: var(--cq-surface-strong); }
.logo { display: grid; place-items: center; flex: none; border-radius: 12px; font-weight: 600; color: var(--cq-text-primary); background: var(--cq-surface-strong); border: 1px solid var(--cq-border-subtle); }
.sect { display: flex; flex-direction: column; gap: 12px; }
.sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.muted-note { font-size: 13px; color: var(--cq-text-tertiary); }

/* Q line: Q's view, labelled as Q's reading, never as fact. */
.qview { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--cq-radius-lg); background: var(--cq-surface-subtle); }
.qview .who { font-size: 12px; color: var(--cq-text-tertiary); }

/* ===== Fit glyphs: shape + word, never colour alone ===== */
.fg { width: 16px; height: 16px; flex: none; }
.fg.fit { color: var(--cq-positive); }
.fg.part { color: var(--cq-warning); }
.fg.no { color: var(--cq-text-secondary); }
.fg.unk { color: var(--cq-text-tertiary); }
.fitpips { display: inline-flex; gap: 3px; align-items: center; }
.fitpips .fg { width: 14px; height: 14px; }
.fitscore { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 12px 4px 10px; border-radius: var(--cq-radius-md); border: 1px solid var(--cq-border-subtle); background: var(--cq-surface-raised); text-align: left; }
.fitscore:hover { border-color: var(--cq-border); }
.fitscore .big { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fitscore .small { font-size: 12px; color: var(--cq-text-tertiary); white-space: nowrap; }

/* ===== Sheet: bottom sheet on phone, side panel on desktop ===== */
.scrim { position: fixed; inset: 0; background: var(--cq-overlay); z-index: var(--cq-z-sheet); opacity: 0; pointer-events: none; transition: opacity var(--cq-motion-base) ease; }
.sheet { position: fixed; z-index: calc(var(--cq-z-sheet) + 1); left: 0; right: 0; bottom: 0; max-height: 88dvh; overflow-y: auto; background: var(--cq-surface-raised); border-radius: 20px 20px 0 0; box-shadow: var(--cq-shadow-overlay); transform: translateY(100%); transition: transform var(--cq-motion-emphasis) cubic-bezier(0.32, 0.72, 0, 1); padding: 8px 20px 28px; }
.sheet:focus { outline: none; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--cq-border); margin: 0 auto 10px; }
.sheet-open .scrim { opacity: 1; pointer-events: auto; }
.sheet-open .sheet { transform: none; }
@media (min-width: 1024px) {
  .sheet { left: auto; top: 0; width: 460px; max-height: none; border-radius: 0; transform: translateX(100%); padding: 20px 28px 32px; }
  .sheet:focus { outline: none; }
.sheet .grab { display: none; }
}

/* ===== States ===== */
.sk { background: var(--cq-surface-strong); border-radius: 8px; animation: skp 1.4s ease-in-out infinite; }
@keyframes skp { 50% { opacity: .55; } }
.state { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 28px 0; max-width: 520px; }
.state .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--cq-surface-subtle); color: var(--cq-text-secondary); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--cq-radius-md); border: 1px solid var(--cq-border-subtle); background: var(--cq-surface-subtle); font-size: 14px; color: var(--cq-text-secondary); }
.banner.err { border-color: color-mix(in oklch, var(--cq-danger) 35%, transparent); background: var(--cq-danger-soft); color: var(--cq-text-primary); }
.banner.err svg { color: var(--cq-danger); }
.toast { position: fixed; left: 50%; bottom: calc(var(--cq-bottom-nav-height) + 20px); transform: translateX(-50%); z-index: var(--cq-z-toast); background: var(--cq-text-primary); color: var(--cq-canvas); padding: 12px 16px; border-radius: var(--cq-radius-md); font-size: 14px; box-shadow: var(--cq-shadow-overlay); display: none; }
.toast.show { display: block; }

/* ===== Mockup controls (not product UI; hidden in screenshots) ===== */
.mock { position: fixed; z-index: 100; top: 8px; right: 8px; font: 12px/1.3 var(--cq-font-ui); background: #111; color: #eee; border-radius: 10px; padding: 6px 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; max-width: 96vw; opacity: .92; }
.mock select { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 3px; font-size: 12px; }
.shot .mock { display: none; }

/* The Q aperture: a ring with a tail. Glow only on Q. */
function qmark(size = 28, glow = true) {
  // Geometry of apps/web/src/components/app-shell/q-nav-icon.tsx: the tail starts inside the ring.
  return `<span class="qmark ${glow ? "glow" : ""}" style="width:${size}px;height:${size}px" aria-hidden="true"><svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${glow ? "var(--cq-q-light)" : "currentColor"}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="11.5" r="7.5"/><path d="M13.6 13.4 19 19.5"/><circle cx="12" cy="11.5" r="1.75" fill="${glow ? "var(--cq-q-light)" : "currentColor"}" stroke="none"/></svg></span>`;
}
/* Fit verdict glyphs: each a distinct shape, always paired with a word. */
const FIT = {
  fit: { word: "Strong match", svg: '<circle cx="8" cy="8" r="7" fill="currentColor"/><path d="m4.8 8.2 2.1 2.1 4.3-4.4" stroke="var(--cq-surface-raised)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' },
  part: { word: "Partial", svg: '<circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/>' },
  no: { word: "Mismatch", svg: '<circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 8h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>' },

};
function fg(kind) {
  return `<svg class="fg ${kind}" viewBox="0 0 16 16" aria-hidden="true">${FIT[kind].svg}</svg>`;
}
/* Fit (docs/research/2026-10-06/matching.md): a band from the deterministic profile,
   a confidence word from coverage and evidence, and one pip per parameter. Never a percentage. */
const PARAMS = ["Stage", "Sector", "Geography", "Cheque size", "Business model", "Traction", "Team", "Thesis", "Round"];
function fitScore(f, opts = {}) {
  const pips = f.p.map((v) => fg(v)).join("");
  const unk = f.p.filter((v) => v === "unk").length;
  const label = `${f.band}, ${f.conf.toLowerCase()} confidence${unk ? `, ${unk} unknown` : ""}. Show why`;
  return `<button class="fitscore" type="button" aria-label="${label}" ${opts.onclick ? `onclick="${opts.onclick}"` : ""}>
    <span style="display:flex;flex-direction:column;gap:4px"><span class="big">${f.band}</span><span class="fitpips">${pips}</span><span class="small">${f.conf} confidence</span></span>
    ${opts.noChevron ? "" : `<span class="t3">${ic("chevron-right", "sm")}</span>`}</button>`;
}

function navIcon(name) {
  return name === "q" ? qmark(20, false) : ic(name);
}
function shell({ active, title, back = false, persona = "investor", headRight = "", org = ORG[persona], noDock = false }) {
  const groups = NAV[persona]
    .map(([label, items]) => `<div class="navgroup">${label ? `<div class="gl">${label}</div>` : ""}${items
      .map(([id, l, icn, count]) => `<a class="navlink" href="#" ${id === active ? 'aria-current="page"' : ""}>${navIcon(icn)}<span>${l}</span>${count ? `<span class="count">${count}</span>` : ""}</a>`)
      .join("")}</div>`)
    .join("");
  const mob = [["discover", "Discover", "compass"], ["explore", "Explore", "explore"], ["q", "Q", "q"], ["relationships", "Relationships", "users"], ["more", "More", "menu"]];
  return `
  <div class="app">
    <aside class="sidebar" aria-label="Main">
      <div class="brand">${qmark(24, false)}<span>Capital Q</span></div>
      <button class="orgswitch" type="button" data-orgswitch aria-label="Switch organisation. Current: ${org.name}">
        <span class="logo" style="width:32px;height:32px;border-radius:8px;font-size:14px">${org.mono}</span>
        <span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${org.name}</span><span class="cq-caption t3">${org.sub}</span></span>
        <span class="t3">${ic("chevrons-up-down", "sm")}</span>
      </button>
      <nav>${groups}</nav>
      <div class="themesw" role="group" aria-label="Theme"><span class="${S.theme === "light" ? "on" : ""}">Light</span><span>Device</span><span class="${S.theme === "dark" ? "on" : ""}">Dark</span></div>
    </aside>
    <div style="min-width:0">
      <header class="mhead">
        ${back ? `<button class="iconbtn" aria-label="Back">${ic("chevron-left", "lg")}</button>` : `<span style="width:12px"></span>`}
        <span class="title">${title}</span>${headRight}
      </header>
      <main class="page" id="main"></main>
    </div>
    <nav class="mnav" aria-label="Main">${mob.map(([id, l, icn]) => `<a href="#" ${id === active || (active === "requests" && id === "more") || (active === "gateq" && id === "more") || (active === "settings" && id === "more") ? 'aria-current="page"' : ""}>${navIcon(icn)}<span>${l}</span></a>`).join("")}</nav>
    ${noDock ? "" : `<button class="qdock" aria-label="Ask Q about this page">${qmark(28)}</button>`}
  </div>
  <div class="scrim" onclick="closeSheet()"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></aside>
  <div class="toast" id="toast" role="status"></div>`;
}

function openSheet(html) {
  const el = document.getElementById("sheet");
  el.innerHTML = `<div class="grab"></div>${html}`;
  document.body.classList.add("sheet-open");
  el.tabIndex = -1;
  setTimeout(() => el.focus({ preventScroll: true }), 50);
}
function closeSheet() {
  document.body.classList.remove("sheet-open");
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2400);
}

/* Mockup controls: switch view/state/theme. Hidden with ?shot=1. */
function mockControls(cfg) {
  const sel = (key, opts) => `<select data-k="${key}" aria-label="${key}">${opts.map(([v, l]) => `<option value="${v}" ${String(S[key] ?? cfg.defaults?.[key]) === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  const el = document.createElement("div");
  el.className = "mock";
  el.innerHTML = `<b>Mockup</b>${cfg.views ? sel("view", cfg.views) : ""}${sel("state", cfg.states || [["full", "Full"], ["loading", "Loading"], ["empty", "Empty"], ["error", "Error"], ["limited", "Permission-limited"]])}${sel("theme", [["light", "Light"], ["dark", "Dark"]])}${(cfg.extra || []).map(([k, opts]) => { S[k] = P.get(k) ?? opts[0][0]; return sel(k, opts); }).join("")}`;
  el.addEventListener("change", (e) => {
    const k = e.target.dataset.k;
    P.set(k, e.target.value);
    location.search = P.toString();
  });
  document.body.appendChild(el);
}
function param(k, d) { return P.get(k) ?? d; }

/* Shared state blocks */
function stateBlock({ icon = "alert", title, body, actions = "" }) {
  return `<div class="state"><span class="ic">${ic(icon)}</span><h2 class="cq-title-sm">${title}</h2><p class="cq-body-sm t2">${body}</p>${actions ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${actions}</div>` : ""}</div>`;
}
function errorBlock(what) {
  return stateBlock({ icon: "alert", title: `${what} didn't load`, body: "The connection dropped before it finished. Nothing you did was lost.", actions: `<button class="btn secondary">${ic("refresh", "sm")}Try again</button>` });
}

<style>
.wrap { max-width: 1180px; display: flex; flex-direction: column; gap: 20px; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.reqs { display: grid; gap: 12px; }
@media (min-width: 1200px) { .reqs { grid-template-columns: 1fr 1fr; gap: 16px; } }
.rc { display: flex; flex-direction: column; gap: 14px; padding: 16px; position: relative; }
.rc:hover { border-color: var(--cq-border); }
.rc .top { display: flex; gap: 14px; align-items: flex-start; }
.thumb { position: relative; width: 60px; aspect-ratio: 9 / 16; border-radius: 10px; overflow: hidden; flex: none; background: var(--cq-stage-canvas); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb span { position: absolute; inset: 0; display: grid; place-items: center; color: var(--cq-stage-text); }
.thumb span svg { width: 18px; height: 18px; filter: drop-shadow(0 1px 2px oklch(0 0 0 / .5)); }
.reasons { display: flex; flex-direction: column; gap: 6px; }
.reasons li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; font-size: 14px; line-height: 1.4; align-items: start; }
.reasons li .fg { margin-top: 2px; }
.qv { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--cq-surface-subtle); font-size: 14px; }
.qv b { font-weight: 600; }
.rc .foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rc .foot .when { margin-right: auto; font-size: 12.5px; color: var(--cq-text-tertiary); }
@media (max-width: 640px) { .rc .foot .when { flex-basis: 100%; } .rc .foot .btn { flex: 1; } }
.stretch { position: absolute; inset: 0; border-radius: inherit; }
.rc .foot, .rc .fitscore, .rc .qv button { position: relative; z-index: 1; }
/* Comparison */
.cmp { display: grid; gap: 0; border: 1px solid var(--cq-border-subtle); border-radius: 16px; overflow: hidden; background: var(--cq-surface-raised); }
.cmp-desk { display: none; }
.cmp-desk > div { padding: 12px 16px; border-top: 1px solid var(--cq-border-subtle); display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
.cmp-desk > .lab { color: var(--cq-text-secondary); background: var(--cq-surface-subtle); }
.cmp-desk > .head { border-top: 0; flex-direction: column; align-items: flex-start; gap: 10px; padding: 18px 16px; }
.cmp-desk > .col-active { background: var(--cq-surface-subtle); }
.best { margin-left: auto; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--cq-border); color: var(--cq-text-secondary); white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.best svg { width: 11px; height: 11px; }
.rank { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: var(--cq-text-primary); color: var(--cq-canvas); flex: none; }
.cmp-phone { display: flex; flex-direction: column; gap: 10px; }
.pc { padding: 0; overflow: hidden; }
.desk-q { display: none; } @media (min-width: 1024px) { .desk-q { display: inline-flex; } }
.pc[data-open="true"] .chev2 svg { transform: rotate(180deg); }
@media (min-width: 1024px) { .cmp.cmp-desk { display: grid; grid-template-columns: 170px repeat(3, minmax(0, 1fr)); } .cmp-phone { display: none; } }
.pc > button { width: 100%; display: flex; gap: 12px; align-items: center; padding: 14px 16px; text-align: left; min-height: 64px; }
.pc .body { padding: 0 16px 16px; display: none; flex-direction: column; gap: 12px; }
.pc[data-open="true"] .body { display: flex; }
.pc[data-open="true"] { border-color: var(--cq-border-strong); }
.prow { display: grid; grid-template-columns: 16px 110px 1fr; gap: 8px; font-size: 14px; padding: 8px 0; border-top: 1px solid var(--cq-border-subtle); align-items: start; }
.prow .fg { margin-top: 2px; }
/* relationship rows */
.rrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--cq-border-subtle); }
.mini { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; color: var(--cq-text-secondary); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--cq-border-subtle); white-space: nowrap; }
.mini .fg { width: 13px; height: 13px; }
</style>

function card(id, lim) {
  const c = CO[id];
  return `<article class="card rc" aria-labelledby="t-${id}">
    <a class="stretch" href="company.html?view=overview" aria-label="Open ${c.n}'s profile"></a>
    <div class="top">
      <span class="thumb"><img src="${c.img}" alt=""><span>${ic("play")}</span></span>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
        <h2 id="t-${id}" class="cq-title-sm">${c.n}</h2>
        <p class="cq-body-sm t1">${c.l}</p>
        <p class="cq-caption t2">${c.meta}</p>
      </div>
    </div>
    <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
      ${fitScore(c.f, { onclick: `openFit('${id}')` })}
      <ul class="reasons" style="flex:1;min-width:220px" aria-label="Why">${c.why.slice(0, 2).map(([v, t]) => `<li>${fg(v)}<span>${t}</span></li>`).join("")}<li>${fg(c.miss[0])}<span>${c.miss[1]}</span></li></ul>
    </div>
    <div class="qv">${qmark(18)}<span><b>Q's view: ${c.q[0]}.</b> <span class="t2">${c.q[1]}</span></span></div>
    ${c.note ? `<p class="cq-body-sm t2" style="display:flex;gap:8px">${ic("message", "sm")}<span>"${c.note}"</span></p>` : ""}
    <div class="foot"><span class="when">${c.when}</span>
      <button class="btn primary sm" ${lim ? "disabled" : ""} onclick="toast('Accepted. ${c.n} can now message you.')">Accept</button>
      <button class="btn secondary sm" ${lim ? "disabled" : ""}>Decline</button>
    </div>
  </article>`;
}

  const head = `<div class="toolbar"><div><h1 class="cq-title-lg">Company requests</h1><p class="cq-body-sm t2">Companies that asked to connect with Northbound Capital.</p></div>
    <a class="btn secondary" href="?view=top3&theme=${S.theme}">${qmark(18)}Q, give me the top three</a></div>
    <div class="toolbar"><div class="chips" role="group" aria-label="Sort">${[["Best fit", 1], ["Newest"], ["Waiting longest"]].map(([l, on]) => `<button class="chip" aria-pressed="${!!on}">${l}</button>`).join("")}</div><span class="cq-caption t2">4 waiting · answer within 7 days</span></div>`;
  if (STATE === "loading") return `<div class="wrap">${head}<div class="reqs">${[1, 2, 3, 4].map(() => `<div class="card rc"><div style="display:flex;gap:14px">${sk("60px", 107, 10)}<div style="flex:1;display:flex;flex-direction:column;gap:8px">${sk("40%", 18)}${sk("90%", 14)}${sk("50%", 12)}</div></div>${sk("100%", 54, 10)}${sk("100%", 48, 12)}</div>`).join("")}</div></div>`;
  if (STATE === "error") return `<div class="wrap">${head}${errorBlock("Company requests")}</div>`;
  if (STATE === "empty") return `<div class="wrap">${head.replace(/<a class="btn secondary"[^]*?<\/a>/, "")}${stateBlock({ icon: "inbox", title: "No company requests yet", body: "When a founder asks to connect, they show up here with how well they fit your mandate. Share your GateQ link to let founders check their fit first.", actions: `<a class="btn primary" href="gateq.html?view=inbox">Open GateQ</a><button class="btn secondary">Review your mandate</button>` })}</div>`;
  const lim = STATE === "limited";
  return `<div class="wrap">${head}${lim ? `<div class="banner">${ic("lock", "sm")}<span>You're a <b>Viewer</b> at Northbound Capital. You can read requests and add notes; partners accept or decline. <a href="#" style="text-decoration:underline">Ask Daniel for access</a></span></div>` : ""}
    <div class="reqs">${["sunline", "kora", "harvest", "freightly"].map((id) => card(id, lim)).join("")}</div></div>`;
}
const LONG = {
  sunline: ["Raising seed; you invest at seed.", "Clean energy, one of your sectors.", "Nairobi; you invest in East Africa.", "$2M round; your $300k fits.", "Subscription per shop, preferred.", "$58k a month, above your $50k minimum.", "Two full-time founders, one technical.", "Some overlap with your SME finance thesis.", "SAFE, lead committed; you co-invest."],
  kora: ["Raising seed; you invest at seed.", "Health insurance software, one of your sectors.", "Lagos; you invest in Nigeria.", "$1.2M round; your $250k fits.", "Fee per paid claim, preferred.", "$31k a month, below your $50k minimum.", "Technical co-founder, 8 years in the field.", "Close to your thesis on paying providers faster.", "Round terms not shared."],
  harvest: ["Raising pre-seed; you invest at pre-seed.", "Agriculture finance, close to your fintech focus.", "Accra; you mostly invest in Nigeria.", "$600k round; your cheque fits.", "Business model not clear from the deck.", "No traction data shared yet.", "Strong lender; no technical co-founder yet.", "Close to your thesis on SME credit.", "Round terms not shared."],
  freightly: ["Series A; your mandate is pre-seed to seed.", "Logistics, close to your trade finance focus.", "Cairo; outside your regions.", "$6M round; your range is $100k–$500k.", "Marketplace take-rate, preferred.", "$210k a month.", "Experienced, full-time team.", "Some overlap with your thesis.", "Needs a lead; you sometimes lead."],
  tally: ["Raising seed; you invest at seed.", "Payments, one of your sectors.", "Dubai head office; customers in Nigeria.", "$1.5M round; your $300k fits.", "Take-rate on payments, preferred.", "$44k a month, close to your minimum.", "Strong commercial founder; CTO part-time.", "Close to your payments thesis.", "SAFE led by a known fund; you co-invest."],
};
function openFit(id) {
  const c = CO[id];
  openSheet(`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="sect-h"><div><h2 id="sheet-title" class="cq-title-md">${c.n}: ${c.f.band.toLowerCase()}</h2><p class="cq-body-sm t2">${c.f.conf} confidence</p></div><button class="iconbtn" onclick="closeSheet()" aria-label="Close">${ic("x")}</button></div>
    <p class="cq-body-sm t2">Measured against your mandate, the same way for every company. Unknown never counts against a company; it only lowers confidence.</p>
    <ul class="hair">${c.f.p.map((v, i) => `<li style="display:grid;grid-template-columns:20px 1fr auto;gap:2px 10px;padding:11px 0">${fg(v)}<span style="font-weight:500">${PARAMS[i]}</span><span class="cq-body-sm t2">${FIT[v].word}</span><span></span><span class="cq-body-sm t1" style="grid-column:2/4">${LONG[id][i]}</span></li>`).join("")}</ul>
    <p class="cq-caption t3">Fit rules version 4. Q's view sits beside this and never changes it.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn secondary sm" href="company.html?view=overview">Open profile</a><button class="btn ghost sm">Change your mandate</button></div>
  </div>`);
}

/* ---------- Top 3 ---------- */
const TOP = ["sunline", "tally", "kora"];
function top3() {
  const head = `<div class="toolbar"><div style="display:flex;gap:12px;align-items:center"><span class="desk-q">${qmark(32)}</span><div><h1 class="cq-title-lg">Your top three right now</h1><p class="cq-body-sm t2">Ranked by fit with your mandate, from 46 companies you can see.</p></div></div>
    <span style="display:flex;gap:8px"><button class="btn ghost sm" onclick="openWhy()">Why these three?</button><button class="iconbtn" aria-label="Close">${ic("x")}</button></span></div>`;
  if (STATE === "loading") return `<div class="wrap">${head}<div class="reading" style="display:flex;gap:12px;align-items:center;padding:16px;border-radius:14px;background:var(--cq-surface-subtle)">${qmark(24)}<span class="cq-body-sm">Ranking 46 companies against your mandate…</span></div>${sk("100%", 380, 16)}</div>`;
  if (STATE === "error") return `<div class="wrap">${head}${errorBlock("The comparison")}</div>`;
  if (STATE === "empty") return `<div class="wrap">${head}${stateBlock({ icon: "compass", title: "No companies fit your mandate yet", body: "None of the 46 companies you can see pass your rules. Widen one rule, or let Q watch and tell you when one does.", actions: `<button class="btn primary">Watch for me</button><button class="btn secondary">Review your mandate</button>` })}</div>`;
  if (STATE === "limited") return `<div class="wrap">${head}${stateBlock({ icon: "sliders", title: "Set your mandate to see fit", body: "Q ranks companies against what you tell it: stage, sectors, countries and cheque size. It takes about two minutes, and you can skip anything.", actions: `<button class="btn primary">Set your mandate</button>` })}</div>`;
  // Best per row from the underlying values (revenue, team), shown as text + icon, never colour alone.
  const BEST = { 5: 0, 6: 0, 3: 0 };
  const best = (i) => BEST[i] ?? -1;
  const active = Number(param("active", "0"));
  const desk = `<div class="cmp cmp-desk" role="table" aria-label="Top three side by side">
    <div class="lab head" role="columnheader"></div>
    ${TOP.map((id, j) => { const c = CO[id]; return `<div class="head ${j === active ? "col-active" : ""}" role="columnheader"><span style="display:flex;gap:10px;align-items:center"><span class="rank">${j + 1}</span><span class="thumb" style="width:40px"><img src="${c.img}" alt=""></span><span><a href="company.html" class="cq-title-sm">${c.n}</a><span class="cq-caption t2" style="display:block">${c.meta}</span></span></span><span style="display:flex;gap:8px;align-items:baseline"><b class="cq-title-sm">${c.f.band}</b><span class="cq-caption t2">${c.f.conf} confidence</span></span></div>`; }).join("")}
    ${PARAMS.map((p, i) => { const b = best(i); return `<div class="lab" role="rowheader">${p}</div>${TOP.map((id, j) => `<div class="${j === active ? "col-active" : ""}" role="cell">${fg(CO[id].f.p[i])}<span style="min-width:0">${LONG[id][i]}</span>${b === j ? `<span class="best">${ic("check")}Best</span>` : ""}</div>`).join("")}`; }).join("")}
    <div class="lab">Q's view</div>${TOP.map((id, j) => `<div class="${j === active ? "col-active" : ""}" style="flex-direction:column;align-items:flex-start;gap:4px"><b>${CO[id].q[0]}</b><span class="cq-body-sm t2">${CO[id].q[1]}</span></div>`).join("")}
    <div class="lab"></div>${TOP.map((id, j) => `<div class="${j === active ? "col-active" : ""}" style="gap:8px;flex-wrap:wrap"><a class="btn primary sm" href="company.html">Open profile</a><button class="btn secondary sm">Save</button><button class="btn secondary sm">Pass</button></div>`).join("")}
  </div>`;
  const phone = `<div class="cmp-phone">${TOP.map((id, j) => { const c = CO[id]; return `<article class="card pc" data-open="${j === active}">
    <button aria-expanded="${j === active}" onclick="this.parentElement.dataset.open = this.parentElement.dataset.open !== 'true'"><span class="rank">${j + 1}</span><span class="thumb" style="width:36px"><img src="${c.img}" alt=""></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span class="cq-title-sm">${c.n}</span><span class="cq-caption t2">${c.f.band} · ${c.f.conf} confidence</span><span class="fitpips">${c.f.p.map(fg).join("")}</span></span><span class="t3 chev2">${ic("chevron-down", "sm")}</span></button>
    <div class="body"><p class="cq-body-sm t1">${c.l}</p>
      <div>${PARAMS.map((p, i) => `<div class="prow">${fg(c.f.p[i])}<span class="t2">${p}</span><span>${LONG[id][i]}${best(i) === j ? ` <span class="best" style="margin-left:4px">${ic("check")}Best of 3</span>` : ""}</span></div>`).join("")}</div>
      <div class="qv">${qmark(18)}<span><b>Q's view: ${c.q[0]}.</b> <span class="t2">${c.q[1]}</span></span></div>
      <div style="display:flex;gap:8px"><a class="btn primary sm" href="company.html">Open profile</a><button class="btn secondary sm">Save</button><button class="btn secondary sm">Pass</button></div></div></article>`; }).join("")}</div>`;
  return `<div class="wrap">${head}${desk}${phone}<p class="cq-caption t3">Q picks by fit only, then explains. Fit rules version 4 · updated 5 Oct, 21:40.</p></div>`;
}
function openWhy() {
  openSheet(`<div style="display:flex;flex-direction:column;gap:14px"><div class="sect-h"><h2 id="sheet-title" class="cq-title-md">Why these three?</h2><button class="iconbtn" onclick="closeSheet()" aria-label="Close">${ic("x")}</button></div>
    <ul class="hair">${[["46", "companies you can see on Capital Q"], ["5", "left out by your rules: 3 outside your countries, 2 in sectors you excluded"], ["41", "ranked by fit with your mandate; ties go to better evidence"], ["3", "shown, from different sectors so you see a spread"]].map(([n, t]) => `<li style="display:flex;gap:14px;padding:12px 0"><b class="cq-title-sm cq-numeric" style="width:32px">${n}</b><span class="cq-body-sm">${t}</span></li>`).join("")}</ul>
    <p class="cq-caption t3">Nobody pays to be ranked. What you watch or open never changes your mandate.</p></div>`);
}

/* ---------- Relationship cards (B3) ---------- */
function relationships() {
  const rows = [["kora", "Talking", "Call on Thursday"], ["sunline", "In diligence", "Cap table requested"], ["tally", "Interest sent", "Waiting for them"], ["harvest", "Saved", ""]];
  const head = `<div><h1 class="cq-title-lg">Relationships</h1><p class="cq-body-sm t2">Every company you're in touch with, and where each stands.</p></div>`;
  if (STATE === "loading") return `<div class="wrap" style="max-width:820px">${head}${[1, 2, 3].map(() => sk("100%", 64, 12)).join("")}</div>`;
  if (STATE === "error") return `<div class="wrap" style="max-width:820px">${head}${errorBlock("Relationships")}</div>`;
  if (STATE === "empty") return `<div class="wrap" style="max-width:820px">${head}${stateBlock({ icon: "users", title: "No relationships yet", body: "Save a company or express interest in Discover and it starts here.", actions: `<a class="btn primary" href="#">Open Discover</a>` })}</div>`;
  const lim = STATE === "limited";
  return `<div class="wrap" style="max-width:820px">${head}
    ${lim ? `<div class="banner">${ic("sliders", "sm")}<span>Fit shows once your mandate is set. <a href="#" style="text-decoration:underline">Set it now</a>, about two minutes.</span></div>` : ""}
    <div>${rows.map(([id, st, next]) => { const c = CO[id]; const chips = c.f.p.map((v, i) => [v, i]).filter(([v]) => v === "fit").slice(0, 3); const unk = c.f.p.indexOf("unk"); return `<a class="rrow" href="company.html"><span class="logo" style="width:44px;height:44px">${c.m}</span>
      <span style="min-width:0;display:flex;flex-direction:column;gap:4px"><span style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><b class="cq-title-sm">${c.n}</b><span class="cq-caption t2">${st}${next ? ` · ${next}` : ""}</span></span>
      <span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${lim ? `<span class="mini">${fg("unk")}Fit not set up</span>` : `<span class="mini" style="color:var(--cq-text-primary);font-weight:500">${c.f.band} · ${c.f.conf.toLowerCase()} confidence</span>${chips.map(([v, i]) => `<span class="mini">${fg(v)}${PARAMS[i]}</span>`).join("")}${unk >= 0 ? `<span class="mini">${fg("unk")}${PARAMS[unk]} unknown</span>` : ""}`}</span></span>
      <span class="t3">${ic("chevron-right")}</span></a>`; }).join("")}</div></div>`;
}

main.innerHTML = ({ requests, top3, relationships })[VIEW]();
if (param("sheet") === "fit") openFit("kora");
if (param("sheet") === "why") openWhy();
</script>
</body>
</html>
