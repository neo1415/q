<!doctype html>
<html lang="en">
<head>

<title>Company Profile Mockup</title>
<style>/* ===== Capital Q tokens: copied verbatim from packages/ui/src/tokens/tokens.css ===== */
:root {
  color-scheme: light;
  --cq-font-ui: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --cq-font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --cq-canvas: oklch(0.985 0.004 92);
  --cq-surface: oklch(0.995 0.002 92);
  --cq-surface-raised: oklch(1 0 0);
  --cq-surface-subtle: oklch(0.965 0.005 92);
  --cq-surface-strong: oklch(0.925 0.007 92);
  --cq-surface-sunken: oklch(0.955 0.005 92);
  --cq-text-primary: oklch(0.19 0.012 258);
  --cq-text-secondary: oklch(0.43 0.012 258);
  --cq-text-tertiary: oklch(0.53 0.01 258);
  --cq-text-inverse: oklch(0.98 0.004 92);
  --cq-border-subtle: oklch(0.91 0.006 258);
  --cq-border: oklch(0.86 0.008 258);
  --cq-border-strong: oklch(0.71 0.012 258);
  --cq-accent: oklch(0.53 0.18 258);
  --cq-accent-hover: oklch(0.48 0.18 258);
  --cq-accent-soft: oklch(0.94 0.035 258);
  --cq-positive: oklch(0.5 0.13 151);
  --cq-positive-soft: oklch(0.95 0.035 151);
  --cq-warning: oklch(0.53 0.12 70);
  --cq-warning-soft: oklch(0.96 0.045 78);
  --cq-danger: oklch(0.56 0.2 27);
  --cq-danger-soft: oklch(0.95 0.04 27);
  --cq-focus-ring: var(--cq-accent);
  --cq-overlay: oklch(0.19 0.012 258 / 0.42);
  --cq-shadow-xs: 0 1px 2px oklch(0.19 0.012 258 / 0.06);
  --cq-shadow-sm: 0 1px 2px oklch(0.19 0.012 258 / 0.06), 0 4px 12px -4px oklch(0.19 0.012 258 / 0.1);
  --cq-shadow-overlay: 0 12px 32px -8px oklch(0.19 0.012 258 / 0.28);
  --cq-radius-xs: 4px; --cq-radius-sm: 6px; --cq-radius-md: 10px; --cq-radius-lg: 14px; --cq-radius-xl: 18px; --cq-radius-full: 999px;
  --cq-z-sticky: 10; --cq-z-navigation: 20; --cq-z-presence: 25; --cq-z-popover: 30; --cq-z-sheet: 40; --cq-z-modal: 50; --cq-z-toast: 60;
  --cq-layout-reading: 760px; --cq-layout-narrow: 600px;
  --cq-page-gutter: 16px; --cq-header-height: 52px; --cq-bottom-nav-height: 60px; --cq-sidebar-width: 240px;
  --cq-motion-instant: 90ms; --cq-motion-fast: 140ms; --cq-motion-base: 200ms; --cq-motion-emphasis: 280ms; --cq-motion-slow: 360ms;
  --cq-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --cq-ease-exit: cubic-bezier(0.4, 0, 1, 1);
  --cq-stage-canvas: oklch(0.17 0.02 262);
  --cq-stage-surface: oklch(1 0 0 / 0.06);
  --cq-stage-surface-strong: oklch(1 0 0 / 0.12);
  --cq-stage-border: oklch(1 0 0 / 0.14);
  --cq-stage-text: oklch(0.98 0.004 92);
  --cq-stage-text-muted: oklch(1 0 0 / 0.62);
  --cq-stage-accent: oklch(0.76 0.14 258);
  --cq-stage-scrim: linear-gradient(to top, oklch(0.12 0.02 262 / 0.82), oklch(0.12 0.02 262 / 0) 62%);
  --cq-q-light: oklch(0.5 0.2 258);
  --cq-q-core: oklch(0.99 0.012 85);
  --cq-q-bloom: oklch(0.62 0.19 258 / 0.34);
  --cq-q-ember: oklch(0.5 0.035 258);
}
@media (min-width: 640px) { :root { --cq-page-gutter: 24px; } }
@media (min-width: 1024px) { :root { --cq-page-gutter: 32px; } }
:root[data-theme="dark"] {
  color-scheme: dark;
  --cq-canvas: oklch(0.16 0.01 258);
  --cq-surface: oklch(0.19 0.01 258);
  --cq-surface-raised: oklch(0.22 0.011 258);
  --cq-surface-subtle: oklch(0.24 0.01 258);
  --cq-surface-strong: oklch(0.3 0.01 258);
  --cq-surface-sunken: oklch(0.14 0.01 258);
  --cq-text-primary: oklch(0.95 0.005 92);
  --cq-text-secondary: oklch(0.75 0.008 258);
  --cq-text-tertiary: oklch(0.63 0.008 258);
  --cq-text-inverse: oklch(0.17 0.01 258);
  --cq-border-subtle: oklch(0.28 0.01 258);
  --cq-border: oklch(0.34 0.011 258);
  --cq-border-strong: oklch(0.47 0.012 258);
  --cq-accent: oklch(0.72 0.15 258);
  --cq-accent-hover: oklch(0.76 0.14 258);
  --cq-accent-soft: oklch(0.27 0.06 258);
  --cq-positive: oklch(0.72 0.12 151);
  --cq-positive-soft: oklch(0.27 0.05 151);
  --cq-warning: oklch(0.79 0.12 78);
  --cq-warning-soft: oklch(0.3 0.06 78);
  --cq-danger: oklch(0.7 0.16 27);
  --cq-danger-soft: oklch(0.28 0.06 27);
  --cq-overlay: oklch(0.1 0.01 258 / 0.6);
  --cq-shadow-xs: 0 1px 2px oklch(0.05 0.01 258 / 0.4);
  --cq-shadow-sm: 0 1px 2px oklch(0.05 0.01 258 / 0.4), 0 4px 12px -4px oklch(0.05 0.01 258 / 0.5);
  --cq-shadow-overlay: 0 12px 32px -8px oklch(0.05 0.01 258 / 0.7);
  --cq-q-light: oklch(0.8 0.13 258);
  --cq-q-core: oklch(0.985 0.014 85);
  --cq-q-bloom: oklch(0.7 0.17 258 / 0.48);
  --cq-q-ember: oklch(0.63 0.035 258);
}

/* ===== Type scale (tokens.css @layer components) ===== */
.cq-display { font-size: 34px; line-height: 1.08; font-weight: 600; letter-spacing: -0.02em; }
.cq-title-xl { font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -0.015em; }
.cq-title-lg { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em; }
.cq-title-md { font-size: 20px; line-height: 1.3; font-weight: 600; }
.cq-title-sm { font-size: 17px; line-height: 1.35; font-weight: 600; }
.cq-body-lg { font-size: 17px; line-height: 1.55; }
.cq-body { font-size: 16px; line-height: 1.5; }
.cq-body-sm { font-size: 14px; line-height: 1.45; }
.cq-label { font-size: 13px; line-height: 1.35; font-weight: 500; }
.cq-caption { font-size: 12px; line-height: 1.35; }
.cq-numeric { font-variant-numeric: tabular-nums; }
@media (min-width: 768px) {
  .cq-display { font-size: 40px; } .cq-title-xl { font-size: 32px; } .cq-title-lg { font-size: 26px; }
  .cq-title-md { font-size: 21px; } .cq-title-sm { font-size: 18px; } .cq-body { font-size: 15px; }
}
.t1 { color: var(--cq-text-primary); } .t2 { color: var(--cq-text-secondary); } .t3 { color: var(--cq-text-tertiary); }

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--cq-canvas); color: var(--cq-text-primary); font-family: var(--cq-font-ui); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--cq-focus-ring); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
svg.i.lg { width: 24px; height: 24px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
img { display: block; max-width: 100%; }

/* ===== App shell ===== */
.app { min-height: 100dvh; }
.sidebar { display: none; }
.mhead { position: sticky; top: 0; z-index: var(--cq-z-navigation); height: var(--cq-header-height); display: flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; background: var(--cq-canvas); border-bottom: 1px solid var(--cq-border-subtle); }
.mhead .title { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--cq-z-navigation); height: var(--cq-bottom-nav-height); display: grid; grid-template-columns: repeat(5, 1fr); background: var(--cq-surface); border-top: 1px solid var(--cq-border-subtle); }
.mnav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--cq-text-tertiary); min-height: 44px; }
.mnav a[aria-current="page"] { color: var(--cq-text-primary); font-weight: 500; }
main.page { padding: 16px var(--cq-page-gutter) calc(var(--cq-bottom-nav-height) + 88px); }
@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: var(--cq-sidebar-width) 1fr; background: linear-gradient(to right, var(--cq-surface) calc(var(--cq-sidebar-width) - 1px), var(--cq-border-subtle) calc(var(--cq-sidebar-width) - 1px), var(--cq-border-subtle) var(--cq-sidebar-width), var(--cq-canvas) var(--cq-sidebar-width)); }
  .sidebar { display: flex; flex-direction: column; position: sticky; top: 0; height: 100dvh; padding: 12px 12px 12px; border-right: 1px solid var(--cq-border-subtle); background: var(--cq-surface); overflow-y: auto; }
  .mhead, .mnav { display: none; }
  main.page { padding: 28px var(--cq-page-gutter) 64px; min-width: 0; }
}
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 14px; font-weight: 600; font-size: 15px; }
.orgswitch { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 10px; border-radius: var(--cq-radius-md); text-align: left; }
.orgswitch:hover { background: var(--cq-surface-subtle); }
.navgroup { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; }
.navgroup .gl { font-size: 12px; color: var(--cq-text-tertiary); padding: 8px 10px 4px; }
.navlink { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 10px; border-radius: var(--cq-radius-md); font-size: 14px; color: var(--cq-text-secondary); }
.navlink:hover { background: var(--cq-surface-subtle); color: var(--cq-text-primary); }
.navlink[aria-current="page"] { background: var(--cq-surface-strong); color: var(--cq-text-primary); font-weight: 500; }
.navlink .count { margin-left: auto; font-size: 12px; color: var(--cq-text-tertiary); font-variant-numeric: tabular-nums; }
.themesw { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; border-radius: var(--cq-radius-md); background: var(--cq-surface-subtle); font-size: 12px; }
.themesw span { text-align: center; padding: 6px 0; border-radius: 7px; color: var(--cq-text-secondary); }
.themesw span.on { background: var(--cq-surface-raised); color: var(--cq-text-primary); box-shadow: var(--cq-shadow-xs); }

/* Q mark: ring-and-tail aperture. The only element allowed to glow (ADR 0017 F2). */
.qmark { position: relative; display: inline-grid; place-items: center; flex: none; }
.qmark svg { position: relative; }
.qmark.glow::before { content: ""; position: absolute; inset: -30%; border-radius: 50%; background: radial-gradient(circle, var(--cq-q-bloom), transparent 68%); }
.qdock { position: fixed; right: 16px; bottom: calc(var(--cq-bottom-nav-height) + 16px); z-index: var(--cq-z-presence); width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--cq-surface-raised); border: 1px solid var(--cq-border-subtle); box-shadow: var(--cq-shadow-sm); }
@media (min-width: 1024px) { .qdock { bottom: 24px; right: 24px; } }

/* ===== Controls ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--cq-radius-md); font-size: 15px; font-weight: 500; white-space: nowrap; transition: transform var(--cq-motion-fast) var(--cq-ease), background-color var(--cq-motion-fast) ease; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--cq-accent); color: var(--cq-text-inverse); }
.btn.primary:hover { background: var(--cq-accent-hover); }
.btn.ink { background: var(--cq-text-primary); color: var(--cq-canvas); }
.btn.secondary { border: 1px solid var(--cq-border); background: var(--cq-surface-raised); color: var(--cq-text-primary); }
.btn.secondary:hover { background: var(--cq-surface-subtle); }
.btn.ghost { color: var(--cq-text-secondary); padding: 0 12px; }
.btn.ghost:hover { color: var(--cq-text-primary); background: var(--cq-surface-subtle); }
.btn.sm { min-height: 36px; font-size: 14px; padding: 0 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.iconbtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: var(--cq-radius-md); color: var(--cq-text-secondary); flex: none; }
.iconbtn:hover { background: var(--cq-surface-subtle); color: var(--cq-text-primary); }
.iconbtn.round { border-radius: 50%; border: 1px solid var(--cq-border); background: var(--cq-surface-raised); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: var(--cq-radius-full); border: 1px solid var(--cq-border); font-size: 14px; color: var(--cq-text-secondary); white-space: nowrap; background: var(--cq-surface-raised); }
.chip[aria-pressed="true"], .chip.on { background: var(--cq-text-primary); color: var(--cq-canvas); border-color: var(--cq-text-primary); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .flabel { font-size: 14px; font-weight: 500; color: var(--cq-text-primary); }
.input { min-height: 44px; padding: 0 14px; border-radius: var(--cq-radius-md); border: 1px solid var(--cq-border); background: var(--cq-surface-raised); width: 100%; font-size: 16px; }
.input::placeholder { color: var(--cq-text-tertiary); }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--cq-text-tertiary); pointer-events: none; }
.search .input { padding-left: 44px; border-radius: var(--cq-radius-full); background: var(--cq-surface-subtle); border-color: transparent; }

/* Tabs: underline, existing profile style (company-profile-view.tsx tabClass). */
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--cq-border-subtle); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a, .tabs button { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; border-bottom: 2px solid transparent; font-size: 15px; color: var(--cq-text-secondary); white-space: nowrap; margin-bottom: -1px; padding: 0 1px; }
.tabs [aria-current="page"], .tabs [aria-selected="true"] { color: var(--cq-text-primary); border-bottom-color: var(--cq-text-primary); font-weight: 500; }
.tabs .n { font-size: 12px; color: var(--cq-text-tertiary); font-variant-numeric: tabular-nums; }

/* Surfaces */
.card { background: var(--cq-surface-raised); border: 1px solid var(--cq-border-subtle); border-radius: var(--cq-radius-lg); }
.hair > * + * { border-top: 1px solid var(--cq-border-subtle); }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px 0 8px; border-radius: var(--cq-radius-full); font-size: 12.5px; font-weight: 500; border: 1px solid var(--cq-border); color: var(--cq-text-secondary); white-space: nowrap; background: var(--cq-surface-raised); }
.badge svg { width: 14px; height: 14px; }
.badge.pub { color: var(--cq-positive); border-color: color-mix(in oklch, var(--cq-positive) 40%, transparent); background: var(--cq-positive-soft); }
.badge.req { color: var(--cq-warning); border-color: color-mix(in oklch, var(--cq-warning) 45%, transparent); background: var(--cq-warning-soft); }
.badge.priv { color: var(--cq-text-secondary); border-style: dashed; }
.badge.acc { color: var(--cq-accent); border-color: color-mix(in oklch, var(--cq-accent) 40%, transparent); background: var(--cq-accent-soft); }
.avatar { border-radius: 50%; object-fit: cover; flex: none; background: var(--cq-surface-strong); }
.logo { display: grid; place-items: center; flex: none; border-radius: 12px; font-weight: 600; color: var(--cq-text-primary); background: var(--cq-surface-strong); border: 1px solid var(--cq-border-subtle); }
.sect { display: flex; flex-direction: column; gap: 12px; }
.sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.muted-note { font-size: 13px; color: var(--cq-text-tertiary); }

/* Q line: Q's view, labelled as Q's reading, never as fact. */
.qview { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--cq-radius-lg); background: var(--cq-surface-subtle); }
.qview .who { font-size: 12px; color: var(--cq-text-tertiary); }

/* ===== Fit glyphs: shape + word, never colour alone ===== */
.fg { width: 16px; height: 16px; flex: none; }
.fg.fit { color: var(--cq-positive); }
.fg.part { color: var(--cq-warning); }
.fg.no { color: var(--cq-text-secondary); }
.fg.unk { color: var(--cq-text-tertiary); }
.fitpips { display: inline-flex; gap: 3px; align-items: center; }
.fitpips .fg { width: 14px; height: 14px; }
.fitscore { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 12px 4px 10px; border-radius: var(--cq-radius-md); border: 1px solid var(--cq-border-subtle); background: var(--cq-surface-raised); text-align: left; }
.fitscore:hover { border-color: var(--cq-border); }
.fitscore .big { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fitscore .small { font-size: 12px; color: var(--cq-text-tertiary); white-space: nowrap; }

/* ===== Sheet: bottom sheet on phone, side panel on desktop ===== */
.scrim { position: fixed; inset: 0; background: var(--cq-overlay); z-index: var(--cq-z-sheet); opacity: 0; pointer-events: none; transition: opacity var(--cq-motion-base) ease; }
.sheet { position: fixed; z-index: calc(var(--cq-z-sheet) + 1); left: 0; right: 0; bottom: 0; max-height: 88dvh; overflow-y: auto; background: var(--cq-surface-raised); border-radius: 20px 20px 0 0; box-shadow: var(--cq-shadow-overlay); transform: translateY(100%); transition: transform var(--cq-motion-emphasis) cubic-bezier(0.32, 0.72, 0, 1); padding: 8px 20px 28px; }
.sheet:focus { outline: none; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--cq-border); margin: 0 auto 10px; }
.sheet-open .scrim { opacity: 1; pointer-events: auto; }
.sheet-open .sheet { transform: none; }
@media (min-width: 1024px) {
  .sheet { left: auto; top: 0; width: 460px; max-height: none; border-radius: 0; transform: translateX(100%); padding: 20px 28px 32px; }
  .sheet:focus { outline: none; }
.sheet .grab { display: none; }
}

/* ===== States ===== */
.sk { background: var(--cq-surface-strong); border-radius: 8px; animation: skp 1.4s ease-in-out infinite; }
@keyframes skp { 50% { opacity: .55; } }
.state { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 28px 0; max-width: 520px; }
.state .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--cq-surface-subtle); color: var(--cq-text-secondary); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--cq-radius-md); border: 1px solid var(--cq-border-subtle); background: var(--cq-surface-subtle); font-size: 14px; color: var(--cq-text-secondary); }
.banner.err { border-color: color-mix(in oklch, var(--cq-danger) 35%, transparent); background: var(--cq-danger-soft); color: var(--cq-text-primary); }
.banner.err svg { color: var(--cq-danger); }
.toast { position: fixed; left: 50%; bottom: calc(var(--cq-bottom-nav-height) + 20px); transform: translateX(-50%); z-index: var(--cq-z-toast); background: var(--cq-text-primary); color: var(--cq-canvas); padding: 12px 16px; border-radius: var(--cq-radius-md); font-size: 14px; box-shadow: var(--cq-shadow-overlay); display: none; }
.toast.show { display: block; }

/* ===== Mockup controls (not product UI; hidden in screenshots) ===== */
.mock { position: fixed; z-index: 100; top: 8px; right: 8px; font: 12px/1.3 var(--cq-font-ui); background: #111; color: #eee; border-radius: 10px; padding: 6px 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; max-width: 96vw; opacity: .92; }
.mock select { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 3px; font-size: 12px; }
.shot .mock { display: none; }

@media (prefers-reduced-motion: reduce) {

}

  fit: { word: "Strong match", svg: '<circle cx="8" cy="8" r="7" fill="currentColor"/><path d="m4.8 8.2 2.1 2.1 4.3-4.4" stroke="var(--cq-surface-raised)" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' },

  return `<svg class="fg ${kind}" viewBox="0 0 16 16" aria-hidden="true">${FIT[kind].svg}</svg>`;

/* Fit (docs/research/2026-10-06/matching.md): a band from the deterministic profile,
   a confidence word from coverage and evidence, and one pip per parameter. Never a percentage. */
const PARAMS = ["Stage", "Sector", "Geography", "Cheque size", "Business model", "Traction", "Team", "Thesis", "Round"];
function fitScore(f, opts = {}) {
  const pips = f.p.map((v) => fg(v)).join("");
  const unk = f.p.filter((v) => v === "unk").length;
  const label = `${f.band}, ${f.conf.toLowerCase()} confidence${unk ? `, ${unk} unknown` : ""}. Show why`;
  return `<button class="fitscore" type="button" aria-label="${label}" ${opts.onclick ? `onclick="${opts.onclick}"` : ""}>
    <span style="display:flex;flex-direction:column;gap:4px"><span class="big">${f.band}</span><span class="fitpips">${pips}</span><span class="small">${f.conf} confidence</span></span>
    ${opts.noChevron ? "" : `<span class="t3">${ic("chevron-right", "sm")}</span>`}</button>`;
}

function shell({ active, title, back = false, persona = "investor", headRight = "", org = ORG[persona], noDock = false }) {

  const mob = [["discover", "Discover", "compass"], ["explore", "Explore", "explore"], ["q", "Q", "q"], ["relationships", "Relationships", "users"], ["more", "More", "menu"]];
  return `
  <div class="app">
    <aside class="sidebar" aria-label="Main">

      <main class="page" id="main"></main>

    <nav class="mnav" aria-label="Main">${mob.map(([id, l, icn]) => `<a href="#" ${id === active || (active === "requests" && id === "more") || (active === "gateq" && id === "more") || (active === "settings" && id === "more") ? 'aria-current="page"' : ""}>${navIcon(icn)}<span>${l}</span></a>`).join("")}</nav>

}

function openSheet(html) {
  const el = document.getElementById("sheet");
  el.innerHTML = `<div class="grab"></div>${html}`;
  document.body.classList.add("sheet-open");
  el.tabIndex = -1;
  setTimeout(() => el.focus({ preventScroll: true }), 50);
}
function closeSheet() {
  document.body.classList.remove("sheet-open");
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2400);
}

/* Mockup controls: switch view/state/theme. Hidden with ?shot=1. */
function mockControls(cfg) {
  const sel = (key, opts) => `<select data-k="${key}" aria-label="${key}">${opts.map(([v, l]) => `<option value="${v}" ${String(S[key] ?? cfg.defaults?.[key]) === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  const el = document.createElement("div");
  el.className = "mock";
  el.innerHTML = `<b>Mockup</b>${cfg.views ? sel("view", cfg.views) : ""}${sel("state", cfg.states || [["full", "Full"], ["loading", "Loading"], ["empty", "Empty"], ["error", "Error"], ["limited", "Permission-limited"]])}${sel("theme", [["light", "Light"], ["dark", "Dark"]])}${(cfg.extra || []).map(([k, opts]) => { S[k] = P.get(k) ?? opts[0][0]; return sel(k, opts); }).join("")}`;
  el.addEventListener("change", (e) => {
    const k = e.target.dataset.k;
    P.set(k, e.target.value);
    location.search = P.toString();
  });
  document.body.appendChild(el);
}
function param(k, d) { return P.get(k) ?? d; }

/* Shared state blocks */
function stateBlock({ icon = "alert", title, body, actions = "" }) {
  return `<div class="state"><span class="ic">${ic(icon)}</span><h2 class="cq-title-sm">${title}</h2><p class="cq-body-sm t2">${body}</p>${actions ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${actions}</div>` : ""}</div>`;
}
function errorBlock(what) {

function elevator() {

  const vids = STATE === "limited" ? VIDS.slice(0, 1) : VIDS;
  const tile = (v, i) => `<button class="vtile" onclick="playFs(${i})" aria-label="Play ${v.t}, ${v.d}">
      <span class="poster" style="aspect-ratio:9/16;width:100%"><img src="${v.img}" alt=""><span class="play">${ic("play")}</span><span class="dur">${v.d}</span>${v.seen ? `<span class="seen">${ic("check")}Watched</span>` : ""}</span>

  return page("elevator", `
    <p class="cq-body-sm t2">${vids.length} ${vids.length === 1 ? "video" : "videos"} from Amara and Tunde. Captions on.</p>
    <div class="player">

        <div class="ctrl"><button class="sbtn" aria-label="Pause">${ic("pause")}</button><span class="track"><i></i></span><span class="cq-caption cq-numeric" style="color:var(--cq-stage-text-muted)">0:22 / 0:58</span><button class="sbtn" aria-label="Turn sound on">${ic("volume-x")}</button><button class="sbtn" aria-label="Full screen">${ic("maximize")}</button></div>
      </div>
      <div class="vlist" role="list">${vids.map((v, i) => `<button class="vrow" role="listitem" ${i === 0 ? 'aria-current="true"' : ""}><span class="poster" style="aspect-ratio:9/16"><img src="${v.img}" alt=""></span><span style="flex:1;min-width:0"><span style="display:block;font-weight:500">${v.t}</span><span class="cq-caption t3 cq-numeric">${v.d}${v.seen ? " · Watched" : ""}${v.ar === "16 / 9" ? " · Landscape" : ""}</span></span>${i === 0 ? `<span class="cq-caption t2">Playing</span>` : ""}</button>`).join("")}${lockedRow}</div>
      <div class="vgrid desk-hide">${vids.map(tile).join("")}</div>

    <div class="phone-only">${lockedRow}</div>

      </div>
    </div>`);

function playFs(i) {
  if (matchMedia("(min-width: 1024px)").matches) return;

}

function openReq(name) {
  const many = name === "all";
  openSheet(`<div style="display:flex;flex-direction:column;gap:16px">
    <div class="sect-h"><h2 id="sheet-title" class="cq-title-md">${many ? "Request 7 documents" : "Request this document"}</h2><button class="iconbtn" onclick="closeSheet()" aria-label="Close">${ic("x")}</button></div>

}

function dataroomFounder() {
  const fpage = (body) => `<div style="max-width:880px;display:flex;flex-direction:column;gap:20px">
    <div class="sect-h" style="flex-wrap:wrap;align-items:center"><div><h1 class="cq-title-lg">Data room</h1><p class="cq-body-sm t2">What investors can see, folder by folder. You choose for each document.</p></div>
    <button class="btn primary">${ic("upload", "sm")}Upload files</button></div>${body}</div>`;
  if (STATE === "loading") return fpage(`<div class="reading">${qmark(32)}<div style="flex:1;display:flex;flex-direction:column;gap:8px"><p class="cq-body" style="font-weight:500">Q is sorting 7 files into folders</p><div class="bar"><i style="width:57%"></i></div><p class="cq-caption t2">4 of 7 done. You can keep working.</p></div></div>${sk("100%", 64, 12)}${sk("100%", 64, 12)}`);
  if (STATE === "error") return fpage(`<div class="banner err">${ic("alert", "sm")}<span><b>"Bank statement Aug.heic" couldn't be added.</b> Q can read PDF, Word, Excel, PowerPoint and images. Export it as a PDF and try again.</span></div>` + roomFounderBody());
  if (STATE === "empty") return fpage(`<div class="upzone">${ic("upload", "lg")}<p class="cq-title-sm">Upload whatever you already have</p><p class="cq-body-sm t2" style="max-width:44ch">Drop any documents here. Q sorts them into the standard folders investors expect, and everything starts as Private until you choose.</p><button class="btn primary">Choose files</button></div>

}

let curSec = Number(param("sec", "0"));
function goSec(i) {
  curSec = Math.max(0, Math.min(SECTIONS.length - 1, i));
  document.getElementById("sec-" + curSec).scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
  syncSec();
}
function syncSec() {
  document.querySelectorAll("#secchips .chip").forEach((c, j) => { c.setAttribute("aria-selected", j === curSec); c.setAttribute("aria-pressed", j === curSec); if (j === curSec) c.scrollIntoView({ inline: "center", block: "nearest" }); });
  document.querySelectorAll(".qstrip button").forEach((c, j) => j === curSec ? c.setAttribute("aria-current", "true") : c.removeAttribute("aria-current"));
  document.querySelectorAll(".dots i").forEach((c, j) => c.classList.toggle("on", j === curSec));
}
let curSlide = 0;
function slideBy(d) {
  curSlide = Math.max(0, Math.min(SLIDES.length - 1, curSlide + d));
  const el = document.getElementById("slides");
  el.scrollTo({ left: el.children[curSlide].offsetLeft - el.offsetLeft, behavior: "smooth" });
  document.getElementById("sc").textContent = `Slide ${curSlide + 1} of 14`;
}

/* ---------- Founder's deck coaching ---------- */
const COACH = {
  problem: [4, "Pain is quantified and sourced. To reach 5, add a quote or two from clinic owners."],
  solution: [4, "Shows the before and after in one picture."],
  value: [3, "Say who gains what, in one line: clinics paid in 21 days instead of 94."],
  market: [2, "One big top-down number from a 2022 report. Build it bottom-up instead: clinics you can reach × what each pays you."],
  gtm: [2, "You say HMOs introduce clinics, but not what it costs to win a clinic or how long it takes. Add both, even as ranges."],
  model: [3, "Clear who pays and how. Add your margin per claim, and how much revenue is in naira versus dollars."],
  traction: [4, "Monthly revenue matches the accounts in your data room. Add the month to the clinic count."],
  competition: [0, "There's no competition slide. Every company has competition, even paper and spreadsheets. Name 3 to 5 and say why clinics pick you."],
  financials: [2, "You show 2025 and monthly spend, but no plan for the next 18 months. Add a simple monthly plan with headcount."],
  ask: [4, "Clear amount, terms and use of funds. Say which milestones the round gets you to."],
  founders: [4, "Shows why you two. Add your years in health claims, Tunde."],
  team: [3, "Name the two hires this round pays for."],
};
const SCORE_WORD = ["Not in the deck yet", "Mentioned", "Basic", "Clear", "Strong", "Exceptional"];
const REQUIRED = ["problem", "solution", "market", "model", "traction", "founders", "ask"];
function scoreGlyph(n) { return n >= 3 ? fg("fit") : n >= 1 ? fg("part") : fg("unk"); }
function scorePips(n) { return `<span class="fitpips" aria-hidden="true">${[1, 2, 3, 4, 5].map((i) => `<i style="width:6px;height:6px;border-radius:3px;background:${i <= n ? "var(--cq-text-primary)" : "var(--cq-border)"}"></i>`).join("")}</span>`; }
function coach() {
  const fp = (body) => `<div class="prof"><div style="display:flex;flex-direction:column;gap:20px;min-width:0">
    <div class="sect-h" style="flex-wrap:wrap;align-items:center"><div><h1 class="cq-title-lg">Your pitch deck</h1><p class="cq-body-sm t2">Version 3 · 14 slides · Uploaded 28 September</p></div>
    <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" ${STATE === "limited" ? "disabled" : ""}>${ic("upload", "sm")}Upload a new version</button></span></div>${body}</div>
    <aside class="rail"><div class="slide" style="border-radius:12px"><span class="tag">Kora Health</span><h4>Clinics get paid in weeks, not months.</h4><p>Seed round · October 2026</p></div>
    <div class="rows"><div><span>Investors can</span><span>${dl ? "View and download" : "View only"}</span></div><div><span>Opened by</span><span>11 investors</span></div><div><span>Read for about</span><span>4 minutes on average</span></div></div>
    <div class="sect"><p class="flabel">Let investors download the deck</p><div class="seg" role="group" aria-label="Download"><button aria-pressed="${!dl}">${ic("lock")}View only</button><button aria-pressed="${dl}">${ic("download")}Allow download</button></div></div></aside></div>`;
  if (STATE === "loading") return fp(`<div class="reading">${qmark(36)}<div style="flex:1;display:flex;flex-direction:column;gap:8px"><p class="cq-body" style="font-weight:500">Q is reading your deck</p><div class="bar"><i style="width:43%"></i></div><p class="cq-caption t2">Slide 6 of 14. This takes about a minute; you can leave this page.</p></div></div>${sk("100%", 160, 16)}${[1, 2, 3, 4].map(() => sk("100%", 52, 10)).join("")}`);
  if (STATE === "empty") return `<div style="max-width:720px;display:flex;flex-direction:column;gap:20px"><h1 class="cq-title-lg">Your pitch deck</h1>
    <div class="upzone">${ic("upload", "lg")}<p class="cq-title-sm">Upload your deck, any state it's in</p><p class="cq-body-sm t2" style="max-width:46ch">PDF, PowerPoint or Keynote. Q reads every slide, lays it out in the 12 sections investors look for, and tells you what's missing. Nothing is shown to investors until you say so.</p><button class="btn primary">Choose a file</button></div>
    <p class="cq-body-sm t2">No deck yet? <a href="#" style="text-decoration:underline">Build one with Q</a> from what's already in your profile.</p></div>`;
  if (STATE === "error") return fp(`<div class="banner err">${ic("alert", "sm")}<span><b>Q couldn't read "Kora deck v4.pdf".</b> It's made of scanned pictures, so the words can't be read reliably. Export the original from PowerPoint or Keynote and upload that. Version 3 is still live.</span></div>` + coachBody());
  return fp(coachBody());
}
function coachBody() {
  const lim = STATE === "limited";
  const atStd = SECTIONS.filter(([id]) => COACH[id][0] >= 3).length;
  const blockers = REQUIRED.filter((id) => COACH[id][0] < 3);

      <p class="cq-body-sm t2">Investors already see your deck${dl ? " and can download it" : ", view only"}. Q shows them the same 12 sections for every company, so missing ones read "Not in the deck yet" until you add them. They never see these notes.</p>

    </section>

      <div>${order.map(([id, l, , i], k) => { const [n, note] = COACH[id]; const bad = n < 3; return `<details class="coachrow" ${bad && k < 4 ? "open" : ""}><summary>${scoreGlyph(n)}<span style="font-weight:500">${l}${REQUIRED.includes(id) && bad ? ` <span class="cq-caption t2" style="font-weight:400">· needed for the minimum</span>` : ""}</span><span class="rating">${scorePips(n)}<span>${SCORE_WORD[n]}</span></span><span class="chev">${ic("chevron-down", "sm")}</span></summary>
        <div style="padding:0 0 16px 36px;display:flex;flex-direction:column;gap:10px"><p class="cq-body t2" style="max-width:60ch">${note}</p>${bad ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary sm" onclick="openFix('${id}')" ${lim ? "disabled" : ""}>${qmark(16, false)}Let Q draft it</button><button class="btn ghost sm">Answer a question</button></div>` : ""}</div></details>`; }).join("")}</div>
    </section>`;
}

/* ---------- Sheets: fit breakdown + Q's view (phone) ---------- */
function openFit() {
  const rows = [
    ["fit", "Raising a seed round; you invest at pre-seed and seed.", "Company profile"],
    ["fit", "Health insurance software, one of your sectors.", "Company profile"],
    ["fit", "Based in Lagos; you invest in Nigeria.", "Company profile"],
    ["fit", "Raising $1.2M; your typical cheque of $250k fits.", "Deck, slide 12"],
    ["fit", "Takes a fee on every claim paid, a model you prefer.", "Deck, slide 8"],
    ["part", "$31k monthly revenue, below the $50k you ask for at seed, but up 3x this year.", "Deck, slide 9 · matches accounts"],
    ["fit", "Technical co-founder with 8 years in hospital software.", "Founder profiles"],
    ["fit", "Close to your thesis on paying healthcare providers faster.", "Your mandate"],
    ["unk", "Round terms not shared: Q can't tell if they need a lead.", ""],
  ];
  openSheet(`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="sect-h"><h2 id="sheet-title" class="cq-title-md">Good fit · Medium confidence</h2><button class="iconbtn" onclick="closeSheet()" aria-label="Close">${ic("x")}</button></div>
    <p class="cq-body-sm t2">Measured against the mandate you set, the same way for every company. Unknown never counts against them; it only lowers confidence.</p>
    <ul class="hair">${rows.map(([v, a, src], i) => `<li style="display:grid;grid-template-columns:20px 1fr auto;gap:2px 10px;padding:11px 0;align-items:start">${fg(v)}<span style="font-weight:500">${PARAMS[i]}</span><span class="cq-body-sm t2">${FIT[v].word}</span><span></span><span class="cq-body-sm t1" style="grid-column:2/4">${a}</span>${src ? `<span></span><span class="cq-caption t3" style="grid-column:2/4">From: ${src}</span>` : ""}</li>`).join("")}</ul>
    <p class="cq-caption t3">Fit rules version 4 · Q's view never changes this.</p>
    <a class="btn ghost sm" style="align-self:flex-start" href="#">Change your mandate ${ic("chevron-right", "sm")}</a>
  </div>`);
}
function openQView() {
  openSheet(`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="sect-h"><span style="display:flex;gap:10px;align-items:center">${qmark(24)}<h2 id="sheet-title" class="cq-title-md">Q's view</h2></span><button class="iconbtn" onclick="closeSheet()" aria-label="Close">${ic("x")}</button></div>
    <p class="cq-title-sm">Worth a look.</p>
    <p class="cq-body t2">Fits your seed health mandate in West Africa. Revenue matches the accounts they shared. Ask how they compare with other claims tools: the deck doesn't say.</p>
    <p class="cq-caption t3">Q's reading of what's shared with you. Not a verified fact, and not advice to invest.</p>
  </div>`);
}

function fitCards() {
  const c = document.getElementById("cards");
  if (!c) return;
  const i = Math.round(c.scrollLeft / (c.children[0].offsetWidth + 12));
  c.style.height = c.children[Math.min(i, c.children.length - 1)].offsetHeight + 12 + "px";
  if (i !== curSec) { curSec = i; syncSec(); }
}
main.innerHTML = ({ overview, elevator, dataroom, "dataroom-founder": dataroomFounder, deck, coach, team, person })[VIEW]();
document.querySelector('.tabs [aria-current="page"]')?.scrollIntoView({ inline: "center", block: "nearest" });
window.scrollTo(0, 0);
const cardsEl = document.getElementById("cards");
if (cardsEl) { cardsEl.addEventListener("scroll", () => { clearTimeout(cardsEl._t); cardsEl._t = setTimeout(fitCards, 80); }); setTimeout(fitCards, 60); }
if (param("sheet") === "fit") openFit();
if (param("sheet") === "req") openReq("Cap table, September 2026");
if (param("sheet") === "fix") openFix("competition");
if (param("sheet") === "fixmarket") openFix("market");
if (param("sheet") === "vis") openVis("Cap table, September 2026", "req");
if (param("sheet") === "qview") openQView();
if (param("fs") === "1") playFs(0);
if (VIEW === "deck" && param("sec")) setTimeout(() => { const el = document.getElementById("sec-" + curSec); el && el.parentElement.scrollTo({ left: el.offsetLeft - el.parentElement.offsetLeft - (matchMedia("(min-width:1024px)").matches ? 0 : 16) }); syncSec(); }, 30);
</script>
