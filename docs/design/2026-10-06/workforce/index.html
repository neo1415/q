<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Q's team: Work (P7 mockup)</title>
    <!--
  P7 design mockup: Capital Q's agent workforce on the Work page.
  Every agent state, every Work tab, phone + desktop, classic light/dark and
  black-and-gold light/dark, zoomable canvas, hover + click detail, reduced
  motion. Fictional data only. Query: ?theme=light|dark|bg-light|bg-dark
  &tab=needs|progress|done|team|cost &motion=reduce &net=offline|slow
  &state=loading &pause=budget &open=<agentKey> &zoom=0.7
-->
    <style>
      :root {
        --cq-font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue",
          Arial, sans-serif;
        --cq-font-editorial: Georgia, "Times New Roman", serif;
        --cq-radius-md: 10px;
        --cq-radius-lg: 16px;
        --cq-motion-fast: 140ms;
        --cq-motion-base: 220ms;
        --cq-ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      [data-theme="light"] {
        --cq-canvas: oklch(0.985 0.004 92);
        --cq-surface: oklch(0.995 0.002 92);
        --cq-surface-raised: #fff;
        --cq-surface-subtle: oklch(0.965 0.005 92);
        --cq-text-primary: oklch(0.19 0.012 258);
        --cq-text-secondary: oklch(0.43 0.012 258);
        --cq-text-tertiary: oklch(0.53 0.01 258);
        --cq-border-subtle: oklch(0.91 0.006 258);
        --cq-border: oklch(0.86 0.008 258);
        --cq-border-strong: oklch(0.71 0.012 258);
        --cq-accent: oklch(0.53 0.18 258);
        --cq-accent-soft: oklch(0.94 0.035 258);
        --cq-on-accent: #fff;
        --cq-positive: oklch(0.5 0.13 151);
        --cq-positive-soft: oklch(0.95 0.035 151);
        --cq-warning: oklch(0.53 0.12 70);
        --cq-warning-soft: oklch(0.96 0.045 78);
        --cq-danger: oklch(0.56 0.2 27);
        --cq-danger-soft: oklch(0.95 0.04 27);
        --cq-chrome: var(--cq-surface);
        --cq-chrome-text: var(--cq-text-primary);
        --cq-chrome-muted: var(--cq-text-secondary);
        --cq-chrome-border: var(--cq-border-subtle);
        --cq-chrome-accent: var(--cq-accent);
        --cq-q-bloom: oklch(0.53 0.18 258 / 0.22);
      }
      [data-theme="dark"] {
        --cq-canvas: oklch(0.16 0.01 258);
        --cq-surface: oklch(0.19 0.01 258);
        --cq-surface-raised: oklch(0.22 0.011 258);
        --cq-surface-subtle: oklch(0.24 0.01 258);
        --cq-text-primary: oklch(0.95 0.005 92);
        --cq-text-secondary: oklch(0.75 0.008 258);
        --cq-text-tertiary: oklch(0.63 0.008 258);
        --cq-border-subtle: oklch(0.28 0.01 258);
        --cq-border: oklch(0.34 0.011 258);
        --cq-border-strong: oklch(0.47 0.012 258);
        --cq-accent: oklch(0.72 0.15 258);
        --cq-accent-soft: oklch(0.27 0.06 258);
        --cq-on-accent: oklch(0.16 0.01 258);
        --cq-positive: oklch(0.72 0.12 151);
        --cq-positive-soft: oklch(0.27 0.05 151);
        --cq-warning: oklch(0.79 0.12 78);
        --cq-warning-soft: oklch(0.3 0.06 78);
        --cq-danger: oklch(0.7 0.16 27);
        --cq-danger-soft: oklch(0.28 0.06 27);
        --cq-chrome: var(--cq-surface);
        --cq-chrome-text: var(--cq-text-primary);
        --cq-chrome-muted: var(--cq-text-secondary);
        --cq-chrome-border: var(--cq-border-subtle);
        --cq-chrome-accent: var(--cq-accent);
        --cq-q-bloom: oklch(0.72 0.15 258 / 0.3);
      }
      [data-theme="bg-light"] {
        --cq-canvas: #f6f4ef;
        --cq-surface: #fbfaf7;
        --cq-surface-raised: #fff;
        --cq-surface-subtle: #f1ede4;
        --cq-text-primary: #16140f;
        --cq-text-secondary: #4f4a40;
        --cq-text-tertiary: #6b6457;
        --cq-border-subtle: #e7e1d5;
        --cq-border: #d9d1c1;
        --cq-border-strong: #8f8673;
        --cq-accent: #8a6a12;
        --cq-accent-soft: #f3ead2;
        --cq-on-accent: #fff;
        --cq-positive: oklch(0.5 0.13 151);
        --cq-positive-soft: oklch(0.95 0.035 151);
        --cq-warning: oklch(0.53 0.12 70);
        --cq-warning-soft: oklch(0.96 0.045 78);
        --cq-danger: oklch(0.56 0.2 27);
        --cq-danger-soft: oklch(0.95 0.04 27);
        --cq-chrome: #16140f;
        --cq-chrome-text: #f4efe2;
        --cq-chrome-muted: #bfb6a2;
        --cq-chrome-border: #2f2b22;
        --cq-chrome-accent: #e2b858;
        --cq-q-bloom: #c9a22757;
      }
      [data-theme="bg-dark"] {
        --cq-canvas: #0f0e0b;
        --cq-surface: #17150f;
        --cq-surface-raised: #1d1a13;
        --cq-surface-subtle: #232017;
        --cq-text-primary: #f4efe2;
        --cq-text-secondary: #c9c0ab;
        --cq-text-tertiary: #a59c87;
        --cq-border-subtle: #2a261c;
        --cq-border: #3a3427;
        --cq-border-strong: #7a715c;
        --cq-accent: #c9a227;
        --cq-accent-soft: #2e2714;
        --cq-on-accent: #16140f;
        --cq-positive: oklch(0.72 0.12 151);
        --cq-positive-soft: oklch(0.27 0.05 151);
        --cq-warning: oklch(0.79 0.12 78);
        --cq-warning-soft: oklch(0.3 0.06 78);
        --cq-danger: oklch(0.7 0.16 27);
        --cq-danger-soft: oklch(0.28 0.06 27);
        --cq-chrome: #16140f;
        --cq-chrome-text: #f4efe2;
        --cq-chrome-muted: #bfb6a2;
        --cq-chrome-border: #2f2b22;
        --cq-chrome-accent: #e2b858;
        --cq-q-bloom: #e2b8587a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--cq-canvas);
        color: var(--cq-text-primary);
        font: 15px/1.45 var(--cq-font-sans);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      :focus-visible {
        outline: 2px solid var(--cq-accent);
        outline-offset: 2px;
        border-radius: 6px;
      }

      /* Shell */
      .app {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        min-height: 100vh;
      }
      .nav {
        background: var(--cq-chrome);
        color: var(--cq-chrome-text);
        border-right: 1px solid var(--cq-chrome-border);
        padding: 20px 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        padding: 4px 10px 18px;
      }
      .brand i {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid var(--cq-chrome-accent);
        display: inline-block;
        position: relative;
      }
      .brand i:after {
        content: "";
        position: absolute;
        width: 7px;
        height: 2.5px;
        background: var(--cq-chrome-accent);
        right: -4px;
        bottom: 0;
        transform: rotate(45deg);
      }
      .nav a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 40px;
        padding: 0 10px;
        border-radius: 8px;
        color: var(--cq-chrome-muted);
        text-decoration: none;
      }
      .nav a.on {
        background: color-mix(in oklab, var(--cq-chrome-text) 9%, transparent);
        color: var(--cq-chrome-text);
        font-weight: 500;
      }
      .nav a b {
        font-weight: 600;
        font-size: 12px;
        min-width: 20px;
        height: 20px;
        border-radius: 10px;
        display: inline-grid;
        place-items: center;
        background: var(--cq-chrome-accent);
        color: var(--cq-chrome);
      }
      main {
        padding: 28px 40px 80px;
        min-width: 0;
      }
      .page {
        max-width: 1120px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .head {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 28px;
        line-height: 1.15;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .live {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--cq-text-secondary);
        font-size: 13px;
        margin-left: auto;
        min-height: 28px;
      }
      .live .pip {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--cq-positive);
      }
      .live.offline .pip {
        background: transparent;
        border: 1.5px solid var(--cq-text-tertiary);
      }
      .live.slow .pip {
        background: var(--cq-warning);
      }
      .banner {
        display: flex;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface-subtle);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 14px;
      }
      .banner .grow {
        flex: 1;
      }
      .composer {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface-raised);
        border-radius: 14px;
        padding: 6px 6px 6px 16px;
        min-height: 52px;
        color: var(--cq-text-tertiary);
      }
      .composer span {
        flex: 1;
      }
      .btn {
        min-height: 44px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface-raised);
        cursor: pointer;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--cq-surface-subtle);
      }
      .btn.primary {
        background: var(--cq-accent);
        color: var(--cq-on-accent);
        border-color: transparent;
      }
      .btn.primary:hover {
        filter: brightness(1.06);
      }
      .btn.quiet {
        border-color: transparent;
        background: transparent;
        color: var(--cq-text-secondary);
      }
      .btn.sm {
        min-height: 36px;
        padding: 0 12px;
        font-size: 14px;
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--cq-border-subtle);
        position: sticky;
        top: 0;
        background: var(--cq-canvas);
        z-index: 5;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tab {
        min-height: 46px;
        padding: 0 14px;
        border: 0;
        background: none;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        color: var(--cq-text-secondary);
        cursor: pointer;
        font-weight: 500;
        display: flex;
        gap: 7px;
        align-items: center;
        white-space: nowrap;
      }
      .tab[aria-selected="true"] {
        color: var(--cq-text-primary);
        border-color: var(--cq-text-primary);
      }
      .tab .c {
        font-weight: 400;
        color: var(--cq-text-tertiary);
      }
      .tab .c.needs {
        color: var(--cq-accent);
        font-weight: 600;
      }
      .panel[hidden] {
        display: none;
      }
      h2 {
        font-size: 17px;
        font-weight: 600;
        margin: 0 0 10px;
      }
      .sub {
        color: var(--cq-text-secondary);
        font-size: 13px;
      }

      /* States: ring + glyph + words, never colour alone */
      .ring {
        --ring: var(--cq-border-strong);
        position: relative;
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--cq-surface-subtle);
        font-weight: 600;
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      .ring:before {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid var(--ring);
      }
      .ring .g {
        position: absolute;
        right: -6px;
        bottom: -6px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--cq-surface-raised);
        border: 1.5px solid var(--ring);
        color: var(--ring);
      }
      .ring .g svg {
        width: 12px;
        height: 12px;
      }
      .s-working .ring {
        --ring: var(--cq-accent);
      }
      .s-working .ring:after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: var(--cq-surface-raised);
        animation: spin 2.4s linear infinite;
        opacity: 0.9;
      }
      .s-thinking .ring {
        --ring: var(--cq-accent);
      }
      .s-thinking .ring:before {
        border-style: dashed;
      }
      .s-thinking .ring:after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px dashed var(--cq-accent);
        animation: breathe 2.8s ease-in-out infinite;
      }
      .s-waiting .ring {
        --ring: var(--cq-text-tertiary);
      }
      .s-waiting .ring:before {
        border-style: dotted;
        border-width: 2.5px;
      }
      .s-asking .ring {
        --ring: var(--cq-accent);
      }
      .s-asking .ring:before {
        border-width: 3px;
        box-shadow:
          0 0 0 3px var(--cq-surface-raised),
          0 0 0 5px var(--cq-accent);
      }
      .s-asking .ring {
        background: var(--cq-accent-soft);
        color: var(--cq-accent);
      }
      .s-held .ring {
        --ring: var(--cq-warning);
      }
      .s-held .ring:before {
        border-width: 2.5px;
      }
      .s-failed .ring {
        --ring: var(--cq-danger);
      }
      .s-failed .ring:before {
        border-width: 2.5px;
        border-style: double;
        border-width: 4px;
      }
      .s-done .ring {
        --ring: var(--cq-positive);
      }
      .s-idle .ring {
        --ring: var(--cq-border);
        color: var(--cq-text-tertiary);
        background: transparent;
      }
      .s-paused .ring {
        --ring: var(--cq-text-tertiary);
        color: var(--cq-text-secondary);
      }
      .s-paused .ring:before {
        border-style: dashed;
        border-width: 2px;
        opacity: 0.9;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes breathe {
        50% {
          transform: scale(1.08);
          opacity: 0.25;
        }
      }
      .label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        color: var(--cq-text-secondary);
      }
      .label svg {
        width: 14px;
        height: 14px;
      }
      .s-asking .label {
        color: var(--cq-accent);
        font-weight: 600;
      }
      .s-held .label {
        color: var(--cq-warning);
      }
      .s-failed .label {
        color: var(--cq-danger);
      }
      .s-done .label {
        color: var(--cq-positive);
      }

      /* Team: summary chips */
      .summary {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .chip {
        min-height: 36px;
        border-radius: 18px;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface-raised);
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        font-size: 13.5px;
      }
      .chip b {
        font-weight: 600;
      }
      .chip[aria-pressed="true"] {
        background: var(--cq-text-primary);
        color: var(--cq-canvas);
        border-color: transparent;
      }
      .chip.needs {
        border-color: var(--cq-accent);
        color: var(--cq-accent);
      }
      .chip.needs[aria-pressed="true"] {
        background: var(--cq-accent);
        color: var(--cq-on-accent);
      }
      .seg {
        margin-left: auto;
        display: inline-flex;
        border: 1px solid var(--cq-border);
        border-radius: 10px;
        padding: 2px;
        background: var(--cq-surface-raised);
      }
      .seg button {
        border: 0;
        background: none;
        min-height: 36px;
        padding: 0 12px;
        border-radius: 8px;
        cursor: pointer;
        color: var(--cq-text-secondary);
      }
      .seg button[aria-pressed="true"] {
        background: var(--cq-surface-subtle);
        color: var(--cq-text-primary);
        font-weight: 500;
      }

      /* Canvas */
      .viewport {
        position: relative;
        height: 600px;
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-lg);
        background: var(--cq-surface);
        overflow: hidden;
        touch-action: none;
        cursor: grab;
        background-image: radial-gradient(
          color-mix(in oklab, var(--cq-text-primary) 9%, transparent) 1px,
          transparent 1.2px
        );
        background-size: 24px 24px;
      }
      .viewport.drag {
        cursor: grabbing;
      }
      .world {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      .reduce .world,
      .world.snap {
        transition: none;
      }
      .world.ease {
        transition: transform var(--cq-motion-base) var(--cq-ease);
      }
      svg.links {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
      }
      .links line {
        stroke: var(--cq-border);
        stroke-width: 1.5;
      }
      .links line.live {
        stroke: var(--cq-accent);
        stroke-width: 1.75;
        opacity: 0.7;
      }
      .links line.ask {
        stroke: var(--cq-accent);
        stroke-width: 2;
        stroke-dasharray: 2 5;
      }
      .links line.peer {
        stroke-dasharray: 4 5;
      }
      .links circle {
        fill: var(--cq-accent);
      }
      .node {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 224px;
        border-radius: 14px;
        border: 1px solid var(--cq-border-subtle);
        background: var(--cq-surface-raised);
        padding: 12px 12px 12px 14px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 4px 12px;
        align-items: center;
        cursor: pointer;
        text-align: left;
        transition:
          box-shadow var(--cq-motion-fast),
          border-color var(--cq-motion-fast),
          opacity var(--cq-motion-base);
      }
      .node:hover,
      .node.sel {
        border-color: var(--cq-border-strong);
        box-shadow: 0 6px 24px -10px rgb(0 0 0/0.25);
      }
      .node.s-asking {
        border-color: var(--cq-accent);
      }
      .node.lead {
        width: 248px;
      }
      .node.lead .ring {
        background: var(--cq-text-primary);
        color: var(--cq-canvas);
        box-shadow: 0 0 28px 6px var(--cq-q-bloom);
      }
      .node .who {
        font-weight: 600;
        font-size: 15.5px;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .node .now {
        grid-column: 1/-1;
        font-size: 13.5px;
        color: var(--cq-text-secondary);
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-top: 6px;
      }
      .node .more {
        grid-column: 1/-1;
        display: none;
        border-top: 1px solid var(--cq-border-subtle);
        margin-top: 8px;
        padding-top: 8px;
        font-size: 12.5px;
        color: var(--cq-text-tertiary);
        gap: 4px;
        flex-direction: column;
      }
      .node .more div {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .node .act {
        grid-column: 1/-1;
        display: none;
        margin-top: 8px;
      }
      .node.s-asking .act {
        display: flex;
        gap: 6px;
      }
      .dim .node {
        opacity: 0.28;
      }
      .dim .node.match {
        opacity: 1;
      }
      /* semantic zoom */
      .z-far .node {
        transform: translate(-50%, -50%) scale(var(--inv, 1));
        width: auto;
        max-width: 150px;
        padding: 6px;
        border-color: transparent;
        background: transparent;
        display: flex;
        flex-direction: column;

    <script>
      const q = new URLSearchParams(location.search);
      document.body.dataset.theme = q.get("theme") || "bg-light";
      const reduce =
        q.get("motion") === "reduce" ||
        matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) document.body.classList.add("reduce");
      const budgetPause = q.get("pause") === "budget";

      const STATES = {
        working: { label: "Working", icon: "run" },
        thinking: { label: "Planning", icon: "plan" },
        waiting: { label: "Waiting on them", icon: "clock" },
        asking: { label: "Needs your OK", icon: "hand" },
        held: { label: "Held for you", icon: "alert" },
        failed: { label: "Didn't finish", icon: "x" },
        done: { label: "Done", icon: "check" },
        idle: { label: "Idle", icon: "moon" },
        paused: { label: "Paused", icon: "pause" },
      };

          body = `<div class="callout"><b>Doing now:</b> ${a.now}</div><div class="actions"><button class="btn">Open the job</button><button class="btn quiet">Stop this step</button></div>`;
        side.innerHTML = `<header class="s-${a.state} ${a.lead ? "lead" : ""}">${ring(a)}<div class="grow"><h3 id="sideTitle">${a.name}</h3>${lbl(a)}</div><button class="x" aria-label="Close" id="close">${icon("x").replace("aria-hidden", 'width="20" height="20" aria-hidden')}</button></header>
   <div class="body">${body}<dl class="kv"><dt>Job</dt><dd>${a.job || "—"}</dd><dt>Since</dt><dd class="num">${a.since ? a.since + " ago" : "—"}</dd><dt>Today</dt><dd class="num">${a.runs} runs · ${a.cost}</dd></dl><div><h2 style="font-size:14px">What happened</h2><ol class="log">${log}</ol></div></div>`;
        side.classList.add("show");
        scrim.classList.add("show");
        hideHover();
        setTimeout(() => document.getElementById("close").focus(), 50);
      }
      function closeSide() {
        side.classList.remove("show");
        scrim.classList.remove("show");
        document
          .querySelectorAll(".node.sel")
          .forEach((n) => n.classList.remove("sel"));
      }
      scrim.onclick = closeSide;
      side.addEventListener("click", (e) => {
        if (e.target.closest("#close")) closeSide();
      });
      addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeSide();
      });
      function approve(k) {
        const a = agents.find((x) => x.k === k);
        a.state = "working";
        a.now = "Sending your approved message to " + a.to;
        renderAll();
        closeSide();
        setTimeout(() => {
          a.state = "done";
          a.now = "Sent to " + a.to + ". Conversation watches for a reply.";
          renderAll();
        }, 1600);
      }
      document.addEventListener("click", (e) => {
        const ap = e.target.closest("[data-act=approve]");
        if (ap) {
          e.stopPropagation();
          approve(ap.dataset.k);
          return;
        }
        if (moved > 4) return;
        const n = e.target.closest(".node,.row,[data-open]");
        if (n) openAgent(n.dataset.k || n.dataset.open);
      });

      /* other tabs */
      function renderNeeds() {
        const asks = agents.filter((a) => a.state === "asking"),
          held = agents.filter((a) => a.state === "held");
        document.getElementById("p-needs").innerHTML = `
   ${asks
     .map(
       (
         a,
       ) => `<article class="card ask"><div class="ct s-asking">${ring(a)}<div class="grow"><h3>Approve a first message to ${a.to}</h3><div class="sub">Outreach · Meet three robotics founders · 4 min ago</div>
     <div class="draft" style="margin-top:10px">Hi Nadia, I read Fernhill’s note on picking cells for mid-size warehouses…</div>
     <div class="actions" style="margin-top:10px"><button class="btn primary" data-act="approve" data-k="${a.k}">Approve and send</button><button class="btn" data-open="${a.k}">Read all</button><button class="btn quiet">Not now</button></div><p class="fine">Nothing is sent until you approve this exact text.</p></div></div></article>`,
     )
     .join("")}
   ${held.map((a) => `<article class="card"><div class="ct s-held">${ring(a)}<div class="grow"><h3>A draft to Atlas Ventures was held</h3><div class="sub">${a.now}</div><div class="actions" style="margin-top:10px"><button class="btn" data-open="${a.k}">Read the draft</button><button class="btn quiet">Let Q try again</button></div></div></div></article>`).join("")}
   <article class="card"><div class="ct s-asking"><span class="ring" aria-hidden="true">Sc<span class="g">${icon("clock")}</span></span><div class="grow"><h3>Pick a time with Ines Marlow</h3><div class="sub">Scheduler · Book a call with Marlow & Co</div>
     <div class="actions" style="margin-top:10px"><button class="btn sm">Tue 10:00</button><button class="btn sm">Tue 15:30</button><button class="btn sm">Wed 09:00</button><button class="btn quiet sm">None work</button></div></div></div></article>
   ${asks.length + held.length === 0 ? '<p class="sub">Nothing else waits on you.</p>' : ""}`;
      }
      function renderProgress() {
        const jobs = [
          [
            "Meet three robotics founders",
            "You asked at 13:40 · Lead Q planned 4 steps",
            ["research", "documents", "writer", "outreach"],
            "$1.14",
          ],
          [
            "Follow up Atlas Ventures",
            "From your standing instruction",
            ["lead", "writer", "reviewer"],
            "$0.60",
          ],
          [
            "Keep Kestrel Bio warm",
            "From your standing instruction",
            ["conversation"],
            "$0.05",
          ],
          [
            "Book a call with Marlow & Co",
            "After your meeting",
            ["scheduler"],
            "$0.02",
          ],
        ];
        document.getElementById("p-progress").innerHTML = jobs
          .map(([t, sub, ks, c]) => {
            const as = ks.map((k) => agents.find((a) => a.k === k));
            const top =
              as.find((a) => a.state === "asking") ||
              as.find((a) => a.state === "held") ||
              as.find((a) => a.state === "failed") ||
              as[as.length - 1];
            return `<article class="card"><div class="ct"><div class="grow"><h3>${t}</h3><div class="sub">${sub}</div></div><span class="num sub">${c}</span></div>
    <div class="strip">${as.map((a) => `<span class="s-${a.state}" data-open="${a.k}" style="cursor:pointer" title="${a.name}: ${labelOf(a)}">${ring(a)}</span>`).join("")}<span class="s-${top.state}" style="margin-left:4px">${lbl(top)}</span></div>
    <div class="sub" style="margin-top:8px">${top.name}: ${top.now}</div></article>`;
          })
          .join("");
      }
      function renderDone() {
        const rows = Array.from(
          { length: 12 },
          (_, i) =>
            [
              ["Introduced you to Lumen Grid", "Sent · they replied"],
              ["Summarised your call with Atlas", "4 decisions, 2 follow-ups"],
              ["Read Kestrel Bio’s data room", "12 documents, 3 gaps"],
              ["Booked a call with Orbit Labs", "Thu 11:00"],
            ][i % 4],
        );
        document.getElementById("p-done").innerHTML =
          `<div class="card"><h2>This week <span class="sub num">12</span></h2>${rows.map(([t, d], i) => `<div class="donerow"><span>${t}<div class="sub">${d}</div></span><span class="sub num">${["Today", "Today", "Mon", "Sun"][i % 4]}</span></div>`).join("")}</div>`;
      }
      function renderCost() {
        const by = [
          ["Mandate watcher", 6.12],
          ["Writer", 4.3],
          ["Research", 3.85],
          ["Lead Q", 2.1],
          ["Reviewer", 1.41],
          ["Others", 0.62],
        ];
        const max = 6.12;
        document.getElementById("p-cost").innerHTML =
          `<div class="grid2"><div class="card"><div class="sub">This month</div><div class="big num" style="margin:8px 0 12px">$18.40</div><div class="bar lim"><i style="width:73.6%"></i></div><div class="sub" style="margin-top:8px">of your $25 limit · Q pauses new work and asks you at $25</div>
    <div class="actions" style="margin-top:12px"><button class="btn sm">Change limit</button></div></div>
   <div class="card"><h2>By specialist</h2>${by.map(([n, v]) => `<div class="costrow"><span>${n}</span><div class="bar"><i style="width:${(v / max) * 100}%"></i></div><span class="num" style="text-align:right">$${v.toFixed(2)}</span></div>`).join("")}</div></div>
   <div class="card" style="margin-top:16px"><h2>By job</h2>${[
     ["Meet three robotics founders", "$1.14", "$5 budget"],
     ["Follow up Atlas Ventures", "$0.60", "$2 budget"],
     ["Watch for B2B robotics, seed", "$12.20", "$15 a month"],
   ]
     .map(
       ([t, c, b]) =>
         `<div class="donerow"><span>${t}<div class="sub">${b}</div></span><span class="num">${c}</span></div>`,
     )
     .join("")}</div>`;
      }
      function renderLoading() {
        const sk = (h, w = "100%") =>
          `<div class="sk" style="height:${h}px;width:${w}"></div>`;
        document.getElementById("summary").innerHTML = [72, 84, 76, 64]
          .map(
            (w) =>
              `<div class="sk" style="height:36px;width:${w}px;border-radius:18px"></div>`,
          )
          .join("");
        document.getElementById("nodes").innerHTML = agents
          .map(
            (a) =>
              `<div class="node ${a.lead ? "lead" : ""}" style="left:${a.x}px;top:${a.y}px;cursor:default"><div class="sk" style="width:44px;height:44px;border-radius:50%"></div><div style="display:grid;gap:6px">${sk(14, "80%")}${sk(12, "60%")}</div><div class="now" style="display:grid;gap:6px">${sk(11)}${sk(11, "70%")}</div></div>`,
          )
          .join("");
        document.getElementById("links").innerHTML = "";
      }
      function renderAll() {
        renderTabs();
        renderSummary();
        renderNodes();
        renderNeeds();
        renderProgress();
        renderDone();
        renderCost();
      }
      renderAll();
      if (q.get("state") === "loading") renderLoading();
      document.getElementById("mapWrap").hidden = listMode;
      document.getElementById("listWrap").hidden = !listMode;
      requestAnimationFrame(() => {
        layout();
        renderNodes();
        if (q.get("state") === "loading") renderLoading();
        fit(false);
        document
          .getElementById("t-" + tab)
          ?.scrollIntoView({ inline: "center", block: "nearest" });
        if (q.get("open")) openAgent(q.get("open"));
      });
      addEventListener("resize", () => {
        layout();
        renderNodes();
        fit(false);
      });
    </script>
  </body>
</html>
