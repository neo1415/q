<html lang="en" data-theme="dark">

    <title>Investor promises (design)</title>
    <!--
  Investor promises: design screens for Q.07 "Investors interview the opportunity",
  Q.05 "Finds the right investors", Q.02 "Learns how each investor thinks" and
  Q.10 "Compares opportunities" (audit: docs/strategy/q-promises-2026-10-07.md).
  Fictional companies, investors and people only.

  Query: ?screen=assume|send|evidence|investors|gate|thesis|compare  &device=phone|desktop  &theme=dark|light
  With no screen, every screen is shown in both devices.

  Research, briefly (what the best tools do, and what we take):
  - Tegus / AlphaSense call prep and Carta diligence lists: claims as rows, each with a source
    and a status, and a question list you send. We take: one row per founder claim, truth class
    and evidence status as two separate labels, the questions one tap from the claim.
  - Ramp / Brex approvals: the exact payload is shown before Approve, and an edit means
    approving again. We take: "Send 3 questions" opens the exact request text first.
  - Crunchbase / Signal NFX investor lists: "invests in your stage, sector, geography" chips.
    We take the words, but only from what an investor PUBLISHES (their gate and public profile),
    and we say so. Private mandates never shape what a founder sees.
  - Spotify "Taste profile" / Netflix "Because you watched": behaviour shown back to the person.
    We take: what the investor did (saves, passes) shown apart from what they declared, and
    Q's reading of the gap labelled as Q's. Nothing changes the mandate without approval.
  - Airtable / Linear compare views: pick 2-4, rows aligned, "best of these" said in a word.

  Invariants on every screen: status in words with a shape (never colour alone); Unknown is
  neutral and reads "Not known yet"; no percentages or invented confidence; Q's inference is
  labelled as Q's; every send is Prepare -> Approve -> Execute; Pass stays neutral.
-->
    <style>
      :root {
        --cq-font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue",
          Arial, sans-serif;
        --cq-font-editorial: Georgia, "Times New Roman", serif;
        --cq-radius-sm: 8px;
        --cq-radius-md: 12px;
        --cq-radius-lg: 16px;
      }
      [data-theme="light"] {
        --cq-canvas: #f6f4ef;
        --cq-surface: #fbfaf7;
        --cq-surface-raised: #fff;
        --cq-surface-subtle: #f1ede4;
        --cq-text-primary: #16140f;
        --cq-text-secondary: #4f4a40;
        --cq-text-tertiary: #655e51;
        --cq-border-subtle: #e7e1d5;
        --cq-border: #d9d1c1;
        --cq-border-strong: #8f8673;
        --cq-accent: #8a6a12;
        --cq-accent-soft: #f3ead2;
        --cq-on-accent: #fff;
        --cq-positive: #2f6b3f;
        --cq-positive-soft: #e3efe2;
        --cq-developing: #6b5a1c;
        --cq-developing-soft: #f3ead2;
        --cq-gap: #8a4a12;
        --cq-gap-soft: #f6e6d6;
        --cq-unknown: #5d584e;
        --cq-unknown-soft: #ece8df;
        --cq-chrome: #16140f;
        --cq-chrome-text: #f4efe2;
        --cq-chrome-muted: #bfb6a2;
        --cq-chrome-border: #2f2b22;
        --cq-chrome-accent: #e2b858;
        --cq-q-light: #a8841c;
        --cq-q-bloom: #c9a22740;
      }
      [data-theme="dark"] {
        --cq-canvas: #0f0e0b;
        --cq-surface: #17150f;
        --cq-surface-raised: #1d1a13;
        --cq-surface-subtle: #24211a;
        --cq-text-primary: #f4efe2;
        --cq-text-secondary: #c9c0ab;
        --cq-text-tertiary: #a59c87;
        --cq-border-subtle: #2a261c;
        --cq-border: #3a3427;
        --cq-border-strong: #7a715c;
        --cq-accent: #c9a227;
        --cq-accent-soft: #2e2714;
        --cq-on-accent: #16140f;
        --cq-positive: #8fcf9c;
        --cq-positive-soft: #1d2a1f;
        --cq-developing: #e2c46a;
        --cq-developing-soft: #2e2714;
        --cq-gap: #f0a865;
        --cq-gap-soft: #33230f;
        --cq-unknown: #b7af9c;
        --cq-unknown-soft: #24211a;
        --cq-chrome: #0b0a08;
        --cq-chrome-text: #f4efe2;
        --cq-chrome-muted: #bfb6a2;
        --cq-chrome-border: #2a261c;
        --cq-chrome-accent: #e2b858;
        --cq-q-light: #e2b858;
        --cq-q-bloom: #e2b85855;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--cq-canvas);
        color: var(--cq-text-primary);
        font: 15px/1.45 var(--cq-font-sans);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
        padding: 32px;
        align-items: flex-start;
      }
      .gallery-title {
        width: 100%;
        margin: 0 0 4px;
        font: 600 13px/1 var(--cq-font-sans);
        color: var(--cq-text-tertiary);
      }
      .frame {
        border: 1px solid var(--cq-border);
        border-radius: 28px;
        overflow: hidden;
        background: var(--cq-canvas);
        flex: none;
      }
      .frame.phone {
        width: 390px;
        min-height: 844px;
      }
      .frame.desktop {
        width: 1280px;
        min-height: 820px;
        border-radius: 14px;
      }
      body.solo .gallery {
        padding: 0;
        gap: 0;
      }
      body.solo .frame {
        border: 0;
        border-radius: 0;
      }
      body.solo .gallery-title {
        display: none;
      }

      /* App chrome */
      .app {
        display: grid;
        grid-template-columns: 232px 1fr;
        min-height: 820px;
      }
      .phone .app {
        display: block;
        min-height: 844px;
      }
      .side {
        background: var(--cq-chrome);
        color: var(--cq-chrome-text);
        padding: 20px 14px;
        border-right: 1px solid var(--cq-chrome-border);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .phone .side {
        display: none;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 650;
        margin: 0 6px 18px;
      }
      .mark {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid var(--cq-chrome-accent);
        position: relative;
      }
      .mark:after {
        content: "";
        position: absolute;
        right: -5px;
        bottom: -4px;
        width: 8px;
        height: 2.5px;
        background: var(--cq-chrome-accent);
        transform: rotate(45deg);
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 9px;
        color: var(--cq-chrome-muted);
        font-size: 14px;
        min-height: 40px;
      }
      .nav.on {
        background: #ffffff12;
        color: var(--cq-chrome-text);
      }
      .nav i {
        width: 16px;
        height: 16px;
        border: 1.5px solid currentColor;
        border-radius: 4px;
        display: inline-block;
        opacity: 0.8;
      }
      .side .foot {
        margin-top: auto;
        font-size: 12px;
        color: var(--cq-chrome-muted);
        padding: 8px 10px;
      }
      .main {
        padding: 28px 36px 48px;
        max-width: 1048px;
      }
      .phone .main {
        padding: 12px 16px 96px;
      }
      .topbar {
        display: none;
      }
      .phone .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 6px;
        background: var(--cq-canvas);
      }
      .phone .topbar .brand {
        margin: 0;
        color: var(--cq-text-primary);
      }
      .phone .topbar .mark {
        border-color: var(--cq-accent);
      }
      .phone .topbar .mark:after {
        background: var(--cq-accent);
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--cq-surface-subtle);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--cq-text-secondary);
      }
      .tabbar {
        display: none;
      }
      .phone .tabbar {
        display: flex;
        position: sticky;
        bottom: 0;
        justify-content: space-around;
        border-top: 1px solid var(--cq-border-subtle);
        background: var(--cq-surface);
        padding: 8px 4px 22px;
      }
      .tabbar span {
        font-size: 11px;
        color: var(--cq-text-tertiary);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: 56px;
        min-height: 44px;
        justify-content: center;
      }
      .tabbar span i {
        width: 18px;
        height: 18px;
        border: 1.5px solid currentColor;
        border-radius: 5px;
      }
      .tabbar span.on {
        color: var(--cq-text-primary);
      }
      .phone .tabbar {
        position: absolute;
        left: 0;
        right: 0;
      }
      .phone {
        position: relative;
      }

      h1 {
        font: 600 26px/1.2 var(--cq-font-sans);
        letter-spacing: -0.01em;
        margin: 0 0 4px;
      }
      .phone h1 {
        font-size: 22px;
      }
      h2 {
        font: 600 17px/1.3 var(--cq-font-sans);
        margin: 0;
      }
      h3 {
        font: 600 15px/1.35 var(--cq-font-sans);
        margin: 0;
      }
      .sub {
        color: var(--cq-text-secondary);
        margin: 0;
      }
      .muted {
        color: var(--cq-text-tertiary);
        font-size: 13px;
      }
      .private {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--cq-text-tertiary);
      }
      .private:before {
        content: "";
        width: 9px;
        height: 11px;
        border: 1.5px solid currentColor;
        border-radius: 2px 2px 3px 3px;
        box-shadow: inset 0 -5px 0 -3px currentColor;
      }
      .section {
        margin-top: 28px;
      }
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .link {
        color: var(--cq-accent);
        font-size: 14px;
        font-weight: 550;
        text-decoration: none;
        white-space: nowrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface-raised);
        font-weight: 550;
        font-size: 14px;
        cursor: pointer;
      }
      .btn.primary {
        background: var(--cq-accent);
        border-color: var(--cq-accent);
        color: var(--cq-on-accent);
      }
      .btn.quiet {
        background: transparent;
        border-color: transparent;
        color: var(--cq-text-secondary);
      }
      .btn.sm {
        min-height: 36px;
        padding: 0 12px;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      /* Q line */
      .qline {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .qmark {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at 50% 50%,
          var(--cq-q-bloom),
          transparent 70%
        );
      }
      .qmark b {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 3px solid var(--cq-q-light);
        position: relative;
        display: block;
      }
      .qmark b:after {
        content: "";
        position: absolute;
        right: -6px;
        bottom: -5px;
        width: 9px;
        height: 3px;
        background: var(--cq-q-light);
        transform: rotate(45deg);
        border-radius: 2px;
      }
      .qsays {
        font: 400 19px/1.45 var(--cq-font-editorial);
      }
      .phone .qsays {
        font-size: 17px;
      }

      /* Next card */
      .next {
        margin-top: 18px;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface);
        border-radius: var(--cq-radius-lg);
        padding: 20px 22px;
      }
      .next .kicker {
        font-size: 12px;
        font-weight: 600;
        color: var(--cq-accent);
        margin-bottom: 6px;
      }
      .next p {
        margin: 6px 0 0;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      .chip {
        min-height: 40px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface-raised);
        display: inline-flex;
        align-items: center;
        font-size: 14px;
      }
      .answer {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .answer input {
        flex: 1;
        min-height: 44px;
        border-radius: 10px;
        border: 1px solid var(--cq-border);
        background: var(--cq-canvas);
        color: var(--cq-text-primary);
        padding: 0 12px;
        font: inherit;
      }

      /* Lists */
      .list {
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-lg);
        background: var(--cq-surface);
        overflow: hidden;
      }
      .item {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 12px;
        padding: 14px 18px;
        border-top: 1px solid var(--cq-border-subtle);
        align-items: start;
      }
      .item:first-child {
        border-top: 0;
      }
      .num {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px solid var(--cq-border-strong);
        display: grid;
        place-items: center;
        font-size: 12px;
        color: var(--cq-text-secondary);
        margin-top: 1px;
      }
      .item p {
        margin: 2px 0 0;
        color: var(--cq-text-secondary);
        font-size: 14px;
      }
      .owner {
        font-size: 12px;
        color: var(--cq-text-tertiary);
        white-space: nowrap;
        margin-top: 2px;
      }
      .phone .item {
        grid-template-columns: 28px 1fr;
      }
      .phone .item .owner {
        grid-column: 2;
        margin-top: 0;
      }
      .phone .queue .item {
        grid-template-columns: 1fr auto;
      }

      /* Status words with shapes: never colour alone */
      .st {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        padding: 3px 10px 3px 8px;
        border-radius: 999px;
      }
      .st:before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex: none;
        box-sizing: border-box;
      }
      .st.strong {
        color: var(--cq-positive);
        background: var(--cq-positive-soft);
      }
      .st.strong:before {
        background: currentColor;
      }
      .st.developing {
        color: var(--cq-developing);
        background: var(--cq-developing-soft);
      }
      .st.developing:before {
        border: 2px solid currentColor;
        background: linear-gradient(90deg, currentColor 50%, transparent 50%);
      }
      .st.gap {
        color: var(--cq-gap);
        background: var(--cq-gap-soft);
      }
      .st.gap:before {
        border: 2px solid currentColor;
        border-radius: 2px;
        transform: rotate(45deg) scale(0.85);
      }
      .st.unknown {
        color: var(--cq-unknown);
        background: var(--cq-unknown-soft);
        font-weight: 550;
      }
      .st.unknown:before {
        border: 1.5px dashed currentColor;
      }

      /* Readiness */
      .summary {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 20px;
        margin-top: 20px;
      }
      .phone .summary {
        grid-template-columns: 1fr;
      }
      .panel {
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-lg);
        background: var(--cq-surface);
        padding: 18px 20px;
      }
      .tally {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .blockers {
        counter-reset: b;
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
      }
      .blockers li {
        counter-increment: b;
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid var(--cq-border-subtle);
      }
      .blockers li:first-child {
        border-top: 0;
      }
      .blockers li:before {
        content: counter(b);
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--cq-gap-soft);
        color: var(--cq-gap);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
      }
      .blockers b {
        font-weight: 600;
      }
      .blockers span {
        display: block;
        color: var(--cq-text-secondary);
        font-size: 13.5px;
      }
      .pillars {
        margin-top: 20px;
      }
      .pillar {
        display: grid;
        grid-template-columns: 180px 132px 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 14px 18px;
        border-top: 1px solid var(--cq-border-subtle);
      }
      .pillar:first-child {
        border-top: 0;
      }
      .phone .pillar {
        grid-template-columns: 1fr auto;
        gap: 6px 12px;
      }
      .phone .pillar .why {
        grid-column: 1/-1;
      }
      .phone .pillar .ev {
        display: none;
      }
      .pillar .why {
        color: var(--cq-text-secondary);
        font-size: 14px;
      }
      .ev {
        font-size: 12.5px;
        color: var(--cq-text-tertiary);
        white-space: nowrap;
      }
      .pillar.open {
        background: var(--cq-surface-raised);
      }
      .drill {
        grid-column: 1/-1;
        margin-top: 6px;
        border-top: 1px dashed var(--cq-border);
        padding-top: 12px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .phone .drill {
        grid-template-columns: 1fr;
      }
      .drill h4 {
        margin: 0 0 8px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--cq-text-tertiary);
      }
      .evi {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 0;
        border-top: 1px solid var(--cq-border-subtle);
        font-size: 13.5px;
      }
      .evi:first-of-type {
        border-top: 0;
      }
      .tag {
        font-size: 11.5px;
        color: var(--cq-text-secondary);
        border: 1px solid var(--cq-border);
        border-radius: 6px;
        padding: 1px 6px;
        white-space: nowrap;
      }
      .drill ul {
        margin: 0;
        padding-left: 18px;
        color: var(--cq-text-secondary);
        font-size: 13.5px;
      }
      .drill li {
        margin: 4px 0;
      }

      /* Questions stack */
      .stack {
        position: relative;
        margin-top: 22px;
        padding-bottom: 22px;
      }
      .qcard {
        position: relative;
        z-index: 2;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface);
        border-radius: var(--cq-radius-lg);
        padding: 22px;
      }
      .ghost {
        position: absolute;
        left: 14px;
        right: 14px;
        height: 40px;
        bottom: 10px;
        border: 1px solid var(--cq-border-subtle);
        background: var(--cq-surface);
        border-radius: var(--cq-radius-lg);
        z-index: 1;
        opacity: 0.8;
      }
      .ghost.g2 {
        left: 28px;
        right: 28px;
        bottom: 0;
        opacity: 0.5;
      }
      .qcard .count {
        font-size: 12.5px;
        color: var(--cq-text-tertiary);
        display: flex;
        justify-content: space-between;
      }
      .qcard h2 {
        margin-top: 10px;
        font: 500 21px/1.35 var(--cq-font-editorial);
      }
      .whyq {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--cq-surface-subtle);
        font-size: 13.5px;
        color: var(--cq-text-secondary);
      }
      .whyq b {
        color: var(--cq-text-primary);
        font-weight: 600;
      }
      .readings {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .reading {
        border: 1px solid var(--cq-border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13.5px;
      }
      .reading small {
        display: block;
        color: var(--cq-text-tertiary);
        font-size: 12px;
      }
      .queue {
        margin-top: 8px;
      }
      .queue .item {
        grid-template-columns: 1fr auto;
      }

      /* Board */
      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 20px;
      }
      .col {
        background: var(--cq-surface-subtle);
        border-radius: var(--cq-radius-lg);
        padding: 12px;
        min-height: 420px;
      }
      .col-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 6px 10px;
        font-weight: 600;
        font-size: 14px;

      .col-head span {

        color: var(--cq-text-tertiary);
        font-size: 13px;

      .card {
        background: var(--cq-surface-raised);
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-md);
        padding: 14px;
        margin-bottom: 10px;
      }
      .card h3 {
        font-size: 14.5px;
      }
      .card .meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .pill {
        font-size: 11.5px;
        color: var(--cq-text-secondary);
        border: 1px solid var(--cq-border);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .card dl {
        margin: 10px 0 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 10px;
        font-size: 13px;
      }
      .card dt {
        color: var(--cq-text-tertiary);
      }
      .card dd {
        margin: 0;
        color: var(--cq-text-secondary);
      }
      .card .acts {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--cq-text-secondary);
        min-height: 36px;
      }
      .check:before {
        content: "";
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--cq-border-strong);
        border-radius: 5px;
      }
      .card.done {
        opacity: 0.85;
      }
      .card.done h3 {
        text-decoration: line-through;
        text-decoration-color: var(--cq-text-tertiary);

      .check.on:before {
        background: var(--cq-positive);
        border-color: var(--cq-positive);
        box-shadow: inset 0 0 0 3px var(--cq-surface-raised);
      }
      .byq {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12.5px;
        color: var(--cq-text-secondary);

        padding-top: 10px;

      .byq .qmark {
        width: 22px;
        height: 22px;
      }
      .byq .qmark b {
        width: 12px;
        height: 12px;
        border-width: 2px;
      }
      .byq .qmark b:after {
        width: 5px;
        height: 2px;
        right: -4px;
        bottom: -3px;
      }
      .seg {
        display: none;
      }
      .phone .board {
        grid-template-columns: 1fr;
      }
      .phone .col {
        min-height: 0;
        background: transparent;
        padding: 0;
      }
      .phone .col.hide {
        display: none;
      }
      .phone .col-head {

      .phone .seg {

      .seg span.on {
        background: var(--cq-surface-raised);
        color: var(--cq-text-primary);
        font-weight: 600;
        box-shadow: 0 0 0 1px var(--cq-border);

      /* Room */
      .thread {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-top: 12px;
      }
      .me {
        align-self: flex-end;
        background: var(--cq-surface-subtle);
        border-radius: 16px 16px 4px 16px;
        padding: 10px 14px;
        max-width: 80%;

      .qreply {
        align-self: flex-start;
        max-width: 100%;
        width: 100%;
      }
      .qreply .who {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--cq-text-tertiary);
        margin-bottom: 6px;

      .qreply .who .qmark {
        width: 26px;
        height: 26px;
      }
      .qreply .who .qmark b {
        width: 14px;
        height: 14px;
        border-width: 2.5px;
      }
      .qreply .who .qmark b:after {
        width: 6px;
        height: 2.5px;
        right: -4px;
        bottom: -3px;
      }
      .answer-card {
        border: 1px solid var(--cq-border);
        border-radius: var(--cq-radius-lg);
        background: var(--cq-surface);
        padding: 16px 18px;
        margin-top: 10px;
      }
      .answer-card .h {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 6px;
      }
      .mini {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 12px;

      .mini:first-of-type {

      }
      .composer {
        position: sticky;
        bottom: 0;
        margin-top: 24px;
        display: flex;
        gap: 8px;
        align-items: center;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface);
        border-radius: 999px;
        padding: 6px 6px 6px 18px;
        max-width: 760px;
        margin-left: auto;
        margin-right: auto;
      }
      .composer span {
        flex: 1;
        color: var(--cq-text-tertiary);
      }
      .mic {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--cq-accent);
        display: grid;
        place-items: center;
      }
      .mic:before {
        content: "";
        width: 8px;
        height: 14px;
        border-radius: 5px;
        background: var(--cq-on-accent);
      }
      .approval {
        margin-top: 10px;
        border: 1px solid var(--cq-accent);

        padding: 12px 14px;
        background: var(--cq-accent-soft);
      }
      .approval p {
        margin: 4px 0 10px;
        font-size: 13.5px;
        color: var(--cq-text-secondary);

      /* Investor promises */
      .crumb {

        color: var(--cq-text-tertiary);
        margin-bottom: 10px;

      .co {

      }
      .logo {

        height: 56px;

        place-items: center;

        color: var(--cq-text-secondary);

      .phone .logo {

        height: 48px;

      .tabs span {

      .tabs span.on {
        color: var(--cq-text-primary);
        border-color: var(--cq-text-primary);
      }
      .split {

        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 32px;
      }
      .phone .split {
        grid-template-columns: 1fr;
      }
      .aside {
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-lg);
        background: var(--cq-surface);
        padding: 16px 18px;
        align-self: start;

      .phone .aside {
        display: none;
      }
      .lbl {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--cq-text-secondary);
        border: 1px solid var(--cq-border);
        border-radius: 6px;
        padding: 1px 7px;

      .lbl.q {

        height: 8px;

        border: 1.5px solid var(--cq-q-light);

      .st.ev {
        color: var(--cq-positive);
        background: var(--cq-positive-soft);
      }
      .st.ev:before {
        background: currentColor;
      }
      .st.cl {
        color: var(--cq-developing);
        background: var(--cq-developing-soft);
      }
      .st.cl:before {
        border: 2px solid currentColor;
        background: linear-gradient(90deg, currentColor 50%, transparent 50%);
      }
      .st.sm {
        font-size: 12px;
        padding: 2px 8px 2px 7px;
      }
      .st.sm:before {
        width: 10px;
        height: 10px;
      }
      .asm {
        padding: 16px 18px;
        border-top: 1px solid var(--cq-border-subtle);
      }
      .asm:first-child {
        border-top: 0;
      }
      .asm .top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .phone .asm .top {
        flex-direction: column;
        gap: 6px;
      }
      .asm .claim {
        font-weight: 600;
        font-size: 15px;
      }
      .asm .labels {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
      }
      .asm .dep {
        margin-top: 10px;
        font-size: 13.5px;
        color: var(--cq-text-secondary);
      }
      .asm .dep b {
        font-weight: 600;
        color: var(--cq-text-tertiary);
        font-size: 12.5px;
        display: block;
        margin-bottom: 2px;
      }
      .qs {
        margin-top: 6px;
        display: flex;
        flex-direction: column;
      }
      .qs .check {
        font-size: 14px;
        color: var(--cq-text-primary);
        align-items: flex-start;
        min-height: 44px;
        padding-top: 10px;
      }
      .qs .check:before {
        flex: none;
        margin-top: 1px;
      }
      .qs .check.on:before {
        background: var(--cq-accent);
        border-color: var(--cq-accent);
        box-shadow: inset 0 0 0 3px var(--cq-surface);
      }
      .sendbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 12px 18px;
        border-top: 1px solid var(--cq-border);
        background: var(--cq-surface-raised);
      }
      .phone .sendbar {
        flex-direction: column;
        align-items: stretch;
      }
      .sendbar p {
        margin: 0;
        font-size: 13px;
        color: var(--cq-text-secondary);
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: #0009;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5;
      }
      .phone .scrim {
        align-items: flex-end;
      }
      .frame {
        position: relative;
      }
      .sheet {
        width: 560px;
        max-width: 100%;
        background: var(--cq-surface);
        border: 1px solid var(--cq-border);
        border-radius: var(--cq-radius-lg);
        padding: 22px;
      }
      .phone .sheet {
        border-radius: 20px 20px 0 0;
        padding: 20px 16px 28px;
      }
      .payload {
        margin-top: 14px;
        border: 1px solid var(--cq-border-subtle);
        background: var(--cq-canvas);
        border-radius: var(--cq-radius-md);
        padding: 14px 16px;
        font-size: 14px;
      }
      .payload ol {
        margin: 8px 0 0;
        padding-left: 20px;
      }
      .payload li {
        margin: 6px 0;
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 14px;
        font-size: 13.5px;
        margin: 12px 0 0;
      }
      .kv dt {
        color: var(--cq-text-tertiary);
      }
      .kv dd {
        margin: 0;
      }
      .ebw {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 10px;
      }
      .phone .ebw {
        grid-template-columns: 1fr;
      }
      .ebc {
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-md);
        padding: 10px 12px;
        background: var(--cq-surface-raised);
      }
      .ebc h4 {
        margin: 0 0 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
      }
      .ebc div {
        font-size: 13.5px;
        padding: 6px 0;
        border-top: 1px solid var(--cq-border-subtle);
      }
      .ebc div:first-of-type {
        border-top: 0;
      }
      .ebc small {
        display: block;
        color: var(--cq-text-tertiary);
        font-size: 12px;
      }
      .inv {
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-lg);
        background: var(--cq-surface);
        padding: 16px 18px;
        display: grid;
        grid-template-columns: 48px 1fr auto;
        gap: 14px;
        align-items: start;
      }
      .phone .inv {
        grid-template-columns: 40px 1fr;
      }
      .phone .inv .acts {
        grid-column: 1/-1;
      }
      .inv + .inv {
        margin-top: 12px;
      }
      .inv .logo {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        font-size: 13px;
      }
      .phone .inv .logo {
        width: 40px;
        height: 40px;
      }
      .gatebadge {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--cq-accent);
        border: 1px solid var(--cq-accent);
        border-radius: 999px;
        padding: 1px 9px;
        white-space: nowrap;
      }
      .gatebadge:before {
        content: "";
        width: 10px;
        height: 8px;
        border: 1.5px solid currentColor;
        border-bottom: 0;
        border-radius: 5px 5px 0 0;
      }
      .crit {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin-top: 8px;
        font-size: 13.5px;
        color: var(--cq-text-secondary);
      }
      .crit span {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .mk {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        flex: none;
      }
      .mk.y {
        background: var(--cq-positive-soft);
        color: var(--cq-positive);
      }
      .mk.y:before {
        content: "✓";
      }
      .mk.n {
        background: var(--cq-gap-soft);
        color: var(--cq-gap);
        border-radius: 3px;
      }
      .mk.n:before {
        content: "✕";
      }
      .mk.u {
        border: 1.5px dashed var(--cq-unknown);
        color: var(--cq-unknown);
      }
      .mk.u:before {
        content: "?";
        font-size: 10px;
      }
      .note {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--cq-surface-subtle);
        font-size: 13.5px;
        color: var(--cq-text-secondary);
      }
      .cols3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 18px;
      }
      .phone .cols3 {
        grid-template-columns: 1fr;
      }
      .colh {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .colh small {
        font-size: 12px;
        color: var(--cq-text-tertiary);
      }
      .rule {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid var(--cq-border-subtle);
        font-size: 14px;
      }
      .rule:first-of-type {
        border-top: 0;
      }
      .rule span:last-child {
        color: var(--cq-text-tertiary);
        font-size: 12.5px;
        white-space: nowrap;
      }
      .bar {
        display: grid;
        grid-template-columns: 110px 1fr 24px;
        gap: 8px;
        align-items: center;
        color: var(--cq-text-secondary);
        font-size: 13px;
        padding: 4px 0;
      }
      .bar i {
        height: 8px;
        border-radius: 4px;
        background: var(--cq-surface-subtle);
        position: relative;
        overflow: hidden;
      }
      .bar i b {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--cq-border-strong);
        border-radius: 4px;
      }
      .sugg {
        margin-top: 12px;
        border: 1px solid var(--cq-accent);
        background: var(--cq-accent-soft);
        border-radius: var(--cq-radius-md);
        padding: 14px 16px;
      }
      .sugg p {
        margin: 4px 0 10px;
        font-size: 13.5px;
        color: var(--cq-text-secondary);
      }
      .cmp {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 14px;
        margin-top: 16px;
        background: var(--cq-surface);
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-lg);
      }
      .cmp th,
      .cmp td {
        text-align: left;
        padding: 10px 14px;
        border-top: 1px solid var(--cq-border-subtle);
        vertical-align: top;
      }
      .cmp thead th {
        border-top: 0;
        font-weight: 600;
      }
      .cmp tbody th {
        font-weight: 500;
        color: var(--cq-text-tertiary);
        width: 150px;
      }
      .cmp td small {
        display: block;
        color: var(--cq-text-tertiary);
        font-size: 12px;
      }
      .best {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--cq-accent);
        border: 1px solid var(--cq-accent);
        border-radius: 6px;
        padding: 0 6px;
        margin-left: 6px;
        white-space: nowrap;
      }
      .saved {
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-lg);
        background: var(--cq-surface);
        overflow: hidden;
      }
      .srow {
        display: grid;
        grid-template-columns: 24px 40px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 10px 16px;
        border-top: 1px solid var(--cq-border-subtle);
        min-height: 56px;
      }
      .srow:first-child {
        border-top: 0;
      }
      .srow .logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        font-size: 12px;
      }
      .box {
        width: 20px;
        height: 20px;
        border: 1.5px solid var(--cq-border-strong);
        border-radius: 5px;
      }
      .box.on {
        background: var(--cq-accent);
        border-color: var(--cq-accent);
        box-shadow: inset 0 0 0 3px var(--cq-surface);
      }
      .cmpcards {
        display: none;
      }
      .phone .cmp {
        display: none;
      }
      .phone .cmpcards {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 14px;
      }
      .ccard {
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-lg);
        background: var(--cq-surface);
        padding: 14px 16px;
      }
      .ccard .mini {
        font-size: 13.5px;
      }
      .composer .mic {
        flex: none;
      }
      .phone .desk-only {
        display: none;
      }
    </style>
  </head>

    <script>
      const p = new URLSearchParams(location.search);
      const all = [
        "assume",
        "send",
        "evidence",
        "investors",
        "gate",
        "thesis",
        "compare",
      ];
      const screens = p.get("screen") ? [p.get("screen")] : all;
      const devices = p.get("device")
        ? [p.get("device")]
        : ["phone", "desktop"];
      document.documentElement.dataset.theme = p.get("theme") || "dark";
      if (p.get("screen") && p.get("device"))
        document.body.classList.add("solo");
      const g = document.getElementById("gallery");
      for (const s of screens) {
        for (const d of devices) {
          const t = document.createElement("div");
          t.className = "gallery-title";
          t.textContent = s + " · " + d;
          g.appendChild(t);
          const f = document.createElement("div");
          f.className = "frame " + d;
          f.appendChild(
            document.getElementById("t-" + s).content.cloneNode(true),
          );
          const app = f.querySelector(".app");
          if (app && app.dataset.side) {
            const side = document
              .getElementById("side-" + app.dataset.side)
              .content.cloneNode(true);
            const on = side.querySelector('[data-n="' + app.dataset.on + '"]');
            if (on) on.classList.add("on");
            app.prepend(side);
          }
          g.appendChild(f);
        }
      }
    </script>
