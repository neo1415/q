<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Overdeliver (design)</title>
    <!--
  Overdeliver: design screens for Q.01 interview depth (financials block + contradiction follow-up),
  Q.04 Readiness Blueprint web view ("Your 3/6/12-month plan" on Capital + Q room card) and
  Q.05 "What this investor looks for" with "Draft my application" (prepare -> founder approves).
  Audit: docs/strategy/q-promises-2026-10-07.md. Fictional company, people and figures only.
  Shares tokens and components with ../founder-readiness/index.html.

  Query: ?screen=interview|contradiction|plan|investor|room &device=phone|desktop &theme=dark|light

  Invariants on every screen: status in words with a shape (never colour alone); unknown reads
  "Not shared yet" / "Not known yet" in neutral grey and is never a "no"; founder-private label;
  cash, burn and runway never reach investors unless shared; both readings of a contradicted
  figure stay on record until the founder chooses; the investor page uses only the investor's
  public profile and published gate criteria (never the private mandate); nothing is sent to an
  investor until the founder presses Send on the existing GateQ form.
-->
    <style>
      :root {
        --cq-font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue",
          Arial, sans-serif;
        --cq-font-editorial: Georgia, "Times New Roman", serif;
        --cq-radius-sm: 8px;
        --cq-radius-md: 12px;
        --cq-radius-lg: 16px;
      }
      [data-theme="light"] {
        --cq-canvas: #f6f4ef;
        --cq-surface: #fbfaf7;
        --cq-surface-raised: #fff;
        --cq-surface-subtle: #f1ede4;
        --cq-text-primary: #16140f;
        --cq-text-secondary: #4f4a40;
        --cq-text-tertiary: #655e51;
        --cq-border-subtle: #e7e1d5;
        --cq-border: #d9d1c1;
        --cq-border-strong: #8f8673;
        --cq-accent: #8a6a12;
        --cq-accent-soft: #f3ead2;
        --cq-on-accent: #fff;
        --cq-positive: #2f6b3f;
        --cq-positive-soft: #e3efe2;
        --cq-developing: #6b5a1c;
        --cq-developing-soft: #f3ead2;
        --cq-gap: #8a4a12;
        --cq-gap-soft: #f6e6d6;
        --cq-unknown: #5d584e;
        --cq-unknown-soft: #ece8df;
        --cq-chrome: #16140f;
        --cq-chrome-text: #f4efe2;
        --cq-chrome-muted: #bfb6a2;
        --cq-chrome-border: #2f2b22;
        --cq-chrome-accent: #e2b858;
        --cq-q-light: #a8841c;
        --cq-q-bloom: #c9a22740;
      }
      [data-theme="dark"] {
        --cq-canvas: #0f0e0b;
        --cq-surface: #17150f;
        --cq-surface-raised: #1d1a13;
        --cq-surface-subtle: #24211a;
        --cq-text-primary: #f4efe2;
        --cq-text-secondary: #c9c0ab;
        --cq-text-tertiary: #a59c87;
        --cq-border-subtle: #2a261c;
        --cq-border: #3a3427;
        --cq-border-strong: #7a715c;
        --cq-accent: #c9a227;
        --cq-accent-soft: #2e2714;
        --cq-on-accent: #16140f;
        --cq-positive: #8fcf9c;
        --cq-positive-soft: #1d2a1f;
        --cq-developing: #e2c46a;
        --cq-developing-soft: #2e2714;
        --cq-gap: #f0a865;
        --cq-gap-soft: #33230f;
        --cq-unknown: #b7af9c;
        --cq-unknown-soft: #24211a;
        --cq-chrome: #0b0a08;
        --cq-chrome-text: #f4efe2;
        --cq-chrome-muted: #bfb6a2;
        --cq-chrome-border: #2a261c;
        --cq-chrome-accent: #e2b858;
        --cq-q-light: #e2b858;
        --cq-q-bloom: #e2b85855;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--cq-canvas);
        color: var(--cq-text-primary);
        font: 15px/1.45 var(--cq-font-sans);
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 40px;
        padding: 32px;
        align-items: flex-start;
      }
      .gallery-title {
        width: 100%;
        margin: 0 0 4px;
        font: 600 13px/1 var(--cq-font-sans);
        color: var(--cq-text-tertiary);
      }
      .frame {
        border: 1px solid var(--cq-border);
        border-radius: 28px;
        overflow: hidden;
        background: var(--cq-canvas);
        flex: none;
      }
      .frame.phone {
        width: 390px;
        min-height: 844px;
      }
      .frame.desktop {
        width: 1280px;
        min-height: 820px;
        border-radius: 14px;
      }
      body.solo .gallery {
        padding: 0;
        gap: 0;
      }
      body.solo .frame {
        border: 0;
        border-radius: 0;
      }
      body.solo .gallery-title {
        display: none;
      }

      /* App chrome */
      .app {
        display: grid;
        grid-template-columns: 232px 1fr;
        min-height: 820px;
      }
      .phone .app {
        display: block;
        min-height: 844px;
      }
      .side {
        background: var(--cq-chrome);
        color: var(--cq-chrome-text);
        padding: 20px 14px;
        border-right: 1px solid var(--cq-chrome-border);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .phone .side {
        display: none;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 650;
        margin: 0 6px 18px;
      }
      .mark {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid var(--cq-chrome-accent);
        position: relative;
      }
      .mark:after {
        content: "";
        position: absolute;
        right: -5px;
        bottom: -4px;
        width: 8px;
        height: 2.5px;
        background: var(--cq-chrome-accent);
        transform: rotate(45deg);
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 9px;
        color: var(--cq-chrome-muted);
        font-size: 14px;
        min-height: 40px;
      }
      .nav.on {
        background: #ffffff12;
        color: var(--cq-chrome-text);
      }
      .nav i {
        width: 16px;
        height: 16px;
        border: 1.5px solid currentColor;
        border-radius: 4px;
        display: inline-block;
        opacity: 0.8;
      }
      .side .foot {
        margin-top: auto;
        font-size: 12px;
        color: var(--cq-chrome-muted);
        padding: 8px 10px;
      }
      .main {
        padding: 28px 36px 48px;
        max-width: 1048px;
      }
      .phone .main {
        padding: 12px 16px 96px;
      }
      .topbar {
        display: none;
      }
      .phone .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 6px;
        background: var(--cq-canvas);
      }
      .phone .topbar .brand {
        margin: 0;
        color: var(--cq-text-primary);
      }
      .phone .topbar .mark {
        border-color: var(--cq-accent);
      }
      .phone .topbar .mark:after {
        background: var(--cq-accent);
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--cq-surface-subtle);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--cq-text-secondary);
      }
      .tabbar {
        display: none;
      }
      .phone .tabbar {
        display: flex;
        position: sticky;
        bottom: 0;
        justify-content: space-around;
        border-top: 1px solid var(--cq-border-subtle);
        background: var(--cq-surface);
        padding: 8px 4px 22px;
      }
      .tabbar span {
        font-size: 11px;
        color: var(--cq-text-tertiary);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: 56px;
        min-height: 44px;
        justify-content: center;
      }
      .tabbar span i {
        width: 18px;
        height: 18px;
        border: 1.5px solid currentColor;
        border-radius: 5px;
      }
      .tabbar span.on {
        color: var(--cq-text-primary);
      }
      .phone .tabbar {
        position: absolute;
        left: 0;
        right: 0;
      }
      .phone {
        position: relative;
      }

      h1 {
        font: 600 26px/1.2 var(--cq-font-sans);
        letter-spacing: -0.01em;
        margin: 0 0 4px;
      }
      .phone h1 {
        font-size: 22px;
      }
      h2 {
        font: 600 17px/1.3 var(--cq-font-sans);
        margin: 0;
      }
      h3 {
        font: 600 15px/1.35 var(--cq-font-sans);
        margin: 0;
      }
      .sub {
        color: var(--cq-text-secondary);
        margin: 0;
      }
      .muted {
        color: var(--cq-text-tertiary);
        font-size: 13px;
      }
      .private {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--cq-text-tertiary);
      }
      .private:before {
        content: "";
        width: 9px;
        height: 11px;
        border: 1.5px solid currentColor;
        border-radius: 2px 2px 3px 3px;
        box-shadow: inset 0 -5px 0 -3px currentColor;
      }
      .section {
        margin-top: 28px;
      }
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .link {
        color: var(--cq-accent);
        font-size: 14px;
        font-weight: 550;
        text-decoration: none;
        white-space: nowrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface-raised);
        font-weight: 550;
        font-size: 14px;
        cursor: pointer;
      }
      .btn.primary {
        background: var(--cq-accent);
        border-color: var(--cq-accent);
        color: var(--cq-on-accent);
      }
      .btn.quiet {
        background: transparent;
        border-color: transparent;
        color: var(--cq-text-secondary);
      }
      .btn.sm {
        min-height: 36px;
        padding: 0 12px;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      /* Q line */
      .qline {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .qmark {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at 50% 50%,
          var(--cq-q-bloom),
          transparent 70%
        );
      }
      .qmark b {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 3px solid var(--cq-q-light);
        position: relative;
        display: block;
      }
      .qmark b:after {
        content: "";
        position: absolute;
        right: -6px;
        bottom: -5px;
        width: 9px;
        height: 3px;
        background: var(--cq-q-light);
        transform: rotate(45deg);
        border-radius: 2px;
      }
      .qsays {
        font: 400 19px/1.45 var(--cq-font-editorial);
      }
      .phone .qsays {
        font-size: 17px;
      }

      /* Next card */
      .next {
        margin-top: 18px;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface);
        border-radius: var(--cq-radius-lg);
        padding: 20px 22px;
      }
      .next .kicker {
        font-size: 12px;
        font-weight: 600;
        color: var(--cq-accent);
        margin-bottom: 6px;
      }
      .next p {
        margin: 6px 0 0;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      .chip {
        min-height: 40px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface-raised);
        display: inline-flex;
        align-items: center;
        font-size: 14px;
      }
      .answer {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .answer input {
        flex: 1;
        min-height: 44px;
        border-radius: 10px;
        border: 1px solid var(--cq-border);
        background: var(--cq-canvas);
        color: var(--cq-text-primary);
        padding: 0 12px;
        font: inherit;
      }

      /* Lists */
      .list {
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-lg);
        background: var(--cq-surface);
        overflow: hidden;
      }
      .item {
        display: grid;
        grid-template-columns: 28px 1fr auto;
        gap: 12px;
        padding: 14px 18px;
        border-top: 1px solid var(--cq-border-subtle);
        align-items: start;
      }
      .item:first-child {
        border-top: 0;
      }
      .num {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 1px solid var(--cq-border-strong);
        display: grid;
        place-items: center;
        font-size: 12px;
        color: var(--cq-text-secondary);
        margin-top: 1px;
      }
      .item p {
        margin: 2px 0 0;
        color: var(--cq-text-secondary);
        font-size: 14px;
      }
      .owner {
        font-size: 12px;
        color: var(--cq-text-tertiary);
        white-space: nowrap;
        margin-top: 2px;
      }
      .phone .item {
        grid-template-columns: 28px 1fr;
      }
      .phone .item .owner {
        grid-column: 2;
        margin-top: 0;
      }
      .phone .queue .item {
        grid-template-columns: 1fr auto;
      }

      /* Status words with shapes: never colour alone */
      .st {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        padding: 3px 10px 3px 8px;
        border-radius: 999px;
      }
      .st:before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex: none;
        box-sizing: border-box;
      }
      .st.strong {
        color: var(--cq-positive);
        background: var(--cq-positive-soft);
      }
      .st.strong:before {
        background: currentColor;
      }
      .st.developing {
        color: var(--cq-developing);
        background: var(--cq-developing-soft);
      }
      .st.developing:before {
        border: 2px solid currentColor;
        background: linear-gradient(90deg, currentColor 50%, transparent 50%);
      }
      .st.gap {
        color: var(--cq-gap);
        background: var(--cq-gap-soft);
      }
      .st.gap:before {
        border: 2px solid currentColor;
        border-radius: 2px;
        transform: rotate(45deg) scale(0.85);
      }
      .st.unknown {
        color: var(--cq-unknown);
        background: var(--cq-unknown-soft);
        font-weight: 550;
      }
      .st.unknown:before {
        border: 1.5px dashed currentColor;
      }

      /* Readiness */
      .summary {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 20px;
        margin-top: 20px;
      }
      .phone .summary {
        grid-template-columns: 1fr;
      }
      .panel {
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-lg);
        background: var(--cq-surface);
        padding: 18px 20px;
      }
      .tally {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .blockers {
        counter-reset: b;
        margin: 10px 0 0;
        padding: 0;
        list-style: none;
      }
      .blockers li {
        counter-increment: b;
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid var(--cq-border-subtle);
      }
      .blockers li:first-child {
        border-top: 0;
      }
      .blockers li:before {
        content: counter(b);
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--cq-gap-soft);
        color: var(--cq-gap);
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 700;
      }
      .blockers b {
        font-weight: 600;
      }
      .blockers span {
        display: block;
        color: var(--cq-text-secondary);
        font-size: 13.5px;
      }
      .pillars {
        margin-top: 20px;
      }
      .pillar {
        display: grid;
        grid-template-columns: 180px 132px 1fr auto;
        gap: 16px;
        align-items: center;
        padding: 14px 18px;
        border-top: 1px solid var(--cq-border-subtle);
      }
      .pillar:first-child {
        border-top: 0;
      }
      .phone .pillar {
        grid-template-columns: 1fr auto;
        gap: 6px 12px;
      }
      .phone .pillar .why {
        grid-column: 1/-1;
      }
      .phone .pillar .ev {
        display: none;
      }
      .pillar .why {
        color: var(--cq-text-secondary);
        font-size: 14px;
      }
      .ev {
        font-size: 12.5px;
        color: var(--cq-text-tertiary);
        white-space: nowrap;
      }
      .pillar.open {
        background: var(--cq-surface-raised);
      }
      .drill {
        grid-column: 1/-1;
        margin-top: 6px;
        border-top: 1px dashed var(--cq-border);
        padding-top: 12px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .phone .drill {
        grid-template-columns: 1fr;
      }
      .drill h4 {
        margin: 0 0 8px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--cq-text-tertiary);
      }
      .evi {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 0;
        border-top: 1px solid var(--cq-border-subtle);
        font-size: 13.5px;
      }
      .evi:first-of-type {
        border-top: 0;
      }
      .tag {
        font-size: 11.5px;
        color: var(--cq-text-secondary);
        border: 1px solid var(--cq-border);
        border-radius: 6px;
        padding: 1px 6px;
        white-space: nowrap;
      }
      .drill ul {
        margin: 0;
        padding-left: 18px;
        color: var(--cq-text-secondary);
        font-size: 13.5px;
      }
      .drill li {
        margin: 4px 0;
      }

      /* Questions stack */
      .stack {
        position: relative;
        margin-top: 22px;
        padding-bottom: 22px;
      }
      .qcard {
        position: relative;
        z-index: 2;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface);
        border-radius: var(--cq-radius-lg);
        padding: 22px;
      }
      .ghost {
        position: absolute;
        left: 14px;
        right: 14px;
        height: 40px;
        bottom: 10px;
        border: 1px solid var(--cq-border-subtle);
        background: var(--cq-surface);
        border-radius: var(--cq-radius-lg);
        z-index: 1;
        opacity: 0.8;
      }
      .ghost.g2 {
        left: 28px;
        right: 28px;
        bottom: 0;
        opacity: 0.5;
      }
      .qcard .count {
        font-size: 12.5px;
        color: var(--cq-text-tertiary);
        display: flex;
        justify-content: space-between;
      }
      .qcard h2 {
        margin-top: 10px;
        font: 500 21px/1.35 var(--cq-font-editorial);
      }
      .whyq {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--cq-surface-subtle);
        font-size: 13.5px;
        color: var(--cq-text-secondary);
      }
      .whyq b {
        color: var(--cq-text-primary);
        font-weight: 600;
      }
      .readings {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }
      .reading {
        border: 1px solid var(--cq-border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13.5px;
      }
      .reading small {
        display: block;
        color: var(--cq-text-tertiary);
        font-size: 12px;
      }
      .queue {
        margin-top: 8px;
      }
      .queue .item {
        grid-template-columns: 1fr auto;
      }

      /* Board */
      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 20px;
      }
      .col {
        background: var(--cq-surface-subtle);
        border-radius: var(--cq-radius-lg);
        padding: 12px;
        min-height: 420px;
      }
      .col-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 6px 10px;
        font-weight: 600;
        font-size: 14px;
      }
      .col-head span {
        font-weight: 500;
        color: var(--cq-text-tertiary);
        font-size: 13px;
      }
      .card {
        background: var(--cq-surface-raised);
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-md);
        padding: 14px;
        margin-bottom: 10px;
      }
      .card h3 {

      .card .meta {

        justify-content: space-between;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .pill {
        font-size: 11.5px;
        color: var(--cq-text-secondary);
        border: 1px solid var(--cq-border);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .card dl {
        margin: 10px 0 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 10px;
        font-size: 13px;
      }
      .card dt {
        color: var(--cq-text-tertiary);
      }
      .card dd {
        margin: 0;
        color: var(--cq-text-secondary);
      }
      .card .acts {

        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--cq-text-secondary);
        min-height: 36px;
      }
      .check:before {
        content: "";
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--cq-border-strong);
        border-radius: 5px;
      }
      .card.done {
        opacity: 0.85;
      }
      .card.done h3 {
        text-decoration: line-through;
        text-decoration-color: var(--cq-text-tertiary);
      }
      .check.on:before {
        background: var(--cq-positive);
        border-color: var(--cq-positive);
        box-shadow: inset 0 0 0 3px var(--cq-surface-raised);
      }
      .byq {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12.5px;
        color: var(--cq-text-secondary);
        border-top: 1px dashed var(--cq-border);
        margin-top: 12px;
        padding-top: 10px;
      }
      .byq .qmark {
        width: 22px;
        height: 22px;
      }
      .byq .qmark b {
        width: 12px;
        height: 12px;
        border-width: 2px;
      }
      .byq .qmark b:after {
        width: 5px;
        height: 2px;
        right: -4px;
        bottom: -3px;
      }
      .seg {
        display: none;
      }
      .phone .board {
        grid-template-columns: 1fr;
      }
      .phone .col {
        min-height: 0;
        background: transparent;
        padding: 0;
      }
      .phone .col.hide {
        display: none;
      }
      .phone .col-head {
        display: none;
      }
      .phone .seg {
        display: flex;
        margin-top: 16px;
        border: 1px solid var(--cq-border);
        border-radius: 10px;
        padding: 3px;
        gap: 3px;

      .seg span {
        flex: 1;
        text-align: center;
        font-size: 14px;
        padding: 8px 0;
        border-radius: 8px;
        color: var(--cq-text-secondary);
        min-height: 40px;
      }
      .seg span.on {
        background: var(--cq-surface-raised);
        color: var(--cq-text-primary);
        font-weight: 600;
        box-shadow: 0 0 0 1px var(--cq-border);
      }

      /* Room */
      .thread {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-top: 12px;
      }
      .me {
        align-self: flex-end;
        background: var(--cq-surface-subtle);
        border-radius: 16px 16px 4px 16px;
        padding: 10px 14px;
        max-width: 80%;
      }
      .qreply {
        align-self: flex-start;
        max-width: 100%;
        width: 100%;
      }
      .qreply .who {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--cq-text-tertiary);
        margin-bottom: 6px;
      }
      .qreply .who .qmark {
        width: 26px;
        height: 26px;
      }
      .qreply .who .qmark b {
        width: 14px;
        height: 14px;
        border-width: 2.5px;
      }
      .qreply .who .qmark b:after {
        width: 6px;
        height: 2.5px;
        right: -4px;
        bottom: -3px;
      }
      .answer-card {
        border: 1px solid var(--cq-border);
        border-radius: var(--cq-radius-lg);
        background: var(--cq-surface);
        padding: 16px 18px;
        margin-top: 10px;
      }
      .answer-card .h {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 6px;
      }
      .mini {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 12px;
        font-size: 14px;
        padding: 6px 0;
        border-top: 1px solid var(--cq-border-subtle);
      }
      .mini:first-of-type {
        border-top: 0;
      }
      .composer {
        position: sticky;
        bottom: 0;
        margin-top: 24px;
        display: flex;
        gap: 8px;
        align-items: center;
        border: 1px solid var(--cq-border);
        background: var(--cq-surface);
        border-radius: 999px;
        padding: 6px 6px 6px 18px;
        max-width: 760px;
        margin-left: auto;
        margin-right: auto;
      }
      .composer span {
        flex: 1;
        color: var(--cq-text-tertiary);
      }
      .mic {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--cq-accent);
        display: grid;
        place-items: center;
      }
      .mic:before {
        content: "";
        width: 8px;
        height: 14px;
        border-radius: 5px;
        background: var(--cq-on-accent);
      }
      .approval {
        margin-top: 10px;
        border: 1px solid var(--cq-accent);
        border-radius: var(--cq-radius-md);
        padding: 12px 14px;
        background: var(--cq-accent-soft);

        margin: 4px 0 10px;
        font-size: 13.5px;
        color: var(--cq-text-secondary);
      }

      /* Overdeliver additions */
      .crumb {
        font-size: 13px;
        color: var(--cq-text-secondary);
        display: inline-flex;
        min-height: 44px;
        align-items: center;
      }
      .fin {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }
      .phone .fin {
        grid-template-columns: 1fr;
      }
      .fin .f {
        border: 1px solid var(--cq-border-subtle);
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--cq-surface);
      }
      .fin .f small {
        display: block;
        font-size: 12px;
        color: var(--cq-text-tertiary);
      }
      .fin .f b {
        font-weight: 600;
      }
      .fin .f.unk b {
        font-weight: 500;
        color: var(--cq-unknown);
      }
      .claimtag {
        font-size: 11.5px;
        color: var(--cq-text-tertiary);
        margin-top: 4px;
        display: block;
      }
      .money {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .money select,
      .money input {
        min-height: 44px;
        border-radius: 10px;
        border: 1px solid var(--cq-border);
        background: var(--cq-canvas);
        color: var(--cq-text-primary);
        padding: 0 12px;
        font: inherit;
      }
      .money input {
        flex: 1;
      }
      .horizon {
        display: inline-flex;
        border: 1px solid var(--cq-border);
        border-radius: 10px;
        padding: 3px;
        gap: 3px;
      }
      .horizon span {
        min-width: 64px;
        min-height: 38px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        font-size: 14px;
        color: var(--cq-text-secondary);
      }
      .horizon span.on {
        background: var(--cq-surface-raised);
        color: var(--cq-text-primary);
        font-weight: 600;
        box-shadow: 0 0 0 1px var(--cq-border);
      }
      .phases {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 18px;
      }
      .phone .phases {
        grid-template-columns: 1fr;
      }
      .phase {
        border: 1px solid var(--cq-border-subtle);
        border-radius: var(--cq-radius-lg);
        background: var(--cq-surface);
        padding: 14px;
      }
      .phase .ph {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .phase .ph span {
        font-size: 12.5px;
        color: var(--cq-text-tertiary);
      }
      .step {
        border-top: 1px solid var(--cq-border-subtle);
        padding: 10px 0;
      }
      .step:first-of-type {
        border-top: 0;
      }
      .step p {
        margin: 3px 0 0;
        font-size: 13.5px;
        color: var(--cq-text-secondary);
      }
      .step .m {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .crit {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 14px;
        padding: 12px 18px;
        border-top: 1px solid var(--cq-border-subtle);
        align-items: center;
      }
      .crit:first-child {
        border-top: 0;
      }
      .crit p {
        margin: 2px 0 0;
        font-size: 13.5px;
        color: var(--cq-text-secondary);
        grid-column: 1;
      }
      .st.met {
        color: var(--cq-positive);
        background: var(--cq-positive-soft);
      }
      .st.met:before {
        background: currentColor;
      }
      .st.notmet {
        color: var(--cq-gap);
        background: var(--cq-gap-soft);
      }
      .st.notmet:before {
        border: 2px solid currentColor;
        border-radius: 2px;
        transform: rotate(45deg) scale(0.85);
      }
      .draft dl {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 6px 12px;
        margin: 10px 0 0;
        font-size: 14px;
      }
      .phone .draft dl {
        grid-template-columns: 1fr;
      }
      .draft dt {
        color: var(--cq-text-tertiary);
      }
      .draft dd {
        margin: 0;
      }
      .src {
        font-size: 12px;
        color: var(--cq-text-tertiary);
        margin-top: 8px;
      }
    </style>
  </head>

    <!-- ============ Q.01: interview, financials block ============ -->
    <template id="t-interview">

                <span class="qmark"><b></b></span>Q

    <!-- ============ Q.01: contradiction follow-up ============ -->
    <template id="t-contradiction">

        <div class="avatar">AO</div>
      </div>
      <div class="app">
        <nav class="side">

          <div class="nav on"><i></i>Q</div>
          <div class="nav"><i></i>Company</div>
          <div class="nav"><i></i>Capital</div>
          <div class="nav"><i></i>Investors</div>
          <div class="nav"><i></i>GateQ</div>

          <div class="qline">
            <span class="qmark"><b></b></span>
            <div class="qsays">
              Two of your figures disagree. Which one is current?
            </div>
          </div>
          <div class="stack">
            <div class="qcard">
              <div class="count">
                <span>Q still wants to know · 1 of 2</span
                ><span class="private">Only your team sees this</span>
              </div>
              <h2>
                Your deck says monthly revenue is $14,000; you told me $18,000.
                Which is current?
              </h2>
              <div class="whyq">
                <b>Why Q asks:</b> investors compare the deck with what you tell
                them. Both figures stay on record until you choose; nothing is
                overwritten.
              </div>
              <div class="readings">
                <div class="reading">
                  <small>Pitch deck, page 7 · you confirmed this section</small

                </div>

                  <small>What you told Q today</small>USD 18,000

            <div class="ghost"></div>
            <div class="ghost g2"></div>

          <p class="muted">

            choice is recorded as yours, and the deck reading stays as the deck
            said it.
          </p>

    <script>
      const p = new URLSearchParams(location.search);
      const screens = p.get("screen")
        ? [p.get("screen")]
        : ["interview", "contradiction", "plan", "investor", "room"];
      const devices = p.get("device")
        ? [p.get("device")]
        : ["phone", "desktop"];
      document.documentElement.dataset.theme = p.get("theme") || "dark";
      if (p.get("screen") && p.get("device"))
        document.body.classList.add("solo");
      const g = document.getElementById("gallery");
      for (const s of screens) {
        for (const d of devices) {
          const t = document.createElement("div");
          t.className = "gallery-title";
          t.textContent = s + " · " + d;
          g.appendChild(t);
          const f = document.createElement("div");
          f.className = "frame " + d;
          f.appendChild(
            document.getElementById("t-" + s).content.cloneNode(true),
          );
          g.appendChild(f);
        }
      }
    </script>
